/* =====================================================
   RESET
===================================================== */

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }

body {
    font-family: "Cormorant Garamond", Georgia, serif;
    font-weight: 300;
    color: var(--fg);
    background: var(--bg);
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
}

img { display: block; max-width: 100%; }
button { font-family: "DM Sans", sans-serif; cursor: pointer; }
a { text-decoration: none; color: inherit; }


/* =====================================================
   PAGE BACKGROUND
===================================================== */

.page-background {
    position: fixed;
    inset: 0;
    z-index: -10;
    background: var(--bg);
}

.page-background::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
        radial-gradient(ellipse at 20% 20%, var(--accent-light), transparent 50%),
        radial-gradient(ellipse at 80% 80%, var(--accent-light), transparent 50%);
}


/* =====================================================
   FLOATING LIGHTS
===================================================== */

.light {
    position: fixed;
    width: 500px;
    height: 500px;
    border-radius: 50%;
    filter: blur(150px);
    opacity: .08;
    pointer-events: none;
    z-index: -5;
    animation: floatingLight 25s ease-in-out infinite;
}

.light-one {
    top: -150px;
    left: -150px;
    background: var(--accent);
}

.light-two {
    right: -150px;
    bottom: 10%;
    background: var(--gold);
    animation-delay: -12s;
}

@keyframes floatingLight {
    0%,100% { transform: translate(0,0) scale(1); }
    33% { transform: translate(50px,-30px) scale(1.05); }
    66% { transform: translate(-30px,40px) scale(.95); }
}


/* =====================================================
   OPENING SCREEN
===================================================== */

.opening {
    position: fixed;
    inset: 0;
    z-index: 999;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: var(--bg);
    transition: opacity 1.4s cubic-bezier(.4,0,.2,1), visibility 1.4s;
}

.opening.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}


/* =====================================================
   ENVELOPE
===================================================== */

.envelope-scene {
    position: relative;
    width: min(480px,85vw);
    perspective: 1200px;
}

.envelope {
    position: relative;
    width: 100%;
    padding-bottom: 68%;
    transform-style: preserve-3d;
    transition: transform .6s ease;
}

.envelope-body {
    position: absolute;
    inset: 0;
    background: var(--white);
    border: 1px solid var(--border-strong);
    overflow: hidden;
}

.envelope-body::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
        linear-gradient(135deg, transparent 49.5%, var(--border) 50%, transparent 50.5%),
        linear-gradient(-135deg, transparent 49.5%, var(--border) 50%, transparent 50.5%);
}

.envelope-body::after {
    content: "";
    position: absolute;
    inset: 8px;
    border: 1px solid var(--border);
}


/* =====================================================
   LETTER
===================================================== */

.letter {
    position: absolute;
    width: 84%;
    left: 8%;
    top: 8%;
    bottom: 8%;
    z-index: 3;
    background: var(--white);
    border: 1px solid var(--border-strong);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    transition: transform 1.8s cubic-bezier(.19,1,.22,1);
}

.letter::before {
    content: "";
    position: absolute;
    inset: 10px;
    border: 1px solid var(--border);
}

.letter-content {
    position: relative;
    z-index: 2;
    padding: 30px;
}

.letter-content small {
    font-family: "DM Sans", sans-serif;
    font-size: 8px;
    font-weight: 500;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: var(--accent);
}

.letter-content h1 {
    font-family: "Cormorant Garamond", serif;
    font-size: clamp(42px,7vw,68px);
    font-weight: 300;
    font-style: italic;
    line-height: 1.1;
    color: var(--fg-heading);
    margin: 18px 0 14px;
}

.letter-content p {
    font-family: "DM Sans", sans-serif;
    font-size: 10px;
    font-weight: 400;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--fg-muted);
}


/* =====================================================
   FLAP + SEAL
===================================================== */

.flap {
    position: absolute;
    inset: 0;
    z-index: 6;
    background: var(--white);
    border: 1px solid var(--border-strong);
    clip-path: polygon(0 0, 100% 0, 50% 65%);
    transform-origin: top center;
    transition: transform 1.5s cubic-bezier(.19,1,.22,1);
    backface-visibility: hidden;
}

.seal {
    position: absolute;
    z-index: 10;
    width: 50px;
    height: 50px;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%);
    border-radius: 50%;
    display: grid;
    place-items: center;
    font-family: "Cormorant Garamond", serif;
    font-size: 18px;
    font-weight: 400;
    font-style: italic;
    color: var(--white);
    background: var(--fg-heading);
    transition: opacity .6s ease, transform .8s cubic-bezier(.19,1,.22,1);
    box-shadow: 0 4px 20px rgba(62,37,24,.25);
}

.envelope.open .flap { transform: rotateX(180deg); }
.envelope.open .letter { transform: translateY(-110%); }
.envelope.open .seal { opacity: 0; transform: translateX(-50%) scale(.4); }


/* =====================================================
   OPEN BUTTON
===================================================== */

.open-button {
    margin-top: 40px;
    padding: 16px 40px;
    border: 1px solid var(--fg);
    background: transparent;
    color: var(--fg);
    font-family: "DM Sans", sans-serif;
    font-size: 9px;
    font-weight: 500;
    letter-spacing: 4px;
    text-transform: uppercase;
    transition: .4s ease;
    position: relative;
    overflow: hidden;
}

.open-button::before {
    content: "";
    position: absolute;
    inset: 0;
    background: var(--fg);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform .4s cubic-bezier(.4,0,.2,1);
    z-index: -1;
}

.open-button:hover {
    color: var(--white);
}

.open-button:hover::before {
    transform: scaleX(1);
}


/* =====================================================
   INVITATION + HERO
===================================================== */

.invitation {
    opacity: 0;
    transition: opacity 1.6s cubic-bezier(.4,0,.2,1);
}

.invitation.visible { opacity: 1; }

.hero {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 120px 24px;
    position: relative;
    overflow: hidden;
    background: var(--cover) center/cover no-repeat;
}

.hero::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
        radial-gradient(ellipse at 50% 40%, rgba(245,237,227,.60) 0%, transparent 60%),
        linear-gradient(to bottom, rgba(62,37,24,.05), rgba(62,37,24,.25));
    z-index: 1;
}

.hero::after {
    content: "";
    position: absolute;
    width: min(600px,80vw);
    height: min(600px,80vw);
    border-radius: 50%;
    border: 1px solid rgba(255,252,247,.10);
    z-index: 1;
    animation: heroPulse 8s ease-in-out infinite;
}

[data-design="noir"] .hero::before {
    background:
        radial-gradient(ellipse at 50% 40%, rgba(26,26,26,.40) 0%, transparent 60%),
        linear-gradient(to bottom, rgba(0,0,0,.20), rgba(0,0,0,.50));
}

@keyframes heroPulse {
    0%,100% { transform: scale(.96); opacity: .4; }
    50% { transform: scale(1.02); opacity: .8; }
}

.hero-content {
    position: relative;
    z-index: 2;
}

.hero-eyebrow {
    font-family: "DM Sans", sans-serif;
    font-size: 9px;
    font-weight: 500;
    letter-spacing: 6px;
    text-transform: uppercase;
    color: rgba(255,252,247,.6);
    margin-bottom: 10px;
}

.hero-names {
    margin-top: 24px;
}

.hero-names .name {
    display: block;
    font-family: "Cormorant Garamond", serif;
    font-size: clamp(64px,12vw,140px);
    font-weight: 300;
    font-style: italic;
    line-height: .85;
    color: var(--white);
    text-shadow: 0 2px 40px rgba(0,0,0,.15);
    animation: nameReveal 1.2s .3s cubic-bezier(.19,1,.22,1) both;
}

.hero-names .name:nth-child(3) {
    animation-delay: .5s;
}

@keyframes nameReveal {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
}

.hero-amp {
    display: block;
    font-family: "Allura", cursive;
    font-size: clamp(28px,4vw,44px);
    color: rgba(255,252,247,.40);
    margin: 8px 0;
    animation: nameReveal 1s .4s cubic-bezier(.19,1,.22,1) both;
}

.hero-date {
    margin-top: 40px;
    font-family: "DM Sans", sans-serif;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 7px;
    text-transform: uppercase;
    color: rgba(255,252,247,.55);
    animation: nameReveal 1s .7s cubic-bezier(.19,1,.22,1) both;
}

.hero-scroll {
    position: absolute;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    color: rgba(255,252,247,.4);
    font-family: "DM Sans", sans-serif;
    font-size: 8px;
    font-weight: 500;
    letter-spacing: 3px;
    text-transform: uppercase;
    animation: nameReveal 1s 1s cubic-bezier(.19,1,.22,1) both;
}

.hero-scroll::after {
    content: "";
    width: 1px;
    height: 35px;
    background: rgba(255,252,247,.3);
    animation: scrollPulse 2s ease-in-out infinite;
}

@keyframes scrollPulse {
    0%,100% { transform: scaleY(.4); opacity: .3; transform-origin: top; }
    50% { transform: scaleY(1); opacity: .8; transform-origin: top; }
}

.hero-video-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom, rgba(62,37,24,.30), rgba(62,37,24,.60));
    z-index: 1;
    pointer-events: none;
}

.hero-video-bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 0;
}


/* =====================================================
   SECTIONS
===================================================== */

.section {
    padding: 120px 8%;
    text-align: center;
}

.section-divider {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    margin: 0 auto 50px;
}

.section-divider::before,
.section-divider::after {
    content: "";
    width: 40px;
    height: 1px;
    background: var(--border-strong);
}

.section-divider span {
    font-size: 10px;
    color: var(--accent);
}

.section-eyebrow {
    font-family: "DM Sans", sans-serif;
    font-size: 9px;
    font-weight: 500;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 16px;
}

.section h2 {
    font-family: "Cormorant Garamond", serif;
    font-size: clamp(38px,6vw,64px);
    font-weight: 300;
    font-style: italic;
    line-height: 1.1;
    color: var(--fg-heading);
    margin-bottom: 30px;
}

.section-text {
    max-width: 480px;
    margin: auto;
    font-size: 16px;
    font-weight: 300;
    line-height: 2;
    color: var(--fg-muted);
}


/* =====================================================
   SCROLL REVEAL
===================================================== */

.reveal-up {
    opacity: 0;
    transform: translateY(40px);
    transition: opacity 1s cubic-bezier(.19,1,.22,1), transform 1s cubic-bezier(.19,1,.22,1);
}

.reveal-up.visible {
    opacity: 1;
    transform: translateY(0);
}

.reveal-scale {
    opacity: 0;
    transform: scale(.96);
    transition: opacity 1s ease, transform 1s cubic-bezier(.19,1,.22,1);
}

.reveal-scale.visible {
    opacity: 1;
    transform: scale(1);
}


/* =====================================================
   STORY SECTION
===================================================== */

.story-quote {
    position: relative;
    max-width: 560px;
    margin: 0 auto;
    padding: 0 40px;
}

.story-quote::before {
    content: "\201C";
    position: absolute;
    left: 0;
    top: -20px;
    font-family: "Cormorant Garamond", serif;
    font-size: 80px;
    font-weight: 300;
    color: var(--accent);
    opacity: .3;
    line-height: 1;
}


/* =====================================================
   DETAILS
===================================================== */

.details-section {
    background: var(--bg-alt);
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
}

.details-grid {
    max-width: 900px;
    margin: 50px auto 0;
    display: grid;
    grid-template-columns: repeat(3,1fr);
    border-top: 1px solid var(--border-strong);
    border-bottom: 1px solid var(--border-strong);
}

.detail {
    padding: 44px 20px;
    border-right: 1px solid var(--border-strong);
    transition: background .4s ease;
}

.detail:last-child { border-right: none; }
.detail:hover { background: var(--accent-light); }

.detail small {
    font-family: "DM Sans", sans-serif;
    font-size: 8px;
    font-weight: 500;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--accent);
}

.detail strong {
    display: block;
    margin: 18px 0 8px;
    font-family: "Cormorant Garamond", serif;
    font-size: 30px;
    font-weight: 300;
    font-style: italic;
    color: var(--fg-heading);
}

.detail p {
    font-size: 13px;
    font-weight: 300;
    color: var(--fg-muted);
}

.map-button {
    display: inline-block;
    margin-top: 18px;
    padding: 10px 22px;
    border: 1px solid var(--border-strong);
    font-family: "DM Sans", sans-serif;
    font-size: 8px;
    font-weight: 500;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--fg);
    transition: .35s ease;
    position: relative;
    overflow: hidden;
}

.map-button::before {
    content: "";
    position: absolute;
    inset: 0;
    background: var(--fg);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform .35s cubic-bezier(.4,0,.2,1);
    z-index: -1;
}

.map-button:hover { color: var(--white); }
.map-button:hover::before { transform: scaleX(1); }


/* =====================================================
   GALLERY
===================================================== */

.gallery-section { padding-left: 0; padding-right: 0; }

.gallery {
    width: 100%;
    margin-top: 50px;
}

.gallery img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: saturate(.9);
    transition: transform 1.4s cubic-bezier(.19,1,.22,1), filter .6s ease;
    cursor: pointer;
    display: block;
}

.gallery img:hover {
    transform: scale(1.03);
    filter: saturate(1.05);
}

.gallery img[onerror] {
    display: none;
}

/* Gallery Style: Editorial — asymmetric 2-column with large hero */
.gallery-style-editorial {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
}
.gallery-style-editorial img:first-child {
    grid-column: 1 / -1;
    height: 400px;
}
.gallery-style-editorial img {
    height: 260px;
}

/* Gallery Style: Masonry — Pinterest-style columns */
.gallery-style-masonry {
    column-count: 3;
    column-gap: 6px;
}
.gallery-style-masonry img {
    width: 100%;
    height: auto;
    margin-bottom: 6px;
    break-inside: avoid;
}

/* Gallery Style: Polaroid — centered with padding and slight rotation */
.gallery-style-polaroid {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    justify-content: center;
    padding: 20px 0;
}
.gallery-style-polaroid img {
    width: 220px;
    height: 280px;
    box-shadow: 0 4px 20px rgba(0,0,0,.15);
    border-radius: 2px;
    padding: 8px 8px 40px 8px;
    background: var(--white, #FFFCF7);
    transition: transform 0.6s cubic-bezier(.19,1,.22,1);
}
.gallery-style-polaroid img:nth-child(odd) { transform: rotate(-2deg); }
.gallery-style-polaroid img:nth-child(even) { transform: rotate(2deg); }
.gallery-style-polaroid img:hover { transform: rotate(0deg) scale(1.05); }

/* Gallery Style: Fullscreen — single image at a time, stacked vertically */
.gallery-style-fullscreen {
    display: flex;
    flex-direction: column;
    gap: 0;
}
.gallery-style-fullscreen img {
    width: 100%;
    height: 80vh;
    min-height: 400px;
}

/* Gallery Style: Collage — organic overlapping layout */
.gallery-style-collage {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(3, 200px);
    gap: 8px;
}
.gallery-style-collage img:nth-child(1) { grid-column: 1 / 3; grid-row: 1 / 3; }
.gallery-style-collage img:nth-child(2) { grid-column: 3 / 5; grid-row: 1 / 2; }
.gallery-style-collage img:nth-child(3) { grid-column: 3 / 4; grid-row: 2 / 3; }
.gallery-style-collage img:nth-child(4) { grid-column: 4 / 5; grid-row: 2 / 3; }
.gallery-style-collage img:nth-child(5) { grid-column: 1 / 3; grid-row: 3 / 4; }
.gallery-style-collage img:nth-child(6) { grid-column: 3 / 5; grid-row: 3 / 4; }

/* Gallery Style: Slider — horizontal scroll */
.gallery-style-slider {
    display: flex;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    gap: 12px;
    padding: 10px 0;
    -webkit-overflow-scrolling: touch;
}
.gallery-style-slider::-webkit-scrollbar { height: 4px; }
.gallery-style-slider::-webkit-scrollbar-thumb { background: var(--accent, #C4A882); border-radius: 2px; }
.gallery-style-slider img {
    flex: 0 0 80%;
    max-width: 400px;
    height: 320px;
    scroll-snap-align: center;
    border-radius: 4px;
}

/* Gallery Style: Grid — clean uniform grid (default fallback) */
.gallery-style-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
}
.gallery-style-grid img {
    height: 250px;
}

/* Single image layout — always beautiful */
.gallery img:only-child {
    width: 100%;
    max-height: 500px;
    height: auto;
    object-fit: cover;
    border-radius: 4px;
}

/* Two images — side by side */
.gallery-style-grid img:nth-child(1):nth-last-child(1),
.gallery-style-editorial img:nth-child(1):nth-last-child(1) {
    grid-column: 1 / -1;
}

/* Single image for non-grid styles */
.gallery-style-masonry img:only-child,
.gallery-style-collage img:only-child {
    column-span: all;
    width: 100%;
    max-height: 500px;
}
.gallery-style-collage img:only-child {
    grid-column: 1 / -1;
    grid-row: 1 / -1;
}


/* =====================================================
   LIGHTBOX
===================================================== */

.lightbox {
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: rgba(0,0,0,.92);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    visibility: hidden;
    transition: opacity .4s ease, visibility .4s;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
}

.lightbox.active {
    opacity: 1;
    visibility: visible;
}

.lightbox img {
    max-width: 90vw;
    max-height: 85vh;
    object-fit: contain;
    border-radius: 2px;
    box-shadow: 0 8px 60px rgba(0,0,0,.5);
    transform: scale(.92);
    transition: transform .5s cubic-bezier(.19,1,.22,1);
}

.lightbox.active img {
    transform: scale(1);
}

.lightbox-close {
    position: absolute;
    top: 24px;
    right: 24px;
    width: 44px;
    height: 44px;
    border: 1px solid rgba(255,255,255,.2);
    border-radius: 50%;
    background: transparent;
    color: #fff;
    font-size: 18px;
    display: grid;
    place-items: center;
    cursor: pointer;
    transition: .3s ease;
}

.lightbox-close:hover {
    background: rgba(255,255,255,.15);
}

.lightbox-nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 48px;
    height: 48px;
    border: 1px solid rgba(255,255,255,.15);
    border-radius: 50%;
    background: transparent;
    color: #fff;
    font-size: 20px;
    display: grid;
    place-items: center;
    cursor: pointer;
    transition: .3s ease;
}

.lightbox-nav:hover {
    background: rgba(255,255,255,.1);
}

.lightbox-prev { left: 20px; }
.lightbox-next { right: 20px; }

.lightbox-counter {
    position: absolute;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    font-family: "DM Sans", sans-serif;
    font-size: 11px;
    letter-spacing: 3px;
    color: rgba(255,255,255,.5);
}


/* =====================================================
   COUNTDOWN
===================================================== */

.countdown-section {
    position: relative;
    background: var(--fg-heading);
    color: var(--white);
    overflow: hidden;
}

.countdown-section::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
        radial-gradient(ellipse at 30% 50%, rgba(196,168,130,.08), transparent 50%),
        radial-gradient(ellipse at 70% 50%, rgba(196,168,130,.05), transparent 50%);
}

.countdown-section::after {
    content: "";
    position: absolute;
    width: min(500px,70vw);
    height: min(500px,70vw);
    border-radius: 50%;
    border: 1px solid rgba(255,252,247,.05);
    left: 50%;
    top: 50%;
    transform: translate(-50%,-50%);
    pointer-events: none;
}

.countdown-section .section-eyebrow {
    position: relative;
    color: var(--accent);
}

.countdown-section h2 {
    position: relative;
    color: var(--white);
    margin-top: 14px;
    margin-bottom: 0;
}

.timer {
    position: relative;
    max-width: 700px;
    margin: 55px auto 0;
    display: grid;
    grid-template-columns: repeat(4,1fr);
    border-top: 1px solid rgba(255,252,247,.08);
    border-bottom: 1px solid rgba(255,252,247,.08);
}

.timer div {
    position: relative;
    padding: 30px 16px;
    text-align: center;
}

.timer div:not(:last-child)::after {
    content: "";
    position: absolute;
    right: 0;
    top: 25%;
    width: 1px;
    height: 50%;
    background: rgba(255,252,247,.08);
}

.timer strong {
    display: block;
    font-family: "Cormorant Garamond", serif;
    font-size: clamp(42px,5vw,70px);
    font-weight: 300;
    font-style: italic;
    color: var(--white);
    line-height: 1;
    font-variant-numeric: tabular-nums;
    min-width: 2ch;
}

.timer span {
    display: block;
    margin-top: 12px;
    font-family: "DM Sans", sans-serif;
    font-size: 8px;
    font-weight: 500;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--accent);
}


/* =====================================================
   RSVP
===================================================== */

.rsvp-section {
    background: var(--bg-alt);
    border-top: 1px solid var(--border);
}

.rsvp-button {
    margin-top: 32px;
    padding: 16px 36px;
    border: 1px solid var(--fg);
    background: transparent;
    color: var(--fg);
    font-family: "DM Sans", sans-serif;
    font-size: 9px;
    font-weight: 500;
    letter-spacing: 3px;
    text-transform: uppercase;
    transition: .4s ease;
    position: relative;
    overflow: hidden;
}

.rsvp-button::before {
    content: "";
    position: absolute;
    inset: 0;
    background: var(--fg);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform .4s cubic-bezier(.4,0,.2,1);
    z-index: -1;
}

.rsvp-button:hover { color: var(--white); }
.rsvp-button:hover::before { transform: scaleX(1); }

.rsvp-form {
    margin-top: 24px;
    display: grid;
    gap: 12px;
    max-width: 340px;
    margin-left: auto;
    margin-right: auto;
}

.rsvp-form input,
.rsvp-form select {
    width: 100%;
    padding: 14px 18px;
    border: 1px solid var(--border-strong);
    background: var(--white);
    font-family: "DM Sans", sans-serif;
    font-size: 13px;
    color: var(--fg);
    border-radius: 0;
    transition: border-color .3s ease;
    -webkit-appearance: none;
}

.rsvp-form input:focus,
.rsvp-form select:focus {
    outline: none;
    border-color: var(--fg);
}

.rsvp-form[hidden],
#rsvpThanks[hidden],
.music-button[hidden] { display: none !important; }

#rsvpThanks {
    margin-top: 24px;
    font-family: "Cormorant Garamond", serif;
    font-size: 20px;
    font-style: italic;
    color: var(--fg-muted);
}

.music-button {
    position: fixed;
    right: 24px;
    bottom: 24px;
    z-index: 40;
    border: 1px solid var(--border-strong);
    border-radius: 0;
    padding: 12px 18px;
    background: var(--white);
    color: var(--fg);
    font-family: "DM Sans", sans-serif;
    font-size: 9px;
    font-weight: 500;
    letter-spacing: 2px;
    text-transform: uppercase;
    transition: .35s ease;
}

.music-button:hover {
    background: var(--fg);
    color: var(--white);
    border-color: var(--fg);
}

.rsvp-counts {
    display: flex;
    justify-content: center;
    gap: 32px;
    margin-top: 24px;
    font-family: "DM Sans", sans-serif;
    font-size: 9px;
    font-weight: 500;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--fg-muted);
}

.rsvp-counts[hidden] { display: none !important; }

.rsvp-counts span {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
}

.rsvp-counts strong {
    font-family: "Cormorant Garamond", serif;
    font-size: 28px;
    font-weight: 300;
    font-style: italic;
    color: var(--fg-heading);
}


/* =====================================================
   FOOTER
===================================================== */

footer {
    padding: 80px 24px;
    text-align: center;
    background: var(--fg-heading);
    color: var(--bg);
    position: relative;
    overflow: hidden;
}

footer::before {
    content: "";
    position: absolute;
    width: min(400px,60vw);
    height: min(400px,60vw);
    border-radius: 50%;
    border: 1px solid rgba(255,252,247,.04);
    left: 50%;
    top: 50%;
    transform: translate(-50%,-50%);
    pointer-events: none;
}

footer strong {
    position: relative;
    font-family: "Cormorant Garamond", serif;
    font-size: clamp(48px,8vw,72px);
    font-weight: 300;
    font-style: italic;
    display: block;
}

footer p {
    position: relative;
    font-family: "DM Sans", sans-serif;
    font-size: 8px;
    font-weight: 500;
    letter-spacing: 5px;
    text-transform: uppercase;
    margin-top: 18px;
    color: var(--accent);
    opacity: .6;
}


/* =====================================================
   404 PAGE
===================================================== */

.not-found {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px;
    background: var(--bg);
    position: relative;
    overflow: hidden;
}

.not-found::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
        radial-gradient(ellipse at 30% 30%, var(--accent-light), transparent 50%),
        radial-gradient(ellipse at 70% 70%, var(--accent-light), transparent 50%);
}

.not-found-content {
    position: relative;
    z-index: 1;
}

.not-found-icon {
    font-size: 48px;
    margin-bottom: 32px;
    opacity: .25;
}

.not-found h1 {
    font-family: "Cormorant Garamond", serif;
    font-size: clamp(42px,8vw,72px);
    font-weight: 300;
    font-style: italic;
    color: var(--fg-heading);
    margin-bottom: 16px;
    line-height: 1.1;
}

.not-found p {
    font-family: "DM Sans", sans-serif;
    font-size: 13px;
    color: var(--fg-muted);
    margin-bottom: 40px;
    letter-spacing: 1px;
}

.not-found-brand {
    font-family: "DM Sans", sans-serif;
    font-size: 8px;
    font-weight: 500;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: var(--accent);
    opacity: .5;
    margin-top: 60px;
}


/* =====================================================
   HIDDEN UTILITY
===================================================== */

[hidden] { display: none !important; }


/* =====================================================
   OPENING STYLE VARIANTS
===================================================== */

.opening-elegant .envelope-scene { /* default — keep existing */ }

.opening-editorial .envelope { border-radius: 0; }
.opening-editorial .envelope-body { background: transparent; border: none; }
.opening-editorial .letter { font-family: "Italiana", serif; font-size: 18px; letter-spacing: 4px; text-transform: uppercase; }
.opening-editorial .envelope-scene { background: linear-gradient(135deg, #1a1410, #2a1f16); }
.opening-editorial .envelope-body { border: 1px solid rgba(196,168,130,.3); }
.opening-editorial .seal { background: var(--gold); }

.opening-floral .envelope-scene { background: linear-gradient(to bottom, #f5ede3, #efe4d6); }
.opening-floral .envelope-body { border: 2px solid rgba(196,168,130,.3); border-radius: 4px; }
.opening-floral .seal { background: #d4a574; box-shadow: 0 0 30px rgba(196,168,130,.3); }
.opening-floral .letter { background: #fff; border: 1px solid rgba(196,168,130,.15); }

.opening-luxury .envelope-scene { background: linear-gradient(135deg, #0a0a0a, #1a1410); }
.opening-luxury .envelope-body { background: #1a1410; border-color: rgba(196,168,130,.2); }
.opening-luxury .seal { background: linear-gradient(135deg, #c4a882, #d4b892); }
.opening-luxury .letter { background: #1a1410; color: #f5ede3; }
.opening-luxury .letter .names { color: var(--gold); }

.opening-minimal .envelope-scene { background: #fff; }
.opening-minimal .envelope { border: none; box-shadow: none; }
.opening-minimal .envelope-body { background: transparent; border: 1px solid rgba(0,0,0,.1); }
.opening-minimal .seal { background: #333; width: 40px; height: 40px; }

<script>

/* =====================================================
   INITIALIZATION
===================================================== */

var params = new URLSearchParams(window.location.search);
var invitationId = (params.get("id") || localStorage.getItem("luna_last_invitation") || "").toLowerCase().trim();
var invitation = invitationId ? lunaGetInvitation(invitationId) : null;

if (!invitation) {
    document.title = "Invitation Not Found | Luna";
    document.body.innerHTML = '<div class="not-found"><div class="not-found-content"><div class="not-found-icon">&#9825;</div><h1>Invitation Not Found</h1><p>This invitation may have been removed or the link is incorrect.</p><div class="not-found-brand">LUNA</div></div></div>';
    throw new Error("Invitation not found: " + invitationId);
}

/* Approval gate — admin must approve before client gains access */
var _isLunaOwner = false;
try { _isLunaOwner = !!localStorage.getItem("luna_form_config"); } catch (e) {}
if (invitation.approved === false && !_isLunaOwner) {
    document.title = "Luna";
    document.body.innerHTML = '<div class="not-found"><div class="not-found-content"><div class="not-found-icon">&#8987;</div><h1>Sifarişiniz qəbul olundu</h1><p>Dəvətnaməniz hazırlanır. Ödəniş təsdiqləndikdən sonra link aktivləşəcək və sizinlə paylaşılacaq.</p><div class="not-found-brand">LUNA</div></div></div>';
    throw new Error("Invitation pending approval: " + invitationId);
}

lunaInitLanguage();
document.title = lunaDisplayNames(invitation) + " | Luna Invitation";

/* Apply design theme */
if (invitation.design) {
    document.documentElement.setAttribute("data-design", invitation.design.toLowerCase());
}

/* Determine experience type */
var experienceType = invitation.experienceType || "static";
var sceneConfig = invitation.scenes || null;

if (experienceType === "interactive" && sceneConfig) {
    startInteractiveExperience(sceneConfig);
} else {
    showStaticInvitation();
}

/* =====================================================
   INTERACTIVE EXPERIENCE
===================================================== */

function startInteractiveExperience(config) {
    var engineEl = document.getElementById("sceneEngine");

    engineEl.style.display = "";

    /* Build customer data for interpolation */
    var customerData = buildCustomerData();

    /* Create scene engine */
    var engine = new LunaSceneEngine(
        {
            scenes: config.scenes,
            interactionType: config.interactionType || "clickJourney",
            onComplete: function() {
                revealMainInvitation(customerData);
            }
        },
        engineEl,
        customerData
    );

    engine.init();
}

function buildCustomerData() {
    var d = invitation;
    var displayDate = d.dateShort || lunaDateShort(d.date) || d.date || "";
    var lang = LUNA_LANG || "az";

    /* Build long date */
    var dateLong = "";
    if (d.date && /^\d{4}-\d{2}-\d{2}$/.test(d.date)) {
        var dt = new Date(d.date + "T12:00:00");
        var months = {
            az: ["Yanvar","Fevral","Mart","Aprel","May","İyun","İyul","Avqust","Sentyabr","Oktyabr","Noyabr","Dekabr"],
            en: ["January","February","March","April","May","June","July","August","September","October","November","December"],
            ru: ["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"],
            tr: ["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"]
        };
        var arr = months[lang] || months.az;
        dateLong = dt.getDate() + " " + arr[dt.getMonth()] + " " + dt.getFullYear();
    }

    return {
        bride: d.bride || d.celebrant || d.graduate || "",
        groom: d.groom || "",
        date: displayDate,
        dateLong: dateLong,
        time: d.time || "",
        venue: d.venue || "",
        location: d.location || "",
        message: d.message || "",
        celebrant: d.bride || d.celebrant || "",
        graduate: d.bride || d.graduate || "",
        companyName: d.companyName || "",
        eventName: d.eventName || "",
        age: d.age || "",
        school: d.school || "",
        degree: d.degree || "",
        invitationLanguage: lang,
        category: d.category || "",
        package: d.package || ""
    };
}

function revealMainInvitation(customerData) {
    var engineEl = document.getElementById("sceneEngine");
    var curtain = document.getElementById("revealCurtain");
    var card = document.getElementById("revealCard");

    /* Hide engine */
    engineEl.style.display = "none";

    /* Show reveal */
    curtain.style.display = "";
    card.style.display = "";

    document.getElementById("revealNames").textContent = lunaDisplayNames(invitation);
    document.getElementById("revealDate").textContent = customerData.dateLong || customerData.date;

    /* Animate curtains open */
    requestAnimationFrame(function() {
        requestAnimationFrame(function() {
        curtain.classList.add("opened");
            card.classList.add("visible");
            document.documentElement.classList.add("scene-opened");
        });
    });

    /* When user clicks "Open Invitation", show main content */
    document.getElementById("revealCta").addEventListener("click", function() {
        curtain.style.display = "none";
        card.style.display = "none";
        showStaticInvitation();
    });
}

function showStaticInvitation() {
    var mainEl = document.getElementById("invitation");
    mainEl.style.display = "";

    /* Set design theme */
    if (invitation.design) {
        document.documentElement.setAttribute("data-design", invitation.design.toLowerCase());
    }

    /* Populate all invitation fields */
    populateInvitation();

    /* Show invitation with animation */
    requestAnimationFrame(function() {
        mainEl.classList.add("visible");
        mainEl.classList.add("hero-revealed");
        document.documentElement.classList.add("scene-opened");
    });
}

function populateInvitation() {
    var pkg = (invitation.package || "basic").toLowerCase();
    var cat = (invitation.category || "wedding").toLowerCase();
    var isCouple = (cat === "wedding" || cat === "engagement" || cat === "anniversary" || cat === "henna");
    var displayDate = invitation.dateShort || lunaDateShort(invitation.date) || invitation.date || "";

    /* Hero */
    document.getElementById("heroEyebrow").textContent = lunaInvitationHeading(invitation);
    document.getElementById("date").textContent = displayDate;

    (function buildHeroNames() {
        var container = document.getElementById("heroNames");
        if (isCouple) {
            var bride = invitation.bride || "";
            var groom = invitation.groom || "";
            var html = '<span class="name">' + lunaEscapeHtml(bride) + '</span>';
            if (groom) { html += '<span class="hero-amp">&amp;</span><span class="name">' + lunaEscapeHtml(groom) + '</span>'; }
            container.innerHTML = html;
        } else {
            var name = invitation.bride || invitation.celebrant || invitation.graduate || invitation.eventName || "";
            container.innerHTML = '<span class="name">' + lunaEscapeHtml(name) + '</span>';
        }
    })();

    /* Story (luxury) */
    if (pkg !== "luxury") document.getElementById("storySection").hidden = true;
    document.getElementById("storyEyebrow").textContent = lunaT("invStoryTitle");
    document.getElementById("storyHeading").innerHTML = lunaT("invStoryHeading");
    if (invitation.story) document.getElementById("story").innerHTML = lunaFormatStory(invitation.story);

    /* Details */
    document.getElementById("detailsEyebrow").textContent = lunaT("invDetailsTitle");
    document.getElementById("detailsHeading").innerHTML = lunaT("invDetailsHeading");
    document.getElementById("dateLabel").textContent = lunaT("invDateLabel");
    document.getElementById("detailDate").textContent = displayDate;
    document.getElementById("timeLabel").textContent = lunaT("invTimeLabel");
    document.getElementById("time").textContent = invitation.time || "";
    document.getElementById("venueLabel").textContent = lunaT("invVenueLabel");
    document.getElementById("venue").textContent = invitation.venue || "";
    document.getElementById("location").textContent = invitation.location || "";

    var mapButton = document.getElementById("mapButton");
    mapButton.textContent = lunaT("invMapBtn");
    if (invitation.map) { mapButton.href = invitation.map; } else { mapButton.hidden = true; }

    /* Day name */
    (function() {
        var dayEl = document.getElementById("dayName");
        var d = null;

        var countdownStr = typeof lunaCountdownTarget === "function" ? lunaCountdownTarget(invitation) : null;
        if (countdownStr) {
            d = new Date(countdownStr);
        }

        if ((!d || isNaN(d.getTime())) && invitation.date && /^\d{4}-\d{2}-\d{2}$/.test(invitation.date)) {
            d = new Date(invitation.date + "T12:00:00");
        }

        if (d && !isNaN(d.getTime())) {
            var dayNames = { az: ["Bazar","Bazar ertəsi","Çərşənbə axşamı","Çərşənbə","Cümə axşamı","Cümə","Şənbə"], en: ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"], ru: ["Воскресенье","Понедельник","Вторник","Среда","Четверг","Пятница","Суббота"], tr: ["Pazar","Pazartesi","Salı","Çarşamba","Perşembe","Cuma","Cumartesi"] };
            dayEl.textContent = (dayNames[LUNA_LANG] || dayNames.az)[d.getDay()];
        } else {
            dayEl.textContent = "";
        }
    })();

    /* Gallery (premium/luxury) */
    if (pkg === "basic" || pkg === "video") {
        document.getElementById("gallerySection").hidden = true;
    } else {
        document.getElementById("galleryEyebrow").textContent = lunaT("invGalleryTitle");
        document.getElementById("galleryHeading").innerHTML = lunaT("invGalleryHeading");
        renderGallery(invitation);
    }

    /* Countdown (premium/luxury) */
    if (pkg === "basic" || pkg === "video") {
        document.getElementById("countdownSection").hidden = true;
    } else {
        document.getElementById("countdownEyebrow").textContent = lunaT("invCountdownTitle");
        document.getElementById("countdownHeading").innerHTML = lunaT("invCountdownHeading");
        startCountdown();
    }

    /* RSVP */
    if (pkg === "basic" || pkg === "video") {
        document.getElementById("rsvpSection").hidden = true;
    } else {
        document.getElementById("rsvpHeading").innerHTML = lunaT("invRsvpHeading");
        document.getElementById("rsvpText").textContent = lunaT("invRsvpText");
        setupRSVP();
    }

    /* Music (luxury) */
    if (pkg !== "luxury" || !invitation.musicUrl) {
        document.getElementById("musicButton").hidden = true;
    }

    /* Footer */
    document.getElementById("footerNames").textContent = lunaDisplayNames(invitation);
    document.getElementById("footerTagline").textContent = lunaT("invFooterTagline");

    /* Setup scroll reveals */
    setupScrollReveals();

    /* Apply template-specific styles */
    applyTemplateStyles();
}

/* =====================================================
   GALLERY
===================================================== */

function renderGallery(inv) {
    var galleryEl = document.getElementById("gallery");
    if (!galleryEl) return;

    var customerImages = (inv.images || inv.gallery || []);
    if (customerImages.length === 0) {
        document.getElementById("gallerySection").hidden = true;
        return;
    }

    /* Apply gallery style from template */
    var tpl = LUNA_TEMPLATES.find(function(t) { return t.id === inv.templateId || t.id === inv.design; });
    var galleryStyle = (tpl && tpl.galleryStyle) || "editorial";
    galleryEl.className = "gallery gallery-style-" + galleryStyle;

    var html = "";
    customerImages.forEach(function(url) {
        html += '<img src="' + url + '" alt="" loading="lazy" onerror="this.style.display=\'none\'">';
    });
    galleryEl.innerHTML = html;

    /* Lightbox */
    galleryEl.querySelectorAll("img").forEach(function(img) {
        img.addEventListener("click", function() {
            openLightbox(this.src);
        });
    });
}

function openLightbox(src) {
    var lb = document.getElementById("lightbox");
    var img = document.getElementById("lightboxImg");
    img.src = src;
    lb.classList.add("open");
}

/* =====================================================
   COUNTDOWN
===================================================== */

function startCountdown() {
    /* Build target date — try lunaCountdownTarget first, then YYYY-MM-DD fallback */
    var target = null;

    var countdownStr = typeof lunaCountdownTarget === "function" ? lunaCountdownTarget(invitation) : null;
    if (countdownStr) {
        target = new Date(countdownStr);
    }

    if ((!target || isNaN(target.getTime())) && invitation.date && /^\d{4}-\d{2}-\d{2}$/.test(invitation.date)) {
        var parts = invitation.date.split("-");
        var timeParts = (invitation.time || "19:00").split(":");
        target = new Date(
            parseInt(parts[0], 10),
            parseInt(parts[1], 10) - 1,
            parseInt(parts[2], 10),
            parseInt(timeParts[0], 10) || 19,
            parseInt(timeParts[1], 10) || 0,
            0, 0
        );
    }

    if (!target || isNaN(target.getTime())) return;

    function update() {
        var now = new Date();
        var diff = target - now;

        if (diff <= 0) {
            document.getElementById("days").textContent = "00";
            document.getElementById("hours").textContent = "00";
            document.getElementById("minutes").textContent = "00";
            document.getElementById("seconds").textContent = "00";
            document.getElementById("countdownHeading").innerHTML = lunaT("invToday");
            return;
        }

        var d = Math.floor(diff / 86400000);
        var h = Math.floor((diff % 86400000) / 3600000);
        var m = Math.floor((diff % 3600000) / 60000);
        var s = Math.floor((diff % 60000) / 1000);

        document.getElementById("days").textContent = d;
        document.getElementById("hours").textContent = h;
        document.getElementById("minutes").textContent = m;
        document.getElementById("seconds").textContent = s;

        document.getElementById("daysLabel").textContent = lunaT("invDays");
        document.getElementById("hoursLabel").textContent = lunaT("invHours");
        document.getElementById("minutesLabel").textContent = lunaT("invMinutes");
        document.getElementById("secondsLabel").textContent = lunaT("invSeconds");
    }

    update();
    setInterval(update, 1000);
}

/* =====================================================
   RSVP
===================================================== */

function setupRSVP() {
    document.getElementById("rsvpOptYes").textContent = lunaT("invRsvpYes");
    document.getElementById("rsvpOptMaybe").textContent = lunaT("invRsvpMaybe");
    document.getElementById("rsvpOptNo").textContent = lunaT("invRsvpNo");
    document.getElementById("rsvpName").placeholder = lunaT("invRsvpName");
    document.getElementById("rsvpGuests").placeholder = lunaT("invRsvpGuests");
    document.getElementById("rsvpMessage").placeholder = lunaT("invRsvpMessage");
    document.getElementById("rsvpSubmitBtn").textContent = lunaT("invRsvpSubmit");
    document.getElementById("rsvpButton").textContent = lunaT("invRsvpButton");

    document.getElementById("rsvpButton").addEventListener("click", function() {
        this.hidden = true;
        document.getElementById("rsvpForm").hidden = false;
    });

    document.getElementById("rsvpForm").addEventListener("submit", function(e) {
        e.preventDefault();
        var name = (document.getElementById("rsvpName").value || "").trim();
        var status = document.getElementById("rsvpStatus").value || "yes";
        var guests = parseInt(document.getElementById("rsvpGuests").value, 10) || 1;
        var message = (document.getElementById("rsvpMessage").value || "").trim();
        if (!invitationId || !name) {
            document.getElementById("rsvpThanks").textContent = lunaT("invRsvpThanks");
            this.hidden = true;
            document.getElementById("rsvpThanks").hidden = false;
            return;
        }
        lunaSaveRsvp(invitationId, { name: name, status: status, guests: guests, message: message });
        document.getElementById("rsvpName").value = "";
        document.getElementById("rsvpGuests").value = "1";
        document.getElementById("rsvpMessage").value = "";
        this.hidden = true;
        document.getElementById("rsvpThanks").textContent = lunaT("invRsvpThanks");
        document.getElementById("rsvpThanks").hidden = false;
    });
}

/* =====================================================
   SCROLL REVEALS
===================================================== */

function setupScrollReveals() {
    var reveals = document.querySelectorAll(".reveal-up, .reveal-scale");
    var observer = new IntersectionObserver(function(entries) {
        entries.forEach(function(entry) {
            if (entry.isIntersecting) {
                entry.target.classList.add("visible");
            }
        });
    }, { threshold: 0.15 });

    reveals.forEach(function(el) { observer.observe(el); });
}

/* =====================================================
   TEMPLATE-SPECIFIC STYLES
===================================================== */

function applyTemplateStyles() {
    var style = (invitation.style || "").toLowerCase();
    var design = (invitation.design || "").toLowerCase();
    var heroClass = "", sectionClass = "", detailsClass = "", countdownClass = "", footerClass = "";

    if (style.indexOf("editorial") !== -1 || design === "editorial-love") {
        heroClass = "hero-style-editorial"; sectionClass = "section-style-editorial";
        detailsClass = "details-style-editorial"; countdownClass = "countdown-style-editorial";
        footerClass = "footer-style-editorial";
    } else if (style.indexOf("luxe") !== -1 || style.indexOf("luxury") !== -1 || style.indexOf("dark") !== -1 || design === "noir" || design === "black-gold" || design === "luxe-gold") {
        heroClass = "hero-style-luxury"; sectionClass = "section-style-luxury";
        detailsClass = "details-style-luxury"; countdownClass = "countdown-style-luxury";
        footerClass = "footer-style-luxury";
    } else if (style.indexOf("minimal") !== -1 || style.indexOf("modern") !== -1 || design === "minimal-white" || design === "modern-classic") {
        heroClass = "hero-style-minimal"; sectionClass = "section-style-minimal";
        detailsClass = "details-style-minimal"; countdownClass = "countdown-style-minimal";
        footerClass = "footer-style-minimal";
    } else if (style.indexOf("botanical") !== -1 || style.indexOf("garden") !== -1 || design === "botanical") {
        heroClass = "hero-style-botanical"; sectionClass = "section-style-botanical";
        detailsClass = "details-style-botanical"; footerClass = "footer-style-botanical";
    }

    if (heroClass === "" && (design === "noir" || design === "black-gold" || design === "luxe-gold" || design === "enchanted" || design === "luxury-birthday" || design === "oriental" || design === "luxury-grad")) {
        heroClass = "hero-style-dark"; footerClass = "footer-style-dark";
    }

    var hero = document.getElementById("hero");
    var main = document.getElementById("invitation");
    if (hero && heroClass) hero.classList.add(heroClass);
    if (main) {
        if (sectionClass) main.classList.add(sectionClass);
        if (detailsClass) main.classList.add(detailsClass);
        if (countdownClass) main.classList.add(countdownClass);
        if (footerClass) main.classList.add(footerClass);
    }
}

</script>

<script>
(function(){
  try{
    var docEl=document.documentElement;
    docEl.classList.add("lx-fx");
    docEl.classList.add("lx-physical");
    var reduce=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    var fine=window.matchMedia&&window.matchMedia("(pointer: fine)").matches;

    function wrapWords(el){
      if(!el||el.querySelector(".lx-w")||!el.textContent||!el.textContent.trim())return;
      var words=el.textContent.trim().split(/\s+/);
      if(words.length<2)return;
      el.textContent="";
      words.forEach(function(w,i){
        var sp=document.createElement("span");
        sp.className="lx-w";
        sp.textContent=w;
        sp.style.setProperty("--lx-i",i);
        el.appendChild(sp);
      });
    }
    function rewrap(){[].slice.call(document.querySelectorAll(".section h2")).forEach(wrapWords);}
    rewrap();
    if(window.MutationObserver){
      var scheduled=null;
      new MutationObserver(function(){
        if(scheduled)return;
        scheduled=requestAnimationFrame(function(){scheduled=null;rewrap();});
      }).observe(document.body,{childList:true,subtree:true,characterData:true});
    }

    function markVisible(el){if(el)el.classList.add("lx-seen");}
    function idx(){var gal=document.getElementById("gallery");if(!gal)return;var imgs=gal.querySelectorAll("img");[].forEach.call(imgs,function(img,i){img.style.setProperty("--lx-i",i);});}
    function checkVisible(){
      var vh=window.innerHeight||document.documentElement.clientHeight;
      [].forEach.call(document.querySelectorAll(".section:not(.lx-seen)"),function(s){
        var r=s.getBoundingClientRect();
        if(r.top<vh*.92&&r.bottom>0)markVisible(s);
      });
      var gal=document.getElementById("gallery");
      if(gal&&!gal.classList.contains("lx-seen")){
        var gr=gal.getBoundingClientRect();
        if(gr.top<vh*.92&&gr.bottom>0){markVisible(gal);idx();}
      }
    }
    idx();setTimeout(idx,400);setTimeout(idx,1600);
    if("IntersectionObserver" in window){
      var io=new IntersectionObserver(function(entries){
        entries.forEach(function(en){
          if(en.isIntersecting){markVisible(en.target);if(en.target.id==="gallery")idx();}
        });
      },{threshold:.1,rootMargin:"0px 0px -8% 0px"});
      [].forEach.call(document.querySelectorAll(".section"),function(s){io.observe(s);});
      var gal0=document.getElementById("gallery");
      if(gal0)io.observe(gal0);
    }
    checkVisible();
    window.addEventListener("scroll",checkVisible,{passive:true});
    window.addEventListener("resize",checkVisible);
    var lxTimer=setInterval(function(){
      checkVisible();
      var done=true;
      [].forEach.call(document.querySelectorAll(".section"),function(s){if(!s.classList.contains("lx-seen"))done=false;});
      var gal2=document.getElementById("gallery");
      if(gal2&&!gal2.classList.contains("lx-seen"))done=false;
      if(done)clearInterval(lxTimer);
    },700);

    function ambient(){
      if(reduce)return;
      var mat=(docEl.getAttribute("data-material")||"").toLowerCase();
      var des=(docEl.getAttribute("data-design")||"").toLowerCase();
      var kind="dot",colors=["rgba(196,168,130,.55)"];
      var count=window.innerWidth<768?8:12;
      if(/botanical|flower|garden/.test(mat)){kind="petal";colors=["#8fb4a0","#b8c9a5","#d8c9b0","#e3b7a0"];}
      else if(/rose|blush|velvet|bloom|romantic/.test(mat)||/rose|blush|velvet|romantic|serena|florence/.test(des)){kind="petal";colors=["#d9a7b5","#e8c2cd","#f0d3da","#c88a9a"];}
      else if(/vintage/.test(mat)){kind="petal";colors=["#c9a877","#b8956e","#d8c9b0"];}
      else if(/royal|dark|noir|gold|luxe|black|oriental/.test(mat)||/royal|dark|noir|gold|luxe|black|oriental|henna/.test(des)){kind="dot";colors=["#d4af37","#c8a870","#f0e0b8","#b8860b"];}
      else if(/aqua|starry|aurora|night/.test(mat)||/starry|aurora/.test(des)){kind="twinkle";colors=["#e8ecff","#cfe0ff","#ffd98a","#ffffff"];}
      else if(/pop|kids|fiesta|celebration/.test(mat)||/pop|kids|fiesta/.test(des)){kind="dot";colors=["#ff6b6b","#ff9f43","#4ecdc4","#f7d774"];}
      else if(/minimal|pearl|executive|conference|networking|classic/.test(mat)||/minimal|classic/.test(des)){colors=["rgba(138,126,116,.35)"];}
      var layer=document.createElement("div");
      layer.id="lx-ambient";layer.setAttribute("aria-hidden","true");
      for(var i=0;i<count;i++){
        var pt=document.createElement("i");
        var c=colors[i%colors.length];
        var size=kind==="petal"?7+Math.random()*9:2+Math.random()*4;
        pt.style.left=(Math.random()*100).toFixed(1)+"%";
        pt.style.top=(Math.random()*100).toFixed(1)+"%";
        pt.style.width=size.toFixed(1)+"px";
        pt.style.height=(kind==="petal"?size*1.15:size).toFixed(1)+"px";
        pt.style.background=c;
        if(kind==="dot")pt.style.boxShadow="0 0 8px 1px "+c;
        pt.className=kind==="petal"?"lx-petal":(kind==="twinkle"?"lx-twinkle":"lx-dot");
        pt.style.setProperty("--lx-drift",((Math.random()*160)-80).toFixed(0)+"px");
        pt.style.setProperty("--lx-rot",(360+Math.random()*360).toFixed(0)+"deg");
        pt.style.setProperty("--lx-o",(.25+Math.random()*.4).toFixed(2));
        pt.style.animationDuration=(9+Math.random()*10).toFixed(1)+"s";
        pt.style.animationDelay=(-Math.random()*12).toFixed(1)+"s";
        layer.appendChild(pt);
      }
      document.body.appendChild(layer);
    }
    ambient();

    function trail(){
      if(reduce||!fine)return;
      var layer=document.createElement("div");
      layer.id="lx-trail";layer.setAttribute("aria-hidden","true");
      document.body.appendChild(layer);
      var last=0,count=0;
      document.addEventListener("pointermove",function(e){
        var now=Date.now();
        if(now-last<40)return;last=now;
        var sp=document.createElement("i");
        sp.style.left=(e.clientX-3)+"px";sp.style.top=(e.clientY-3)+"px";
        layer.appendChild(sp);count++;
        if(count>60){var f=layer.firstChild;if(f)layer.removeChild(f);}
        setTimeout(function(){if(sp.parentNode)sp.parentNode.removeChild(sp);},750);
      },{passive:true});
    }
    trail();

    function magnet(){
      if(reduce||!fine)return;
      [].forEach.call(document.querySelectorAll(".detail, .map-button, .story-quote"),function(el){
        var raf=false;
        el.addEventListener("pointermove",function(e){
          if(raf)return;
          raf=true;
          requestAnimationFrame(function(){
            raf=false;
            var r=el.getBoundingClientRect();
            var dx=(e.clientX-(r.left+r.width/2))/r.width;
            var dy=(e.clientY-(r.top+r.height/2))/r.height;
            el.style.transform="translate("+(dx*8).toFixed(2)+"px,"+(dy*6).toFixed(2)+"px)";
          });
        });
        el.addEventListener("pointerleave",function(){el.style.transform="";});
      });
    }
    magnet();
  }catch(err){/* premium layer must never break the invitation */}
})();
</script>
