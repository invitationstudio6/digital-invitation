<!DOCTYPE html>
<html lang="az" data-design="amelia">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Luna | Digital Invitation</title>

<link rel="preconnect"
      href="https://fonts.googleapis.com">

<link rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Allura&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=DM+Sans:wght@300;400;500&family=Italiana&display=swap"
      rel="stylesheet">


<style>

/* =====================================================
   DESIGN THEMES
===================================================== */

:root {
    --bg: #F5EDE3;
    --bg-alt: #EDE3D5;
    --fg: #5C3D2E;
    --fg-heading: #3E2518;
    --fg-muted: rgba(92,61,46,.50);
    --accent: #C4A882;
    --accent-light: rgba(196,168,130,.15);
    --border: rgba(92,61,46,.10);
    --border-strong: rgba(92,61,46,.22);
    --black: #030302;
    --white: #FFFCF7;
    --gold: #C4A882;
    --cover: url('https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&w=1800&q=90');
}

[data-design="amelia"] { --cover: url('https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&w=1800&q=90'); }
[data-design="amour"] { --cover: url('https://images.unsplash.com/photo-1511285560929-80b456fea0bc?auto=format&fit=crop&w=1800&q=90'); }
[data-design="noir"] { --bg: #1a1a1a; --bg-alt: #222; --fg: #E8E0D6; --fg-heading: #fff; --fg-muted: rgba(232,224,214,.50); --accent: #A08A78; --accent-light: rgba(160,138,120,.15); --border: rgba(232,224,214,.08); --border-strong: rgba(232,224,214,.18); --gold: #A08A78; --cover: url('https://images.unsplash.com/photo-1519225421980-715cb0215aed?auto=format&fit=crop&w=1800&q=90'); }
[data-design="serena"] { --bg: #F0EBF2; --bg-alt: #E5DDE9; --accent: #A896BC; --accent-light: rgba(168,150,188,.15); --gold: #A896BC; --cover: url('https://images.unsplash.com/photo-1606800052052-a08af7148866?auto=format&fit=crop&w=1800&q=90'); }
[data-design="florence"] { --cover: url('https://images.unsplash.com/photo-1530103862676-de8c9debad1d?auto=format&fit=crop&w=1800&q=90'); }
[data-design="aurora"] { --bg: #ECF2F4; --bg-alt: #DDE8EC; --accent: #7AACB8; --accent-light: rgba(122,172,184,.15); --gold: #7AACB8; --cover: url('https://images.unsplash.com/photo-1523050854058-8df90110c9f1?auto=format&fit=crop&w=1800&q=90'); }
[data-design="henna"] { --cover: url('https://images.unsplash.com/photo-1606800052052-a08af7148866?auto=format&fit=crop&w=1800&q=90'); }
[data-design="classic"] { --cover: url('https://images.unsplash.com/photo-1464366400600-7168b8af9bc3?auto=format&fit=crop&w=1800&q=90'); }


/* =====================================================
   RESET
===================================================== */

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }

body {
    font-family: "Cormorant Garamond", Georgia, serif;
    font-weight: 300;
    color: var(--fg);
    background: var(--bg);
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
}

img { display: block; max-width: 100%; }
button { font-family: "DM Sans", sans-serif; cursor: pointer; }
a { text-decoration: none; color: inherit; }


/* =====================================================
   PAGE BACKGROUND
===================================================== */

.page-background {
    position: fixed;
    inset: 0;
    z-index: -10;
    background: var(--bg);
}

.page-background::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
        radial-gradient(ellipse at 20% 20%, var(--accent-light), transparent 50%),
        radial-gradient(ellipse at 80% 80%, var(--accent-light), transparent 50%);
}


/* =====================================================
   FLOATING LIGHTS
===================================================== */

.light {
    position: fixed;
    width: 500px;
    height: 500px;
    border-radius: 50%;
    filter: blur(150px);
    opacity: .08;
    pointer-events: none;
    z-index: -5;
    animation: floatingLight 25s ease-in-out infinite;
}

.light-one {
    top: -150px;
    left: -150px;
    background: var(--accent);
}

.light-two {
    right: -150px;
    bottom: 10%;
    background: var(--gold);
    animation-delay: -12s;
}

@keyframes floatingLight {
    0%,100% { transform: translate(0,0) scale(1); }
    33% { transform: translate(50px,-30px) scale(1.05); }
    66% { transform: translate(-30px,40px) scale(.95); }
}


/* =====================================================
   OPENING SCREEN
===================================================== */

.opening {
    position: fixed;
    inset: 0;
    z-index: 999;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: var(--bg);
    transition: opacity 1.4s cubic-bezier(.4,0,.2,1), visibility 1.4s;
}

.opening.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}


/* =====================================================
   ENVELOPE
===================================================== */

.envelope-scene {
    position: relative;
    width: min(480px,85vw);
    perspective: 1200px;
}

.envelope {
    position: relative;
    width: 100%;
    padding-bottom: 68%;
    transform-style: preserve-3d;
    transition: transform .6s ease;
}

.envelope-body {
    position: absolute;
    inset: 0;
    background: var(--white);
    border: 1px solid var(--border-strong);
    overflow: hidden;
}

.envelope-body::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
        linear-gradient(135deg, transparent 49.5%, var(--border) 50%, transparent 50.5%),
        linear-gradient(-135deg, transparent 49.5%, var(--border) 50%, transparent 50.5%);
}

.envelope-body::after {
    content: "";
    position: absolute;
    inset: 8px;
    border: 1px solid var(--border);
}


/* =====================================================
   LETTER
===================================================== */

.letter {
    position: absolute;
    width: 84%;
    left: 8%;
    top: 8%;
    bottom: 8%;
    z-index: 3;
    background: var(--white);
    border: 1px solid var(--border-strong);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    transition: transform 1.8s cubic-bezier(.19,1,.22,1);
}

.letter::before {
    content: "";
    position: absolute;
    inset: 10px;
    border: 1px solid var(--border);
}

.letter-content {
    position: relative;
    z-index: 2;
    padding: 30px;
}

.letter-content small {
    font-family: "DM Sans", sans-serif;
    font-size: 8px;
    font-weight: 500;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: var(--accent);
}

.letter-content h1 {
    font-family: "Cormorant Garamond", serif;
    font-size: clamp(42px,7vw,68px);
    font-weight: 300;
    font-style: italic;
    line-height: 1.1;
    color: var(--fg-heading);
    margin: 18px 0 14px;
}

.letter-content p {
    font-family: "DM Sans", sans-serif;
    font-size: 10px;
    font-weight: 400;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--fg-muted);
}


/* =====================================================
   FLAP + SEAL
===================================================== */

.flap {
    position: absolute;
    inset: 0;
    z-index: 6;
    background: var(--white);
    border: 1px solid var(--border-strong);
    clip-path: polygon(0 0, 100% 0, 50% 65%);
    transform-origin: top center;
    transition: transform 1.5s cubic-bezier(.19,1,.22,1);
    backface-visibility: hidden;
}

.seal {
    position: absolute;
    z-index: 10;
    width: 50px;
    height: 50px;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%);
    border-radius: 50%;
    display: grid;
    place-items: center;
    font-family: "Cormorant Garamond", serif;
    font-size: 18px;
    font-weight: 400;
    font-style: italic;
    color: var(--white);
    background: var(--fg-heading);
    transition: opacity .6s ease, transform .8s cubic-bezier(.19,1,.22,1);
    box-shadow: 0 4px 20px rgba(62,37,24,.25);
}

.envelope.open .flap { transform: rotateX(180deg); }
.envelope.open .letter { transform: translateY(-110%); }
.envelope.open .seal { opacity: 0; transform: translateX(-50%) scale(.4); }


/* =====================================================
   OPEN BUTTON
===================================================== */

.open-button {
    margin-top: 40px;
    padding: 16px 40px;
    border: 1px solid var(--fg);
    background: transparent;
    color: var(--fg);
    font-family: "DM Sans", sans-serif;
    font-size: 9px;
    font-weight: 500;
    letter-spacing: 4px;
    text-transform: uppercase;
    transition: .4s ease;
    position: relative;
    overflow: hidden;
}

.open-button::before {
    content: "";
    position: absolute;
    inset: 0;
    background: var(--fg);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform .4s cubic-bezier(.4,0,.2,1);
    z-index: -1;
}

.open-button:hover {
    color: var(--white);
}

.open-button:hover::before {
    transform: scaleX(1);
}


/* =====================================================
   INVITATION + HERO
===================================================== */

.invitation {
    opacity: 0;
    transition: opacity 1.6s cubic-bezier(.4,0,.2,1);
}

.invitation.visible { opacity: 1; }

.hero {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 120px 24px;
    position: relative;
    overflow: hidden;
    background: var(--cover) center/cover no-repeat;
}

.hero::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
        radial-gradient(ellipse at 50% 40%, rgba(245,237,227,.60) 0%, transparent 60%),
        linear-gradient(to bottom, rgba(62,37,24,.05), rgba(62,37,24,.25));
    z-index: 1;
}

.hero::after {
    content: "";
    position: absolute;
    width: min(600px,80vw);
    height: min(600px,80vw);
    border-radius: 50%;
    border: 1px solid rgba(255,252,247,.10);
    z-index: 1;
    animation: heroPulse 8s ease-in-out infinite;
}

[data-design="noir"] .hero::before {
    background:
        radial-gradient(ellipse at 50% 40%, rgba(26,26,26,.40) 0%, transparent 60%),
        linear-gradient(to bottom, rgba(0,0,0,.20), rgba(0,0,0,.50));
}

@keyframes heroPulse {
    0%,100% { transform: scale(.96); opacity: .4; }
    50% { transform: scale(1.02); opacity: .8; }
}

.hero-content {
    position: relative;
    z-index: 2;
}

.hero-eyebrow {
    font-family: "DM Sans", sans-serif;
    font-size: 9px;
    font-weight: 500;
    letter-spacing: 6px;
    text-transform: uppercase;
    color: rgba(255,252,247,.6);
    margin-bottom: 10px;
}

.hero-names {
    margin-top: 24px;
}

.hero-names .name {
    display: block;
    font-family: "Cormorant Garamond", serif;
    font-size: clamp(64px,12vw,140px);
    font-weight: 300;
    font-style: italic;
    line-height: .85;
    color: var(--white);
    text-shadow: 0 2px 40px rgba(0,0,0,.15);
    animation: nameReveal 1.2s .3s cubic-bezier(.19,1,.22,1) both;
}

.hero-names .name:nth-child(3) {
    animation-delay: .5s;
}

@keyframes nameReveal {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
}

.hero-amp {
    display: block;
    font-family: "Allura", cursive;
    font-size: clamp(28px,4vw,44px);
    color: rgba(255,252,247,.40);
    margin: 8px 0;
    animation: nameReveal 1s .4s cubic-bezier(.19,1,.22,1) both;
}

.hero-date {
    margin-top: 40px;
    font-family: "DM Sans", sans-serif;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 7px;
    text-transform: uppercase;
    color: rgba(255,252,247,.55);
    animation: nameReveal 1s .7s cubic-bezier(.19,1,.22,1) both;
}

.hero-scroll {
    position: absolute;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    color: rgba(255,252,247,.4);
    font-family: "DM Sans", sans-serif;
    font-size: 8px;
    font-weight: 500;
    letter-spacing: 3px;
    text-transform: uppercase;
    animation: nameReveal 1s 1s cubic-bezier(.19,1,.22,1) both;
}

.hero-scroll::after {
    content: "";
    width: 1px;
    height: 35px;
    background: rgba(255,252,247,.3);
    animation: scrollPulse 2s ease-in-out infinite;
}

@keyframes scrollPulse {
    0%,100% { transform: scaleY(.4); opacity: .3; transform-origin: top; }
    50% { transform: scaleY(1); opacity: .8; transform-origin: top; }
}

.hero-video-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom, rgba(62,37,24,.30), rgba(62,37,24,.60));
    z-index: 1;
    pointer-events: none;
}

.hero-video-bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 0;
}


/* =====================================================
   SECTIONS
===================================================== */

.section {
    padding: 120px 8%;
    text-align: center;
}

.section-divider {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    margin: 0 auto 50px;
}

.section-divider::before,
.section-divider::after {
    content: "";
    width: 40px;
    height: 1px;
    background: var(--border-strong);
}

.section-divider span {
    font-size: 10px;
    color: var(--accent);
}

.section-eyebrow {
    font-family: "DM Sans", sans-serif;
    font-size: 9px;
    font-weight: 500;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 16px;
}

.section h2 {
    font-family: "Cormorant Garamond", serif;
    font-size: clamp(38px,6vw,64px);
    font-weight: 300;
    font-style: italic;
    line-height: 1.1;
    color: var(--fg-heading);
    margin-bottom: 30px;
}

.section-text {
    max-width: 480px;
    margin: auto;
    font-size: 16px;
    font-weight: 300;
    line-height: 2;
    color: var(--fg-muted);
}


/* =====================================================
   SCROLL REVEAL
===================================================== */

.reveal-up {
    opacity: 0;
    transform: translateY(40px);
    transition: opacity 1s cubic-bezier(.19,1,.22,1), transform 1s cubic-bezier(.19,1,.22,1);
}

.reveal-up.visible {
    opacity: 1;
    transform: translateY(0);
}

.reveal-scale {
    opacity: 0;
    transform: scale(.96);
    transition: opacity 1s ease, transform 1s cubic-bezier(.19,1,.22,1);
}

.reveal-scale.visible {
    opacity: 1;
    transform: scale(1);
}


/* =====================================================
   STORY SECTION
===================================================== */

.story-quote {
    position: relative;
    max-width: 560px;
    margin: 0 auto;
    padding: 0 40px;
}

.story-quote::before {
    content: "\201C";
    position: absolute;
    left: 0;
    top: -20px;
    font-family: "Cormorant Garamond", serif;
    font-size: 80px;
    font-weight: 300;
    color: var(--accent);
    opacity: .3;
    line-height: 1;
}


/* =====================================================
   DETAILS
===================================================== */

.details-section {
    background: var(--bg-alt);
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
}

.details-grid {
    max-width: 900px;
    margin: 50px auto 0;
    display: grid;
    grid-template-columns: repeat(3,1fr);
    border-top: 1px solid var(--border-strong);
    border-bottom: 1px solid var(--border-strong);
}

.detail {
    padding: 44px 20px;
    border-right: 1px solid var(--border-strong);
    transition: background .4s ease;
}

.detail:last-child { border-right: none; }
.detail:hover { background: var(--accent-light); }

.detail small {
    font-family: "DM Sans", sans-serif;
    font-size: 8px;
    font-weight: 500;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--accent);
}

.detail strong {
    display: block;
    margin: 18px 0 8px;
    font-family: "Cormorant Garamond", serif;
    font-size: 30px;
    font-weight: 300;
    font-style: italic;
    color: var(--fg-heading);
}

.detail p {
    font-size: 13px;
    font-weight: 300;
    color: var(--fg-muted);
}

.map-button {
    display: inline-block;
    margin-top: 18px;
    padding: 10px 22px;
    border: 1px solid var(--border-strong);
    font-family: "DM Sans", sans-serif;
    font-size: 8px;
    font-weight: 500;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--fg);
    transition: .35s ease;
    position: relative;
    overflow: hidden;
}

.map-button::before {
    content: "";
    position: absolute;
    inset: 0;
    background: var(--fg);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform .35s cubic-bezier(.4,0,.2,1);
    z-index: -1;
}

.map-button:hover { color: var(--white); }
.map-button:hover::before { transform: scaleX(1); }


/* =====================================================
   GALLERY
===================================================== */

.gallery-section { padding-left: 0; padding-right: 0; }

.gallery {
    width: 100%;
    margin-top: 50px;
    display: grid;
    grid-template-columns: repeat(12,1fr);
    grid-template-rows: repeat(8,90px);
    gap: 4px;
    overflow: hidden;
}

.gallery img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: saturate(.9);
    transition: transform 1.4s cubic-bezier(.19,1,.22,1), filter .6s ease;
    cursor: pointer;
}

.gallery img:hover {
    transform: scale(1.03);
    filter: saturate(1.05);
}

.gallery img:nth-child(1) { grid-column: 1/8; grid-row: 1/6; }
.gallery img:nth-child(2) { grid-column: 8/13; grid-row: 1/4; }
.gallery img:nth-child(3) { grid-column: 8/13; grid-row: 4/6; }
.gallery img:nth-child(4) { grid-column: 1/5; grid-row: 6/9; }
.gallery img:nth-child(5) { grid-column: 5/9; grid-row: 6/9; }
.gallery img:nth-child(6) { grid-column: 9/13; grid-row: 6/9; }


/* =====================================================
   LIGHTBOX
===================================================== */

.lightbox {
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: rgba(0,0,0,.92);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    visibility: hidden;
    transition: opacity .4s ease, visibility .4s;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
}

.lightbox.active {
    opacity: 1;
    visibility: visible;
}

.lightbox img {
    max-width: 90vw;
    max-height: 85vh;
    object-fit: contain;
    border-radius: 2px;
    box-shadow: 0 8px 60px rgba(0,0,0,.5);
    transform: scale(.92);
    transition: transform .5s cubic-bezier(.19,1,.22,1);
}

.lightbox.active img {
    transform: scale(1);
}

.lightbox-close {
    position: absolute;
    top: 24px;
    right: 24px;
    width: 44px;
    height: 44px;
    border: 1px solid rgba(255,255,255,.2);
    border-radius: 50%;
    background: transparent;
    color: #fff;
    font-size: 18px;
    display: grid;
    place-items: center;
    cursor: pointer;
    transition: .3s ease;
}

.lightbox-close:hover {
    background: rgba(255,255,255,.15);
}

.lightbox-nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 48px;
    height: 48px;
    border: 1px solid rgba(255,255,255,.15);
    border-radius: 50%;
    background: transparent;
    color: #fff;
    font-size: 20px;
    display: grid;
    place-items: center;
    cursor: pointer;
    transition: .3s ease;
}

.lightbox-nav:hover {
    background: rgba(255,255,255,.1);
}

.lightbox-prev { left: 20px; }
.lightbox-next { right: 20px; }

.lightbox-counter {
    position: absolute;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    font-family: "DM Sans", sans-serif;
    font-size: 11px;
    letter-spacing: 3px;
    color: rgba(255,255,255,.5);
}


/* =====================================================
   COUNTDOWN
===================================================== */

.countdown-section {
    position: relative;
    background: var(--fg-heading);
    color: var(--white);
    overflow: hidden;
}

.countdown-section::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
        radial-gradient(ellipse at 30% 50%, rgba(196,168,130,.08), transparent 50%),
        radial-gradient(ellipse at 70% 50%, rgba(196,168,130,.05), transparent 50%);
}

.countdown-section::after {
    content: "";
    position: absolute;
    width: min(500px,70vw);
    height: min(500px,70vw);
    border-radius: 50%;
    border: 1px solid rgba(255,252,247,.05);
    left: 50%;
    top: 50%;
    transform: translate(-50%,-50%);
    pointer-events: none;
}

.countdown-section .section-eyebrow {
    position: relative;
    color: var(--accent);
}

.countdown-section h2 {
    position: relative;
    color: var(--white);
    margin-top: 14px;
    margin-bottom: 0;
}

.timer {
    position: relative;
    max-width: 700px;
    margin: 55px auto 0;
    display: grid;
    grid-template-columns: repeat(4,1fr);
    border-top: 1px solid rgba(255,252,247,.08);
    border-bottom: 1px solid rgba(255,252,247,.08);
}

.timer div {
    position: relative;
    padding: 30px 16px;
    text-align: center;
}

.timer div:not(:last-child)::after {
    content: "";
    position: absolute;
    right: 0;
    top: 25%;
    width: 1px;
    height: 50%;
    background: rgba(255,252,247,.08);
}

.timer strong {
    display: block;
    font-family: "Cormorant Garamond", serif;
    font-size: clamp(42px,5vw,70px);
    font-weight: 300;
    font-style: italic;
    color: var(--white);
    line-height: 1;
    font-variant-numeric: tabular-nums;
    min-width: 2ch;
}

.timer span {
    display: block;
    margin-top: 12px;
    font-family: "DM Sans", sans-serif;
    font-size: 8px;
    font-weight: 500;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--accent);
}


/* =====================================================
   RSVP
===================================================== */

.rsvp-section {
    background: var(--bg-alt);
    border-top: 1px solid var(--border);
}

.rsvp-button {
    margin-top: 32px;
    padding: 16px 36px;
    border: 1px solid var(--fg);
    background: transparent;
    color: var(--fg);
    font-family: "DM Sans", sans-serif;
    font-size: 9px;
    font-weight: 500;
    letter-spacing: 3px;
    text-transform: uppercase;
    transition: .4s ease;
    position: relative;
    overflow: hidden;
}

.rsvp-button::before {
    content: "";
    position: absolute;
    inset: 0;
    background: var(--fg);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform .4s cubic-bezier(.4,0,.2,1);
    z-index: -1;
}

.rsvp-button:hover { color: var(--white); }
.rsvp-button:hover::before { transform: scaleX(1); }

.rsvp-form {
    margin-top: 24px;
    display: grid;
    gap: 12px;
    max-width: 340px;
    margin-left: auto;
    margin-right: auto;
}

.rsvp-form input,
.rsvp-form select {
    width: 100%;
    padding: 14px 18px;
    border: 1px solid var(--border-strong);
    background: var(--white);
    font-family: "DM Sans", sans-serif;
    font-size: 13px;
    color: var(--fg);
    border-radius: 0;
    transition: border-color .3s ease;
    -webkit-appearance: none;
}

.rsvp-form input:focus,
.rsvp-form select:focus {
    outline: none;
    border-color: var(--fg);
}

.rsvp-form[hidden],
#rsvpThanks[hidden],
.music-button[hidden] { display: none !important; }

#rsvpThanks {
    margin-top: 24px;
    font-family: "Cormorant Garamond", serif;
    font-size: 20px;
    font-style: italic;
    color: var(--fg-muted);
}

.music-button {
    position: fixed;
    right: 24px;
    bottom: 24px;
    z-index: 40;
    border: 1px solid var(--border-strong);
    border-radius: 0;
    padding: 12px 18px;
    background: var(--white);
    color: var(--fg);
    font-family: "DM Sans", sans-serif;
    font-size: 9px;
    font-weight: 500;
    letter-spacing: 2px;
    text-transform: uppercase;
    transition: .35s ease;
}

.music-button:hover {
    background: var(--fg);
    color: var(--white);
    border-color: var(--fg);
}

.rsvp-counts {
    display: flex;
    justify-content: center;
    gap: 32px;
    margin-top: 24px;
    font-family: "DM Sans", sans-serif;
    font-size: 9px;
    font-weight: 500;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--fg-muted);
}

.rsvp-counts[hidden] { display: none !important; }

.rsvp-counts span {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
}

.rsvp-counts strong {
    font-family: "Cormorant Garamond", serif;
    font-size: 28px;
    font-weight: 300;
    font-style: italic;
    color: var(--fg-heading);
}


/* =====================================================
   FOOTER
===================================================== */

footer {
    padding: 80px 24px;
    text-align: center;
    background: var(--fg-heading);
    color: var(--bg);
    position: relative;
    overflow: hidden;
}

footer::before {
    content: "";
    position: absolute;
    width: min(400px,60vw);
    height: min(400px,60vw);
    border-radius: 50%;
    border: 1px solid rgba(255,252,247,.04);
    left: 50%;
    top: 50%;
    transform: translate(-50%,-50%);
    pointer-events: none;
}

footer strong {
    position: relative;
    font-family: "Cormorant Garamond", serif;
    font-size: clamp(48px,8vw,72px);
    font-weight: 300;
    font-style: italic;
    display: block;
}

footer p {
    position: relative;
    font-family: "DM Sans", sans-serif;
    font-size: 8px;
    font-weight: 500;
    letter-spacing: 5px;
    text-transform: uppercase;
    margin-top: 18px;
    color: var(--accent);
    opacity: .6;
}


/* =====================================================
   404 PAGE
===================================================== */

.not-found {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px;
    background: var(--bg);
    position: relative;
    overflow: hidden;
}

.not-found::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
        radial-gradient(ellipse at 30% 30%, var(--accent-light), transparent 50%),
        radial-gradient(ellipse at 70% 70%, var(--accent-light), transparent 50%);
}

.not-found-content {
    position: relative;
    z-index: 1;
}

.not-found-icon {
    font-size: 48px;
    margin-bottom: 32px;
    opacity: .25;
}

.not-found h1 {
    font-family: "Cormorant Garamond", serif;
    font-size: clamp(42px,8vw,72px);
    font-weight: 300;
    font-style: italic;
    color: var(--fg-heading);
    margin-bottom: 16px;
    line-height: 1.1;
}

.not-found p {
    font-family: "DM Sans", sans-serif;
    font-size: 13px;
    color: var(--fg-muted);
    margin-bottom: 40px;
    letter-spacing: 1px;
}

.not-found-brand {
    font-family: "DM Sans", sans-serif;
    font-size: 8px;
    font-weight: 500;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: var(--accent);
    opacity: .5;
    margin-top: 60px;
}


/* =====================================================
   HIDDEN UTILITY
===================================================== */

[hidden] { display: none !important; }


/* =====================================================
   OPENING STYLE VARIANTS
===================================================== */

.opening-elegant .envelope-scene { /* default — keep existing */ }

.opening-editorial .envelope { border-radius: 0; }
.opening-editorial .envelope-body { background: transparent; border: none; }
.opening-editorial .letter { font-family: "Italiana", serif; font-size: 18px; letter-spacing: 4px; text-transform: uppercase; }
.opening-editorial .envelope-scene { background: linear-gradient(135deg, #1a1410, #2a1f16); }
.opening-editorial .envelope-body { border: 1px solid rgba(196,168,130,.3); }
.opening-editorial .seal { background: var(--gold); }

.opening-floral .envelope-scene { background: linear-gradient(to bottom, #f5ede3, #efe4d6); }
.opening-floral .envelope-body { border: 2px solid rgba(196,168,130,.3); border-radius: 4px; }
.opening-floral .seal { background: #d4a574; box-shadow: 0 0 30px rgba(196,168,130,.3); }
.opening-floral .letter { background: #fff; border: 1px solid rgba(196,168,130,.15); }

.opening-luxury .envelope-scene { background: linear-gradient(135deg, #0a0a0a, #1a1410); }
.opening-luxury .envelope-body { background: #1a1410; border-color: rgba(196,168,130,.2); }
.opening-luxury .seal { background: linear-gradient(135deg, #c4a882, #d4b892); }
.opening-luxury .letter { background: #1a1410; color: #f5ede3; }
.opening-luxury .letter .names { color: var(--gold); }

.opening-minimal .envelope-scene { background: #fff; }
.opening-minimal .envelope { border: none; box-shadow: none; }
.opening-minimal .envelope-body { background: transparent; border: 1px solid rgba(0,0,0,.1); }
.opening-minimal .seal { background: #333; width: 40px; height: 40px; }
.opening-minimal .letter { font-family: "DM Sans", sans-serif; font-size: 14px; letter-spacing: 1px; }

/* RSVP premium polish */
.rsvp-form input:focus,
.rsvp-form select:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-light);
}

.rsvp-button:active {
    transform: scale(.97);
}

#rsvpThanks {
    animation: nameReveal .8s cubic-bezier(.19,1,.22,1) both;
}


/* =====================================================
   RESPONSIVE
===================================================== */

@media (max-width: 768px) {
    .section { padding: 80px 6%; }
    .details-grid { grid-template-columns: 1fr; }
    .detail { border-right: none; border-bottom: 1px solid var(--border-strong); }
    .detail:last-child { border-bottom: none; }
    .timer { grid-template-columns: repeat(2,1fr); }
    .timer div:nth-child(2)::after { display: none; }
    .gallery { grid-template-columns: repeat(2,1fr); grid-template-rows: auto; }
    .gallery img:nth-child(n) { grid-column: auto; grid-row: auto; min-height: 200px; }
    .envelope-scene { width: 88vw; }
    .hero-scroll { display: none; }
    footer { padding: 60px 24px; }
    .lightbox-nav { display: none; }
}

</style>

</head>

<script>

/* =====================================================
   GET INVITATION ID
===================================================== */

var params =
    new URLSearchParams(
        window.location.search
    );


var invitationId =
    (
        params.get("id") ||
        localStorage.getItem("luna_last_invitation") ||
        ""
    ).toLowerCase().trim();


/* =====================================================
   CHECK DATA — SHOW 404 IF MISSING
===================================================== */

var invitation = invitationId
    ? lunaGetInvitation(invitationId)
    : null;


if (!invitation) {

    document.title = lunaT("invErrorTitle") + " | Luna";

    document.body.innerHTML =

        '<div class="not-found">' +

            '<div class="not-found-content">' +

                '<div class="not-found-icon">&#9825;</div>' +

                '<h1>' + lunaT("invErrorTitle") + '</h1>' +

                '<p>' + lunaT("invErrorText") + '</p>' +

                '<div class="not-found-brand">LUNA</div>' +

            '</div>' +

        '</div>';

    throw new Error(
        "Invitation not found: " +
        invitationId
    );

}


/* =====================================================
   INIT i18n LANGUAGE
===================================================== */

lunaInitLanguage();


/* =====================================================
   PAGE TITLE
===================================================== */

document.title = lunaDisplayNames(invitation) + " | Luna Invitation";


/* =====================================================
   DESIGN THEME
===================================================== */

if (invitation.design) {
    document.documentElement.setAttribute(
        "data-design",
        invitation.design.toLowerCase()
    );
}


/* =====================================================
   OPENING STYLE (based on theme)
===================================================== */

(function() {
    var theme = (invitation.theme || "default").toLowerCase();
    var openingClass = "opening-elegant";
    if (theme === "editorial" || theme === "editorial-love") openingClass = "opening-editorial";
    else if (theme === "floral" || theme === "botanical" || theme === "garden") openingClass = "opening-floral";
    else if (theme === "noir" || theme === "black-gold" || theme === "luxe-gold" || theme === "dark") openingClass = "opening-luxury";
    else if (theme === "minimal" || theme === "minimal-white" || theme === "modern-classic") openingClass = "opening-minimal";
    document.querySelector(".envelope-scene").classList.add(openingClass);
})();


/* =====================================================
   HELPERS
===================================================== */

var pkg = (invitation.package || "basic").toLowerCase();
var cat = (invitation.category || "wedding").toLowerCase();
var isCouple = (
    cat === "wedding" ||
    cat === "engagement" ||
    cat === "anniversary" ||
    cat === "henna"
);
var displayDate = invitation.dateShort || lunaDateShort(invitation.date) || invitation.date || "";


/* =====================================================
   OPENING — LETTER CONTENT
===================================================== */

document.getElementById("letterEyebrow").textContent =
    lunaT("invOpen");

document.getElementById("letterNames").textContent =
    lunaDisplayNames(invitation);

document.getElementById("letterDate").textContent =
    displayDate;

document.getElementById("openButton").textContent =
    lunaT("invOpen");


/* =====================================================
   HERO — CATEGORY-AWARE NAMES
===================================================== */

document.getElementById("heroEyebrow").textContent =
    lunaInvitationHeading(invitation);

document.getElementById("date").textContent =
    displayDate;

(function buildHeroNames() {

    var container = document.getElementById("heroNames");

    if (isCouple) {

        var bride = invitation.bride || "";
        var groom = invitation.groom || "";

        var html = '<span class="name">' + lunaEscapeHtml(bride) + '</span>';

        if (groom) {
            html += '<span class="hero-amp">&amp;</span>';
            html += '<span class="name">' + lunaEscapeHtml(groom) + '</span>';
        }

        container.innerHTML = html;

    } else if (cat === "birthday") {

        var name = invitation.bride || invitation.celebrant || "";
        container.innerHTML =
            '<span class="name" style="font-size:clamp(48px,10vw,110px)">' +
            lunaEscapeHtml(name) +
            '</span>';

    } else if (cat === "graduation") {

        var name2 = invitation.bride || invitation.graduate || "";
        container.innerHTML =
            '<span class="name" style="font-size:clamp(48px,10vw,110px)">' +
            lunaEscapeHtml(name2) +
            '</span>';

    } else if (cat === "business") {

        var eventName = invitation.eventName || invitation.companyName || invitation.bride || "";
        container.innerHTML =
            '<span class="name" style="font-size:clamp(36px,7vw,80px)">' +
            lunaEscapeHtml(eventName) +
            '</span>';

    } else {

        container.innerHTML =
            '<span class="name" style="font-size:clamp(48px,10vw,110px)">' +
            lunaT("invRsvpHeading") +
            '</span>';

    }

})();


/* =====================================================
   HERO — VIDEO BACKGROUND
===================================================== */

if (invitation.videoUrl) {

    var hero = document.getElementById("hero");

    var video = document.createElement("video");
    video.autoplay = true;
    video.muted = true;
    video.loop = true;
    video.playsInline = true;
    video.className = "hero-video-bg";
    video.src = invitation.videoUrl;
    hero.insertBefore(video, hero.firstChild);

    var overlay = document.createElement("div");
    overlay.className = "hero-video-overlay";
    hero.insertBefore(overlay, document.getElementById("heroContent"));

    hero.style.background = "#1a1410";

}


/* =====================================================
   STORY SECTION (Luxury only)
===================================================== */

if (pkg !== "luxury") {
    document.getElementById("storySection").hidden = true;
}

document.getElementById("storyEyebrow").textContent =
    lunaT("invStoryTitle");

document.getElementById("storyHeading").innerHTML =
    lunaT("invStoryHeading");

if (invitation.story) {
    document.getElementById("story").innerHTML =
        lunaFormatStory(invitation.story);
}


/* =====================================================
   DETAILS SECTION
===================================================== */

document.getElementById("detailsEyebrow").textContent =
    lunaT("invDetailsTitle");

document.getElementById("detailsHeading").innerHTML =
    lunaT("invDetailsHeading");

document.getElementById("dateLabel").textContent =
    lunaT("invDateLabel");

document.getElementById("detailDate").textContent =
    displayDate;

document.getElementById("timeLabel").textContent =
    lunaT("invTimeLabel");

document.getElementById("time").textContent =
    invitation.time || "";

document.getElementById("venueLabel").textContent =
    lunaT("invVenueLabel");

document.getElementById("venue").textContent =
    invitation.venue || "";

document.getElementById("location").textContent =
    invitation.location || "";

var mapButton = document.getElementById("mapButton");
mapButton.textContent = lunaT("invMapBtn");

if (invitation.map) {
    mapButton.href = invitation.map;
} else {
    mapButton.hidden = true;
}

/* Time subtext based on category */
(function() {
    var sub = document.getElementById("timeSubtext");
    if (cat === "wedding" || cat === "engagement" || cat === "anniversary" || cat === "henna") {
        /* Qonaqların qarşılanması — keep generic */
    }
})();

/* Day name */
(function() {
    var dayEl = document.getElementById("dayName");
    if (invitation.date && /^\d{4}-\d{2}-\d{2}$/.test(invitation.date)) {
        var d = new Date(invitation.date + "T12:00:00");
        var dayNames = {
            az: ["Bazar","Bazar ertəsi","Çərşənbə axşamı","Çərşənbə","Cümə axşamı","Cümə","Şənbə"],
            en: ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"],
            ru: ["Воскресенье","Понедельник","Вторник","Среда","Четверг","Пятница","Суббота"],
            tr: ["Pazar","Pazartesi","Salı","Çarşamba","Perşembe","Cuma","Cumartesi"]
        };
        var lang = LUNA_LANG || "az";
        var arr = dayNames[lang] || dayNames.az;
        dayEl.textContent = arr[d.getDay()];
    } else {
        dayEl.textContent = "";
    }
})();


/* =====================================================
   GALLERY (Premium / Luxury)
===================================================== */

if (pkg !== "premium" && pkg !== "luxury") {
    document.getElementById("gallerySection").hidden = true;
}

document.getElementById("galleryHeading").textContent =

var galleryEl = document.getElementById("gallery");
var galleryImages = [];

if (invitation.images && invitation.images.length) {

    galleryImages = invitation.images.slice(0, 6);

    galleryImages.forEach(function(src, i) {
        var img = document.createElement("img");

/* =====================================================
   LIGHTBOX
===================================================== */

var lightbox = document.getElementById("lightbox");
var lightboxImg = document.getElementById("lightboxImg");
var lightboxCounter = document.getElementById("lightboxCounter");
var lightboxIndex = 0;

function lightboxOpen(index) {
    if (!galleryImages.length) return;
    lightboxIndex = index;
    lightboxImg.src = galleryImages[lightboxIndex];
    lightboxCounter.textContent =
        (lightboxIndex + 1) + " / " + galleryImages.length;
    lightbox.classList.add("active");
    document.body.style.overflow = "hidden";
}

function lightboxClose() {
    lightbox.classList.remove("active");
    document.body.style.overflow = "";
}

function lightboxPrev() {
    lightboxIndex =
        (lightboxIndex - 1 + galleryImages.length) % galleryImages.length;
    lightboxImg.src = galleryImages[lightboxIndex];
    lightboxCounter.textContent =
        (lightboxIndex + 1) + " / " + galleryImages.length;
}

function lightboxNext() {
    lightboxIndex =
        (lightboxIndex + 1) % galleryImages.length;
    lightboxImg.src = galleryImages[lightboxIndex];
    lightboxCounter.textContent =
        (lightboxIndex + 1) + " / " + galleryImages.length;
}

galleryEl.addEventListener("click", function(e) {
    if (e.target.tagName === "IMG") {
        var idx = parseInt(e.target.dataset.index, 10);
        if (!isNaN(idx)) lightboxOpen(idx);
    }
});

document.getElementById("lightboxClose").addEventListener("click", lightboxClose);
document.getElementById("lightboxPrev").addEventListener("click", lightboxPrev);
document.getElementById("lightboxNext").addEventListener("click", lightboxNext);

lightbox.addEventListener("click", function(e) {
    if (e.target === lightbox) lightboxClose();
});

document.addEventListener("keydown", function(e) {
    if (!lightbox.classList.contains("active")) return;
    if (e.key === "Escape") lightboxClose();
    if (e.key === "ArrowLeft") lightboxPrev();
    if (e.key === "ArrowRight") lightboxNext();
});


/* =====================================================
   COUNTDOWN (Premium / Luxury)
===================================================== */

if (pkg !== "premium" && pkg !== "luxury") {
    document.getElementById("countdownSection").hidden = true;

    lunaT("invCountdownTitle");

document.getElementById("countdownHeading").textContent =
    lunaT("invCountdownHeading");

document.getElementById("daysLabel").textContent = lunaT("invDays");
document.getElementById("hoursLabel").textContent = lunaT("invHours");
document.getElementById("minutesLabel").textContent = lunaT("invMinutes");
document.getElementById("secondsLabel").textContent = lunaT("invSeconds");

function updateCountdown() {

    var daysEl = document.getElementById("days");
    var hoursEl = document.getElementById("hours");
    var minutesEl = document.getElementById("minutes");
    var secondsEl = document.getElementById("seconds");

    var targetString = lunaCountdownTarget(invitation);

    if (!targetString) {
        daysEl.textContent = "00";
        hoursEl.textContent = "00";
        minutesEl.textContent = "00";
        secondsEl.textContent = "00";
        return;
    }

    var target = new Date(targetString);
    var now = new Date();
    var difference = target.getTime() - now.getTime();

    if (difference <= 0) {
        daysEl.textContent = "00";
        hoursEl.textContent = "00";
        minutesEl.textContent = "00";
        secondsEl.textContent = "00";
        return;
    }

    var days = Math.floor(difference / (1000 * 60 * 60 * 24));
    var hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    var minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
    var seconds = Math.floor((difference % (1000 * 60)) / 1000);

    daysEl.textContent = String(days).padStart(2, "0");
    hoursEl.textContent = String(hours).padStart(2, "0");
    minutesEl.textContent = String(minutes).padStart(2, "0");
    secondsEl.textContent = String(seconds).padStart(2, "0");
}

updateCountdown();
setInterval(updateCountdown, 1000);

function renderRsvpCounts() {
    var rsvps = lunaGetRsvps(invitationId);
    if (rsvps.length === 0) {
        rsvpCounts.hidden = true;
        return;
    }
    var yes = rsvps.filter(function(r) { return r.status === "yes"; }).length;
    var maybe = rsvps.filter(function(r) { return r.status === "maybe"; }).length;
    var no = rsvps.filter(function(r) { return r.status === "no"; }).length;

    document.getElementById("rsvpYesCount").innerHTML =
        "<strong>" + yes + "</strong>" + lunaT("invYesCount");
    document.getElementById("rsvpMaybeCount").innerHTML =
        "<strong>" + maybe + "</strong>" + lunaT("invMaybeCount");
    document.getElementById("rsvpNoCount").innerHTML =
        "<strong>" + no + "</strong>" + lunaT("invNoCount");

    rsvpCounts.hidden = false;
}

        status: document.getElementById("rsvpStatus").value,

    document.getElementById("rsvpGuests").value = "1";
    document.getElementById("rsvpMessage").value = "";

/* =====================================================
   SCROLL REVEAL
===================================================== */

(function() {
    var reveals = document.querySelectorAll(
        ".reveal-up, .reveal-scale"
    );

    if (!reveals.length) return;

    var observer = new IntersectionObserver(function(entries) {
        entries.forEach(function(entry) {
            if (entry.isIntersecting) {
                entry.target.classList.add("visible");
                observer.unobserve(entry.target);
            }
        });
    }, {
        threshold: 0.12,
        rootMargin: "0px 0px -30px 0px"
    });

    reveals.forEach(function(el) {
        observer.observe(el);
    });
})();

);
