<script>
/* Early opening-type pre-set. The chosen opening animation is applied here,
   FROM THE CACHED COPY, before the body (and the default envelope) has a
   chance to render. This stops the "wrong animation first, then the selected
   one" flash — previously data-opening was only set after the cloud fetch
   resolved. The full scene engine re-applies it with authoritative data. */
(function() {
    try {
        var _q = new URLSearchParams(window.location.search).get("id");
        if (!_q) return;
        _q = String(_q).toLowerCase().trim();
        var _c = localStorage.getItem("luna_" + _q);
        if (!_c) return;
        var _inv = JSON.parse(_c);
        var _raw = _inv.openingType || _inv.openingStyle || _inv.animationType || _inv.animationStyle
            || (_inv.visualSnapshot && _inv.visualSnapshot.openingType) || "";
        if (!_raw) return;
        var _alias = {
            "floral-reveal":"floral-paper","editorial-reveal":"editorial-card","luxury-reveal":"luxury-romance",
            "envelope-reveal":"envelope-seal","stairs-reveal":"stairs","wax-reveal":"wax-seal",
            "curtain-reveal":"curtain","ribbon-reveal":"ribbon","door-reveal":"door","wood-door-reveal":"wood-door",
            "starry-reveal":"starry-night","celebration-reveal":"celebration-pop","candlelight-reveal":"candlelight",
            "winter-reveal":"winter-drift","royal-reveal":"royal-scroll","typewriter-reveal":"typewriter",
            "magic-reveal":"magic-wand","glow-door":"glowing-door","forest-walk":"ancient-forest","book-reveal":"old-book"
        };
        document.documentElement.setAttribute("data-opening", _alias[_raw] || _raw);
    } catch (e) {}
})();
</script>

<script>
/* =====================================================
   CÜTLÜK RSVP PANELİ — klientlər üçün
   Qonaq heç nə görmür; cütlük yalnız ÖZ siyahısını görür.
   Magic-link (Supabase Auth) ilə giriş, RLS-yə söykənir.
===================================================== */
(function () {
    var panel = document.getElementById("couplePanel");
    if (!panel || !window.LUNA_SUPABASE || !window.LUNA_SUPABASE.url) return;

    var LL = window.LUNA_LANG || "az";
    function t(str) {
        return {
            en: str.en, ru: str.ru, tr: str.tr
        }[LL] || str.az;
    }
    var openBtn = document.getElementById("coupleOpenBtn");
    var loginBox = document.getElementById("coupleLoginBox");
    var loginForm = document.getElementById("coupleLoginForm");
    var emailInput = document.getElementById("coupleEmail");
    var emailLabel = document.getElementById("coupleEmailLabel");
    var sendBtn = document.getElementById("coupleSendBtn");
    var loginMsg = document.getElementById("coupleLoginMsg");
    var listBox = document.getElementById("coupleListBox");
    var listTitle = document.getElementById("coupleListTitle");
    var listBody = document.getElementById("coupleListBody");
    var signOut = document.getElementById("coupleSignOut");

    var i18n = {
        open:   { az: "Cütlük üçün RSVP (giriş)", en: "Couple RSVP (login)", ru: "RSVP для пары (вход)", tr: "Çift RSVP (giriş)" },
        emailL: { az: "E-mail", en: "Email", ru: "E-mail", tr: "E-posta" },
        send:   { az: "Giriş linki göndər", en: "Send login link", ru: "Отправить ссылку входа", tr: "Giriş bağlantısı gönder" },
        sent:   { az: "E-poçtunuza giriş linki göndərildi. Linkə daxil olub yenidən bu səhifəyə qayıdın.", en: "A login link was sent to your email. Open it and return to this page.", ru: "Ссылка для входа отправлена на почту. Откройте её и вернитесь на страницу.", tr: "E-postanıza giriş bağlantısı gönderildi. Açıp bu sayfaya dönün." },
        fetching:{ az: "RSVP-lər çəkilir...", en: "Loading RSVPs...", ru: "Загрузка ответов...", tr: "Yanıtlar yükleniyor..." },
        none:   { az: "Hələ RSVP yoxdur.", en: "No RSVPs yet.", ru: "Пока нет ответов.", tr: "Henüz yanıt yok." },
        signout:{ az: "Çıxış", en: "Sign out", ru: "Выйти", tr: "Çıkış" },
        title:  { az: "RSVP siyahısı", en: "RSVP list", ru: "Список ответов", tr: "Yanıt listesi" },
        need:   { az: "Daxil olmaq lazımdır (magic-link). Əgər link açılmadısa, bu e-mail cütlük kimi qeyd olunmalıdır.", en: "Please sign in (magic link). If it didn't open, this email must be registered as the couple.", ru: "Необходимо войти (magic-link). Если не открылось — этот e-mail должен быть сохранён как владелец.", tr: "Giriş gerekli (magic-link). Açılmadıysa bu e-posta çift olarak kayıtlı olmalı." }
    };

    openBtn.textContent = t(i18n.open);
    emailLabel.textContent = t(i18n.emailL);
    sendBtn.textContent = t(i18n.send);
    signOut.textContent = t(i18n.signout);

    function showList(rsvps) {
        listBox.hidden = false;
        loginBox.hidden = true;
        listTitle.textContent = t(i18n.title);
        if (!rsvps.length) {
            listBody.innerHTML = '<div class="couple-empty">' + t(i18n.none) + '</div>';
            return;
        }
        var statusText = { yes: "Gəlir ✓", maybe: "Bəlkə ?", no: "Gəlmir ✗" };
        listBody.innerHTML = rsvps.map(function (r) {
            var st = statusText[r.status] || r.status || "—";
            var guests = r.guests ? " · " + String(r.guests) + " qonaq" : "";
            var when = r.at;
            try { when = new Date(r.at).toLocaleString("az-AZ", { dateStyle: "short", timeStyle: "short" }); } catch (e) {}
            return '<div class="rsvp-row">' +
                '<div class="rsvp-head"><strong>' + (window.lunaEscapeHtml(r.name || "—")) + '</strong>' +
                '<span class="rsvp-status">' + st + '</span></div>' +
                (r.message ? '<div class="rsvp-msg">' + window.lunaEscapeHtml(r.message) + '</div>' : '') +
                (guests ? '<div class="rsvp-time">' + guests + '</div>' : '') +
                '<div class="rsvp-time">' + (window.lunaEscapeHtml(when || "")) + '</div>' +
                '</div>';
        }).join("");
    }

    function onAuthed(session) {
        if (!session) {
            /* Cütlük giriş etməyib — sadəcə düyməni göstər,
               login qutusu yalnız düyməyə kliklədikdə açılır.
               Qonaq heç bir RSVP siyahısı görmür. */
            openBtn.hidden = false;
            loginBox.hidden = true;
            listBox.hidden = true;
            return;
        }
        openBtn.hidden = true;
        loginBox.hidden = true;
        listBody.innerHTML = '<div class="couple-empty">' + t(i18n.fetching) + '</div>';
        listBox.hidden = false;
        window.lunaCoupleFetchOwnRsvps(invitationId).then(function (res) {
            if (res && res.error) {
                listBody.innerHTML = '<div class="couple-empty">' + t(i18n.need) + '</div>';
                return;
            }
            showList(res);
        });
    }

    openBtn.addEventListener("click", function () {
        loginMsg.textContent = "";
        loginBox.hidden = !loginBox.hidden;
    });

    loginForm.addEventListener("submit", function (e) {
        e.preventDefault();
        var email = emailInput.value.trim();
        if (!email) return;
        loginMsg.textContent = t(i18n.fetching);
        window.lunaCoupleSendMagicLink(email).then(function (res) {
            if (res && res.error) {
                loginMsg.textContent = (res.error.message ? String(res.error.message) : t(i18n.need));
                return;
            }
            loginMsg.textContent = t(i18n.sent);
        }).catch(function () {
            loginMsg.textContent = t(i18n.need);
        });
    });

    signOut.addEventListener("click", function () {
        window.lunaCoupleSignOut().then(function () {
            listBox.hidden = true;
            loginBox.hidden = false;
            openBtn.hidden = false;
            loginMsg.textContent = "";
        });
    });

    /* Magic-link ilə qayıdanda session-u yoxla.
       Yalnız əsl magic-link qayıdışı (URL-də token var) olduqda siyahını göstər.
       Adi səhifə açılışında köhnə/aktiv sessiyanı aktivləşdirmə —
       cütlük özü mail yazıb daxil olmalıdır, avtomatik girili qalmamalıdır. */
    function isRsvpMagicCallback() {
        var h = window.location.hash || "";
        var q = window.location.search || "";
        return /(access_token|id_token|refresh_token|code)\b/.test(h) ||
               /([?&](code|token|error_description)=)/.test(q);
    }

    if (isRsvpMagicCallback()) {
        window.lunaCoupleSession().then(function (session) {
            onAuthed(session);
        });
    } else {
        /* Adi açılış — köhnə sessiyanı təmizlə, cütlük özü girsinn */
        window.lunaCoupleSignOut().then(function () {
            onAuthed(null);
        });
    }
})();
</script>

    /* 1) Word-by-word heading reveal (re-wraps after i18n refills) */
    function wrapWords(el){
      if(!el||el.querySelector(".lx-w")||!el.textContent||!el.textContent.trim())return;
      var words=el.textContent.trim().split(/\s+/);
      if(words.length<2)return;
      el.textContent="";
      words.forEach(function(w,i){
        /* Keep the original spaces between words — the reveal spans are
           inline-block, so without an explicit space the words ran together
           (e.g. "Birlikdə sayağ." became "Birlikdəsayağ."). */
        if(i > 0) el.appendChild(document.createTextNode(" "));
        var sp=document.createElement("span");
        sp.className="lx-w";
        sp.textContent=w;
        sp.style.setProperty("--lx-i",i);
        el.appendChild(sp);
      });
    }
    function rewrap(){[].slice.call(document.querySelectorAll(".section h2")).forEach(wrapWords);}
    rewrap();
    if(window.MutationObserver){
      var scheduled=null;
      new MutationObserver(function(){
        if(scheduled)return;
        scheduled=requestAnimationFrame(function(){scheduled=null;rewrap();});
      }).observe(document.body,{childList:true,subtree:true,characterData:true});
    }

    /* 2) Section + gallery reveal (adds .lx-seen) */
    function markVisible(el){if(el)el.classList.add("lx-seen");}
    function idx(){var gal=document.getElementById("gallery");if(!gal)return;var imgs=gal.querySelectorAll("img");[].forEach.call(imgs,function(img,i){img.style.setProperty("--lx-i",i);});}
    function checkVisible(){
      var vh=window.innerHeight||document.documentElement.clientHeight;
      [].forEach.call(document.querySelectorAll(".section:not(.lx-seen)"),function(s){
        var r=s.getBoundingClientRect();
        if(r.top<vh*.92&&r.bottom>0)markVisible(s);
      });
      var gal=document.getElementById("gallery");
      if(gal&&!gal.classList.contains("lx-seen")){
        var gr=gal.getBoundingClientRect();
        if(gr.top<vh*.92&&gr.bottom>0){markVisible(gal);idx();}
      }
    }
    idx();setTimeout(idx,400);setTimeout(idx,1600);
    if("IntersectionObserver" in window){
      var io=new IntersectionObserver(function(entries){
        entries.forEach(function(en){
          if(en.isIntersecting){markVisible(en.target);if(en.target.id==="gallery")idx();}
        });
      },{threshold:.1,rootMargin:"0px 0px -8% 0px"});
      [].forEach.call(document.querySelectorAll(".section"),function(s){io.observe(s);});
      var gal0=document.getElementById("gallery");
      if(gal0)io.observe(gal0);
    }
    checkVisible();
    window.addEventListener("scroll",checkVisible,{passive:true});
    window.addEventListener("resize",checkVisible);
    var lxTimer=setInterval(function(){
      checkVisible();
      var done=true;
      [].forEach.call(document.querySelectorAll(".section"),function(s){if(!s.classList.contains("lx-seen"))done=false;});
      var gal2=document.getElementById("gallery");
      if(gal2&&!gal2.classList.contains("lx-seen"))done=false;
      if(done)clearInterval(lxTimer);
    },700);

    /* 3) Ambient themed particles (petals / gold dust / stars / confetti) */
    function ambient(){
      if(reduce)return;
      var mat=(docEl.getAttribute("data-material")||"").toLowerCase();
      var des=(docEl.getAttribute("data-design")||"").toLowerCase();
      var kind="dot",colors=["rgba(196,168,130,.55)"];
      var count=window.innerWidth<768?8:12;
      if(/botanical|flower|garden/.test(mat)){kind="petal";colors=["#8fb4a0","#b8c9a5","#d8c9b0","#e3b7a0"];}
      else if(/rose|blush|velvet|bloom|romantic/.test(mat)||/rose|blush|velvet|romantic/.test(des)){kind="petal";colors=["#d9a7b5","#e8c2cd","#f0d3da","#c88a9a"];}
      else if(/vintage/.test(mat)){kind="petal";colors=["#c9a877","#b8956e","#d8c9b0"];}
      else if(/royal|dark|noir|gold|luxe|black|oriental/.test(mat)||/royal|dark|noir|gold|luxe|black|oriental/.test(des)){kind="dot";colors=["#d4af37","#c8a870","#f0e0b8","#b8860b"];}
      else if(/aqua|starry|aurora|night/.test(mat)||/starry|aurora/.test(des)){kind="twinkle";colors=["#e8ecff","#cfe0ff","#ffd98a","#ffffff"];}
      else if(/pop|kids|fiesta|celebration/.test(mat)||/pop|kids|fiesta/.test(des)){kind="dot";colors=["#ff6b6b","#ff9f43","#4ecdc4","#f7d774"];}
      else if(/minimal|pearl|executive|conference|networking/.test(mat)){colors=["rgba(138,126,116,.35)"];}
      var layer=document.createElement("div");
      layer.id="lx-ambient";layer.setAttribute("aria-hidden","true");
      for(var i=0;i<count;i++){
        var pt=document.createElement("i");
        var c=colors[i%colors.length];
        var size=kind==="petal"?7+Math.random()*9:2+Math.random()*4;
        pt.style.left=(Math.random()*100).toFixed(1)+"%";
        pt.style.top=(Math.random()*100).toFixed(1)+"%";
        pt.style.width=size.toFixed(1)+"px";
        pt.style.height=(kind==="petal"?size*1.15:size).toFixed(1)+"px";
        pt.style.background=c;
        if(kind==="dot")pt.style.boxShadow="0 0 8px 1px "+c;
        pt.className=kind==="petal"?"lx-petal":(kind==="twinkle"?"lx-twinkle":"lx-dot");
        pt.style.setProperty("--lx-drift",((Math.random()*160)-80).toFixed(0)+"px");
        pt.style.setProperty("--lx-rot",(360+Math.random()*360).toFixed(0)+"deg");
        pt.style.setProperty("--lx-o",(.25+Math.random()*.4).toFixed(2));
        pt.style.animationDuration=(9+Math.random()*10).toFixed(1)+"s";
        pt.style.animationDelay=(-Math.random()*12).toFixed(1)+"s";
        layer.appendChild(pt);
      }
      document.body.appendChild(layer);
    }
    ambient();

    /* 4) Golden cursor sparkle trail (desktop only) */
    function trail(){
      if(reduce||!fine)return;
      var layer=document.createElement("div");
      layer.id="lx-trail";layer.setAttribute("aria-hidden","true");
      document.body.appendChild(layer);
      var last=0,count=0;
      document.addEventListener("pointermove",function(e){
        var now=Date.now();
        if(now-last<40)return;last=now;
        var sp=document.createElement("i");
        sp.style.left=(e.clientX-3)+"px";sp.style.top=(e.clientY-3)+"px";
        layer.appendChild(sp);count++;
        if(count>60){var f=layer.firstChild;if(f)layer.removeChild(f);}
        setTimeout(function(){if(sp.parentNode)sp.parentNode.removeChild(sp);},750);
      },{passive:true});
    }
    trail();

    /* 5) Magnetic lift on cards & map button */
    function magnet(){
      if(reduce||!fine)return;
      [].forEach.call(document.querySelectorAll(".detail, .map-button, .story-quote"),function(el){
        var raf=false;
        el.addEventListener("pointermove",function(e){
          if(raf)return;
          raf=true;
          requestAnimationFrame(function(){
            raf=false;
            var r=el.getBoundingClientRect();
            var dx=(e.clientX-(r.left+r.width/2))/r.width;
            var dy=(e.clientY-(r.top+r.height/2))/r.height;
            el.style.transform="translate("+(dx*8).toFixed(2)+"px,"+(dy*6).toFixed(2)+"px)";
          });
        });
        el.addEventListener("pointerleave",function(){el.style.transform="";});
      });
    }
    magnet();
  }catch(err){/* premium layer must never break the invitation */}
})();
</script>
