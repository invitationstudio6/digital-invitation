    text-shadow: 0 0 40px rgba(217,174,106,.5);
    z-index: 3;
    pointer-events: none;
    opacity: 0;
    transition: opacity 1.2s ease .4s;
}
[data-opening="luxury-romance"] .lux-monogram { opacity: 1; }
.scene-opened[data-opening="luxury-romance"] .lux-monogram { opacity: 0; }

[data-opening="luxury-romance"] .sig-scene { z-index: 4; }
[data-opening="luxury-romance"] .sig-card {
    background: linear-gradient(170deg, rgba(38,22,28,.92), rgba(20,10,14,.94));
    border-color: rgba(217,174,106,.45);
    backdrop-filter: blur(4px);
}
[data-opening="luxury-romance"] .sig-card h1 { color: #FBEFF2; }
[data-opening="luxury-romance"] .open-button { border-color: rgba(233,206,126,.5); color: #E9CE7E; }


/* =====================================================
   TYPE: CELEBRATION POP / CONFETTI (fiesta-pop)
===================================================== */

[data-opening="celebration-pop"] .envelope-scene { display: none; }
[data-opening="celebration-pop"] .opening {
    perspective: 800px;

    background:
        radial-gradient(circle at 18% 22%, rgba(255,159,67,.16), transparent 40%),
        radial-gradient(circle at 84% 76%, rgba(46,196,182,.14), transparent 42%),
        radial-gradient(circle at 76% 20%, rgba(255,107,107,.14), transparent 38%),
        linear-gradient(150deg, #FFF6EC, #FFEFD9);
    overflow: hidden;
}

.pop-bubble {
    position: fixed;
    border-radius: 50%;
    opacity: .5;
    pointer-events: none;
    animation: bubbleFloat 9s ease-in-out infinite alternate;
    z-index: 1;
}
@keyframes bubbleFloat {
    from { transform: translateY(0) scale(1); }
    to   { transform: translateY(-34px) scale(1.08); }
}

.confetti-piece {
    position: fixed;
    width: 9px;
    height: 14px;
    top: 42%;
    left: 50%;
    pointer-events: none;
    opacity: 0;
    z-index: 6;
}
.scene-opened[data-opening="celebration-pop"] .confetti-piece {
    animation: confettiBurst 1.5s cubic-bezier(.2,.6,.4,1) forwards;
}
@keyframes confettiBurst {
    0%   { opacity: 1; transform: translate(0,0) rotate(0deg); }
    100% { opacity: 0; transform: translate(var(--cx), var(--cy)) rotate(var(--cr)); }
}

[data-opening="celebration-pop"] .sig-card {
    border: 3px dashed rgba(255,159,67,.55);
    background: var(--white);
    border-radius: 22px;
    box-shadow: 0 24px 60px rgba(255,107,107,.18);
}
[data-opening="celebration-pop"] .sig-card h1 { color: #33253D; }

.scene-opened[data-opening="celebration-pop"] .pop-gift { animation: giftPop .7s cubic-bezier(.3,1.6,.5,1) both; }
.pop-gift { position: relative; z-index: 2; font-size: 54px; margin-bottom: -30px; filter: drop-shadow(0 12px 24px rgba(255,107,107,.3)); }
@keyframes giftPop {
    0%   { transform: scale(.4) rotate(-12deg); }
    70%  { transform: scale(1.18) rotate(6deg); }
    100% { transform: scale(1) rotate(0); }
}


/* =====================================================
   TYPE: STARRY NIGHT (starry-dream)
===================================================== */

[data-opening="starry-night"] .envelope-scene { display: none; }
[data-opening="starry-night"] .opening {
    background:
        radial-gradient(ellipse at 50% 115%, rgba(142,168,232,.22), transparent 60%),
        linear-gradient(185deg, #070A18 0%, #0E1226 55%, #171C36);
    overflow: hidden;
}

.twinkle-star {
    position: fixed;
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: #EEF1FC;
    opacity: .7;
    animation: twinkle 3.2s ease-in-out infinite;
    pointer-events: none;
    z-index: 1;
}
.twinkle-star.big { width: 5px; height: 5px; box-shadow: 0 0 12px rgba(238,241,252,.9); }
@keyframes twinkle {
    0%, 100% { opacity: .25; transform: scale(.85); }
    50%      { opacity: .95; transform: scale(1.15); }
}

.shooting-star {
    position: fixed;
    top: 16%;
    left: -14%;
    width: 150px;
    height: 2px;
    background: linear-gradient(90deg, transparent, #EEF1FC);
    border-radius: 2px;
    transform: rotate(18deg);
    opacity: 0;
    pointer-events: none;
    z-index: 2;
}
[data-opening="starry-night"] .shooting-star { animation: shootBy 5.5s ease-in infinite; animation-delay: 1s; }
@keyframes shootBy {
    0%, 66%  { opacity: 0; transform: translate(0,0) rotate(18deg); }
    72%      { opacity: 1; }
    92%      { opacity: 0; transform: translate(125vw,44vh) rotate(18deg); }
    100%     { opacity: 0; }
}
.scene-opened[data-opening="starry-night"] .shooting-star { animation: shootOnce 1s ease-out forwards; }
@keyframes shootOnce {
    0%  { opacity: 0; transform: translate(0,0) rotate(18deg); }
    15% { opacity: 1; }
    100%{ opacity: 0; transform: translate(125vw,44vh) rotate(18deg); }
}

.starry-moon {
    position: fixed;
    top: 12%;
    right: 14%;
    width: 74px;
    height: 74px;
    border-radius: 50%;
    background: radial-gradient(circle at 36% 34%, #FBF6E4, #E8C97A 68%);
    box-shadow: 0 0 60px rgba(232,201,122,.4);
    z-index: 1;
}

[data-opening="starry-night"] .sig-scene { z-index: 3; }
[data-opening="starry-night"] .sig-card {
    background: linear-gradient(168deg, rgba(23,28,54,.88), rgba(10,13,30,.94));
    border-color: rgba(142,168,232,.4);
    backdrop-filter: blur(3px);
}
[data-opening="starry-night"] .sig-card h1 { color: #EEF1FC; }
[data-opening="starry-night"] .sig-card small { color: rgba(220,226,245,.55); }
[data-opening="starry-night"] .sig-card p { color: rgba(220,226,245,.55); }
[data-opening="starry-night"] .open-button { border-color: rgba(232,201,122,.5); color: #E8C97A; }


/* =====================================================
   ENVELOPE
===================================================== */

.envelope-scene {
    position: relative;
    width: min(480px,85vw);
    perspective: 1200px;
}

.envelope {
    position: relative;
    width: 100%;
    padding-bottom: 68%;
    transform-style: preserve-3d;
    transition: transform .6s ease;
}

.envelope-body {
    position: absolute;
    inset: 0;
    background: var(--white);
    border: 1px solid var(--border-strong);
    overflow: hidden;
}

.envelope-body::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
        linear-gradient(135deg, transparent 49.5%, var(--border) 50%, transparent 50.5%),
        linear-gradient(-135deg, transparent 49.5%, var(--border) 50%, transparent 50.5%);
}

.envelope-body::after {
    content: "";
    position: absolute;
    inset: 8px;
    border: 1px solid var(--border);
}


/* =====================================================
   LETTER
===================================================== */

.letter {
    position: absolute;
    width: 84%;
    left: 8%;
    top: 8%;
    bottom: 8%;
    z-index: 3;
    background: var(--white);
    border: 1px solid var(--border-strong);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    transition: transform 1.8s cubic-bezier(.19,1,.22,1);
}

.letter::before {
    content: "";
    position: absolute;
    inset: 10px;
    border: 1px solid var(--border);
}

.letter-content {
    position: relative;
    z-index: 2;
    padding: 30px;
}

.letter-content small {
    font-family: "DM Sans", sans-serif;
    font-size: 8px;
    font-weight: 500;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: var(--accent);
}

.letter-content h1 {
    font-family: "Cormorant Garamond", serif;
    font-size: clamp(42px,7vw,68px);
    font-weight: 300;
    font-style: italic;
    line-height: 1.1;
    color: var(--fg-heading);
    margin: 18px 0 14px;
}

.letter-content p {
    font-family: "DM Sans", sans-serif;
    font-size: 10px;
    font-weight: 400;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--fg-muted);
}


/* =====================================================
   FLAP + SEAL
===================================================== */

.flap {
    position: absolute;
    inset: 0;
    z-index: 6;
    background: var(--white);
    border: 1px solid var(--border-strong);
    clip-path: polygon(0 0, 100% 0, 50% 65%);
    transform-origin: top center;
    transition: transform 1.5s cubic-bezier(.19,1,.22,1);
    backface-visibility: hidden;
}

.seal {
    position: absolute;
    z-index: 10;
    width: 50px;
    height: 50px;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%);
    border-radius: 50%;
    display: grid;
    place-items: center;
    font-family: "Cormorant Garamond", serif;
    font-size: 18px;
    font-weight: 400;
    font-style: italic;
    color: var(--white);
    background: var(--fg-heading);
    transition: opacity .6s ease, transform .8s cubic-bezier(.19,1,.22,1);
    box-shadow: 0 4px 20px rgba(62,37,24,.25);
}

.envelope.open .flap { transform: rotateX(180deg); }
.envelope.open .letter { transform: translateY(-110%); }
.envelope.open .seal { opacity: 0; transform: translateX(-50%) scale(.4); }


/* =====================================================
   OPEN BUTTON
===================================================== */

.open-button {
    margin-top: 40px;
    padding: 16px 40px;
    border: 1px solid var(--fg);
    background: transparent;
    color: var(--fg);
    font-family: "DM Sans", sans-serif;
    font-size: 9px;
    font-weight: 500;
    letter-spacing: 4px;
    text-transform: uppercase;
    transition: .4s ease;
    position: relative;
    overflow: hidden;
}

.open-button::before {
    content: "";
    position: absolute;
    inset: 0;
    background: var(--fg);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform .4s cubic-bezier(.4,0,.2,1);
    z-index: -1;
}

.open-button:hover {
    color: var(--white);
}

.open-button:hover::before {
    transform: scaleX(1);
}


/* =====================================================
   INVITATION + HERO
===================================================== */

.invitation {
    opacity: 0;
    transition: opacity 1.6s cubic-bezier(.4,0,.2,1);
}

.invitation.visible { opacity: 1; }

.hero {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 120px 24px;
    position: relative;
    overflow: hidden;
    background: var(--cover) center/cover no-repeat;
}

.hero::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
        radial-gradient(ellipse at 50% 40%, rgba(245,237,227,.60) 0%, transparent 60%),
        linear-gradient(to bottom, rgba(62,37,24,.05), rgba(62,37,24,.25));
    z-index: 1;
}

.hero::after {
    content: "";
    position: absolute;
    width: min(600px,80vw);
    height: min(600px,80vw);
    border-radius: 50%;
    border: 1px solid rgba(255,252,247,.10);
    z-index: 1;
    animation: heroPulse 8s ease-in-out infinite;
}

[data-design="noir"] .hero::before {
    background:
        radial-gradient(ellipse at 50% 40%, rgba(26,26,26,.40) 0%, transparent 60%),
        linear-gradient(to bottom, rgba(0,0,0,.20), rgba(0,0,0,.50));
}

@keyframes heroPulse {
    0%,100% { transform: scale(.96); opacity: .4; }
    50% { transform: scale(1.02); opacity: .8; }
}

.hero-content {
    position: relative;
    z-index: 2;
}

.hero-eyebrow {
    font-family: "DM Sans", sans-serif;
    font-size: 9px;
    font-weight: 500;
    letter-spacing: 6px;
    text-transform: uppercase;
    color: rgba(255,252,247,.6);
    margin-bottom: 10px;
}

.hero-names {
    margin-top: 24px;
}

.hero-names .name {
    display: block;
    font-family: "Cormorant Garamond", serif;
    font-size: clamp(64px,12vw,140px);
    font-weight: 300;
    font-style: italic;
    line-height: .85;
    color: var(--white);
    text-shadow: 0 2px 40px rgba(0,0,0,.15);
    animation: nameReveal 1.2s .3s cubic-bezier(.19,1,.22,1) both;
}

.hero-names .name:nth-child(3) {
    animation-delay: .5s;
}

@keyframes nameReveal {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
}

.hero-amp {
    display: block;
    font-family: "Allura", cursive;
    font-size: clamp(28px,4vw,44px);
    color: rgba(255,252,247,.40);
    margin: 8px 0;
    animation: nameReveal 1s .4s cubic-bezier(.19,1,.22,1) both;
}

.hero-date {
    margin-top: 40px;
    font-family: "DM Sans", sans-serif;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 7px;
    text-transform: uppercase;
    color: rgba(255,252,247,.55);
    animation: nameReveal 1s .7s cubic-bezier(.19,1,.22,1) both;
}

.hero-scroll {
    position: absolute;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    color: rgba(255,252,247,.4);
    font-family: "DM Sans", sans-serif;
    font-size: 8px;
    font-weight: 500;
    letter-spacing: 3px;
    text-transform: uppercase;
    animation: nameReveal 1s 1s cubic-bezier(.19,1,.22,1) both;
}

.hero-scroll::after {
    content: "";
    width: 1px;
    height: 35px;
    background: rgba(255,252,247,.3);
    animation: scrollPulse 2s ease-in-out infinite;
}

@keyframes scrollPulse {
    0%,100% { transform: scaleY(.4); opacity: .3; transform-origin: top; }
    50% { transform: scaleY(1); opacity: .8; transform-origin: top; }
}

.hero-video-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom, rgba(62,37,24,.30), rgba(62,37,24,.60));
    z-index: 1;
    pointer-events: none;
}

.hero-video-bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 0;
}


/* =====================================================
   SECTIONS
===================================================== */

.section {
    padding: 120px 8%;
    text-align: center;
}

.section-divider {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    margin: 0 auto 50px;
}

.section-divider::before,
.section-divider::after {
    content: "";
    width: 40px;
    height: 1px;
    background: var(--border-strong);
}

.section-divider span {
    font-size: 10px;
    color: var(--accent);
}

.section-eyebrow {
    font-family: "DM Sans", sans-serif;
    font-size: 9px;
    font-weight: 500;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 16px;
}

.section h2 {
    font-family: "Cormorant Garamond", serif;
    font-size: clamp(38px,6vw,64px);
    font-weight: 300;
    font-style: italic;
    line-height: 1.1;
    color: var(--fg-heading);
    margin-bottom: 30px;
}

.section-text {
    max-width: 480px;
    margin: auto;
    font-size: 16px;
    font-weight: 300;
    line-height: 2;
    color: var(--fg-muted);
}


/* =====================================================
   SCROLL REVEAL
===================================================== */

.reveal-up {
    opacity: 0;
    transform: translateY(40px);
    transition: opacity 1.2s cubic-bezier(.19,1,.22,1), transform 1.2s cubic-bezier(.19,1,.22,1);
}

.reveal-up.visible {
    opacity: 1;
    transform: translateY(0);
}

.reveal-scale {
    opacity: 0;
    transform: scale(.96);
    transition: opacity 1.2s ease, transform 1.2s cubic-bezier(.19,1,.22,1);
}

.reveal-scale.visible {
    opacity: 1;
    transform: scale(1);
}

.reveal-left {
    opacity: 0;
    transform: translateX(-40px);
    transition: opacity 1.2s cubic-bezier(.19,1,.22,1), transform 1.2s cubic-bezier(.19,1,.22,1);
}

.reveal-left.visible {
    opacity: 1;
    transform: translateX(0);
}

.reveal-right {
    opacity: 0;
    transform: translateX(40px);
    transition: opacity 1.2s cubic-bezier(.19,1,.22,1), transform 1.2s cubic-bezier(.19,1,.22,1);
}

.reveal-right.visible {
    opacity: 1;
    transform: translateX(0);
}

/* Staggered children reveal */
.stagger-reveal > * {
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 0.8s cubic-bezier(.19,1,.22,1), transform 0.8s cubic-bezier(.19,1,.22,1);
}
.stagger-reveal.visible > *:nth-child(1) { transition-delay: 0s; opacity: 1; transform: translateY(0); }
.stagger-reveal.visible > *:nth-child(2) { transition-delay: 0.1s; opacity: 1; transform: translateY(0); }
.stagger-reveal.visible > *:nth-child(3) { transition-delay: 0.2s; opacity: 1; transform: translateY(0); }
.stagger-reveal.visible > *:nth-child(4) { transition-delay: 0.3s; opacity: 1; transform: translateY(0); }
.stagger-reveal.visible > *:nth-child(5) { transition-delay: 0.4s; opacity: 1; transform: translateY(0); }

/* Parallax hero */
.hero.parallax-active .hero-content {
    transition: transform 0.1s linear;
}

/* Cinematic divider line */
.section-divider.cinematic {
    position: relative;
    overflow: visible;
}
.section-divider.cinematic::before {
    width: 80px;
    height: 1px;
    background: linear-gradient(to right, transparent, var(--accent), transparent);
}
.section-divider.cinematic::after {
    width: 80px;
    height: 1px;
    background: linear-gradient(to left, transparent, var(--accent), transparent);
}

/* Dramatic name reveal */
.hero-names .name {
    animation: dramaticNameReveal 1.5s .3s cubic-bezier(.19,1,.22,1) both;
}
.hero-names .hero-amp {
    animation: dramaticAmpReveal 1.2s .6s cubic-bezier(.19,1,.22,1) both;
}
.hero-names .name:nth-child(3) {
    animation-delay: .7s;
}

@keyframes dramaticNameReveal {
    from { opacity: 0; transform: translateY(40px) scale(0.95); filter: blur(4px); }
    to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
}

@keyframes dramaticAmpReveal {
    from { opacity: 0; transform: scale(0.5) rotate(-10deg); }
    to { opacity: 1; transform: scale(1) rotate(0deg); }
}

/* Smooth section entrance */
.section {
    transition: opacity 0.8s ease;
}

/* Details grid cinematic hover */
.detail {
    transition: background .6s ease, transform .4s ease;
}
.detail:hover {
    transform: translateY(-2px);
}


/* =====================================================
   STORY SECTION
===================================================== */

.story-quote {
    position: relative;
    max-width: 560px;
    margin: 0 auto;
    padding: 0 40px;
}

.story-quote::before {
    content: "\201C";
    position: absolute;
    left: 0;
    top: -20px;
    font-family: "Cormorant Garamond", serif;
    font-size: 80px;
    font-weight: 300;
    color: var(--accent);
    opacity: .3;
    line-height: 1;
}


/* =====================================================
   DETAILS
===================================================== */

.details-section {
    background: var(--bg-alt);
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
}

.details-grid {
    max-width: 900px;
    margin: 50px auto 0;
    display: grid;
    grid-template-columns: repeat(3,1fr);
    border-top: 1px solid var(--border-strong);
    border-bottom: 1px solid var(--border-strong);
}

.detail {
    padding: 44px 20px;
    border-right: 1px solid var(--border-strong);
    transition: background .4s ease;
}

.detail:last-child { border-right: none; }
.detail:hover { background: var(--accent-light); }

.detail small {
    font-family: "DM Sans", sans-serif;
    font-size: 8px;
    font-weight: 500;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--accent);
}

.detail strong {
    display: block;
    margin: 18px 0 8px;
    font-family: "Cormorant Garamond", serif;
    font-size: 30px;
    font-weight: 300;
    font-style: italic;
    color: var(--fg-heading);
}

.detail p {
    font-size: 13px;
    font-weight: 300;
    color: var(--fg-muted);
}

.map-button {
    display: inline-block;
    margin-top: 18px;
    padding: 10px 22px;
    border: 1px solid var(--border-strong);
    font-family: "DM Sans", sans-serif;
    font-size: 8px;
    font-weight: 500;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--fg);
    transition: .35s ease;
    position: relative;
    overflow: hidden;
}

.map-button::before {
    content: "";
    position: absolute;
    inset: 0;
    background: var(--fg);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform .35s cubic-bezier(.4,0,.2,1);
    z-index: -1;
}

.map-button:hover { color: var(--white); }
.map-button:hover::before { transform: scaleX(1); }


/* =====================================================
   GALLERY
===================================================== */

.gallery-section { padding-left: 0; padding-right: 0; }

.gallery {
    width: 100%;
    margin-top: 50px;
}

.gallery img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: saturate(.9);
    transition: transform 1.4s cubic-bezier(.19,1,.22,1), filter .6s ease;
    cursor: pointer;
    display: block;
}

.gallery img:hover {
    transform: scale(1.03);
    filter: saturate(1.05);
}

.gallery img[onerror] {
    display: none;
}

/* Gallery Style: Editorial — asymmetric 2-column with large hero */
.gallery-style-editorial {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
}
.gallery-style-editorial img:first-child {
    grid-column: 1 / -1;
    height: 400px;
}
.gallery-style-editorial img {
    height: 260px;
}

/* Gallery Style: Masonry — Pinterest-style columns */
.gallery-style-masonry {
    column-count: 3;
    column-gap: 6px;
}
.gallery-style-masonry img {
    width: 100%;
    height: auto;
    margin-bottom: 6px;
    break-inside: avoid;
}

/* Gallery Style: Polaroid — centered with padding and slight rotation */
.gallery-style-polaroid {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    justify-content: center;
    padding: 20px 0;
}
.gallery-style-polaroid img {
    width: 220px;
    height: 280px;
    box-shadow: 0 4px 20px rgba(0,0,0,.15);
    border-radius: 2px;
    padding: 8px 8px 40px 8px;
    background: var(--white, #FFFCF7);
    transition: transform 0.6s cubic-bezier(.19,1,.22,1);
}
.gallery-style-polaroid img:nth-child(odd) { transform: rotate(-2deg); }
.gallery-style-polaroid img:nth-child(even) { transform: rotate(2deg); }
.gallery-style-polaroid img:hover { transform: rotate(0deg) scale(1.05); }

/* Gallery Style: Fullscreen — single image at a time, stacked vertically */
.gallery-style-fullscreen {
    display: flex;
    flex-direction: column;
    gap: 0;
}
.gallery-style-fullscreen img {
    width: 100%;
    height: 80vh;
    min-height: 400px;
}

/* Gallery Style: Collage — organic overlapping layout */
.gallery-style-collage {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(3, 200px);
    gap: 8px;
}
.gallery-style-collage img:nth-child(1) { grid-column: 1 / 3; grid-row: 1 / 3; }
.gallery-style-collage img:nth-child(2) { grid-column: 3 / 5; grid-row: 1 / 2; }
.gallery-style-collage img:nth-child(3) { grid-column: 3 / 4; grid-row: 2 / 3; }
.gallery-style-collage img:nth-child(4) { grid-column: 4 / 5; grid-row: 2 / 3; }
.gallery-style-collage img:nth-child(5) { grid-column: 1 / 3; grid-row: 3 / 4; }
.gallery-style-collage img:nth-child(6) { grid-column: 3 / 5; grid-row: 3 / 4; }

/* Gallery Style: Slider — horizontal scroll */
.gallery-style-slider {
    display: flex;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    gap: 12px;
    padding: 10px 0;
    -webkit-overflow-scrolling: touch;
}
.gallery-style-slider::-webkit-scrollbar { height: 4px; }
.gallery-style-slider::-webkit-scrollbar-thumb { background: var(--accent, #C4A882); border-radius: 2px; }
.gallery-style-slider img {
    flex: 0 0 80%;
    max-width: 400px;
    height: 320px;
    scroll-snap-align: center;
    border-radius: 4px;
}

/* Gallery Style: Grid — clean uniform grid (default fallback) */
.gallery-style-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
}
.gallery-style-grid img {
    height: 250px;
}

/* Single image layout — always beautiful */
.gallery img:only-child {
    width: 100%;
    max-height: 500px;
    height: auto;
    object-fit: cover;
    border-radius: 4px;
}

/* Two images — side by side */
.gallery-style-grid img:nth-child(1):nth-last-child(1),
.gallery-style-editorial img:nth-child(1):nth-last-child(1) {
    grid-column: 1 / -1;
}

/* Single image for non-grid styles */
.gallery-style-masonry img:only-child,
.gallery-style-collage img:only-child {
    column-span: all;
    width: 100%;
    max-height: 500px;
}
.gallery-style-collage img:only-child {
    grid-column: 1 / -1;
    grid-row: 1 / -1;
}


/* =====================================================
   LIGHTBOX
===================================================== */

.lightbox {
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: rgba(0,0,0,.92);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    visibility: hidden;
    transition: opacity .4s ease, visibility .4s;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
}

.lightbox.active {
    opacity: 1;
    visibility: visible;
}

.lightbox img {
    max-width: 90vw;
    max-height: 85vh;
    object-fit: contain;
    border-radius: 2px;
    box-shadow: 0 8px 60px rgba(0,0,0,.5);
    transform: scale(.92);
    transition: transform .5s cubic-bezier(.19,1,.22,1);
}

.lightbox.active img {
    transform: scale(1);
}

.lightbox-close {
    position: absolute;
    top: 24px;
    right: 24px;
    width: 44px;
    height: 44px;
    border: 1px solid rgba(255,255,255,.2);
    border-radius: 50%;
    background: transparent;
    color: #fff;
    font-size: 18px;
    display: grid;
    place-items: center;
    cursor: pointer;
    transition: .3s ease;
}

.lightbox-close:hover {
    background: rgba(255,255,255,.15);
}

.lightbox-nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 48px;
    height: 48px;
    border: 1px solid rgba(255,255,255,.15);
    border-radius: 50%;
    background: transparent;
    color: #fff;
    font-size: 20px;
    display: grid;
    place-items: center;
    cursor: pointer;
    transition: .3s ease;
}

.lightbox-nav:hover {
    background: rgba(255,255,255,.1);
}

.lightbox-prev { left: 20px; }
.lightbox-next { right: 20px; }

.lightbox-counter {
    position: absolute;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    font-family: "DM Sans", sans-serif;
    font-size: 11px;
    letter-spacing: 3px;
    color: rgba(255,255,255,.5);
}


/* =====================================================
   COUNTDOWN
===================================================== */

.countdown-section {
    position: relative;
    background: var(--fg-heading);
    color: var(--white);
    overflow: hidden;
}

.countdown-section::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
        radial-gradient(ellipse at 30% 50%, rgba(196,168,130,.08), transparent 50%),
        radial-gradient(ellipse at 70% 50%, rgba(196,168,130,.05), transparent 50%);
}

.countdown-section::after {
    content: "";
    position: absolute;
    width: min(500px,70vw);
    height: min(500px,70vw);
    border-radius: 50%;
    border: 1px solid rgba(255,252,247,.05);
    left: 50%;
    top: 50%;
    transform: translate(-50%,-50%);
    pointer-events: none;
}

.countdown-section .section-eyebrow {
    position: relative;
    color: var(--accent);
}

.countdown-section h2 {
    position: relative;
    color: var(--white);
    margin-top: 14px;
    margin-bottom: 0;
}

.timer {
    position: relative;
    max-width: 700px;
    margin: 55px auto 0;
    display: grid;
    grid-template-columns: repeat(4,1fr);
    border-top: 1px solid rgba(255,252,247,.08);
    border-bottom: 1px solid rgba(255,252,247,.08);
}

.timer div {
    position: relative;
    padding: 30px 16px;
    text-align: center;
}

.timer div:not(:last-child)::after {
    content: "";
    position: absolute;
    right: 0;
    top: 25%;
    width: 1px;
    height: 50%;
    background: rgba(255,252,247,.08);
}

.timer strong {
    display: block;
    font-family: "Cormorant Garamond", serif;
    font-size: clamp(42px,5vw,70px);
    font-weight: 300;
    font-style: italic;
    color: var(--white);
    line-height: 1;
    font-variant-numeric: tabular-nums;
    min-width: 2ch;
}

.timer span {
    display: block;
    margin-top: 12px;
    font-family: "DM Sans", sans-serif;
    font-size: 8px;
    font-weight: 500;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--accent);
}


/* =====================================================
   RSVP
===================================================== */

.rsvp-section {
    position: relative;
    /* White cards inside — fixed ink colors, independent of page theme */
    --rsvp-ink: #2D1B12;
    --rsvp-ink-soft: rgba(45,27,18,.55);
    --rsvp-line: rgba(45,27,18,.16);
    background:
        radial-gradient(ellipse at 50% 0%, var(--accent-light), transparent 62%),
        var(--bg-alt);
    border-top: 1px solid var(--border);
    overflow: hidden;
}

.rsvp-button {
    margin-top: 36px;
    padding: 18px 44px;
    border: none;
    border-radius: 100px;
    background: linear-gradient(135deg, var(--accent), var(--gold));
    color: #fff;
    font-family: "DM Sans", sans-serif;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 3px;
    text-transform: uppercase;
    cursor: pointer;
    transition: transform .35s cubic-bezier(.19,1,.22,1), box-shadow .35s ease;
    position: relative;
    overflow: hidden;
    box-shadow: 0 12px 32px -10px var(--accent-light), 0 0 0 1px rgba(255,255,255,.14) inset;
    animation: rsvpGlow 3.2s ease-in-out infinite;
}

@keyframes rsvpGlow {
    0%,100% { box-shadow: 0 12px 32px -10px var(--accent-light), 0 0 0 1px rgba(255,255,255,.14) inset; }
    50% { box-shadow: 0 16px 46px -10px var(--accent), 0 0 0 7px var(--accent-light), 0 0 0 1px rgba(255,255,255,.14) inset; }
}

.rsvp-button::after {
    content: "";
    position: absolute;
    top: 0;
    bottom: 0;
    width: 42%;
    left: -70%;
    background: linear-gradient(105deg, transparent, rgba(255,255,255,.4), transparent);
    transform: skewX(-20deg);
    animation: rsvpShine 3.4s ease-in-out infinite;
    pointer-events: none;
}

@keyframes rsvpShine { 0%,55% { left: -70%; } 85%,100% { left: 140%; } }

.rsvp-button:hover { transform: translateY(-2px) scale(1.02); }

.rsvp-form {
    margin: 28px auto 0;
    display: grid;
    gap: 14px;
    max-width: 460px;
    padding: 28px 26px 26px;
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 22px;
    box-shadow: 0 28px 64px -28px rgba(45,27,18,.22), 0 0 0 1px rgba(255,255,255,.4) inset;
    text-align: left;
    animation: rsvpCardIn .55s cubic-bezier(.19,1,.22,1) both;
}

@keyframes rsvpCardIn {
    from { opacity: 0; transform: translateY(20px) scale(.98); }
    to { opacity: 1; transform: none; }
}

/* --- Floating label fields --- */
.rsvp-field { position: relative; }

.rsvp-field input {
    width: 100%;
    padding: 19px 16px 8px;
    border: 1.5px solid var(--rsvp-line);
    background: rgba(255,255,255,.65);
    font-family: "DM Sans", sans-serif;
    font-size: 14px;
    color: var(--rsvp-ink);
    border-radius: 12px;
    outline: none;
    transition: border-color .25s ease, box-shadow .25s ease, background .25s ease;
    -webkit-appearance: none;
    appearance: none;
}

.rsvp-field label {
    position: absolute;
    left: 17px;
    top: 50%;
    transform: translateY(-50%);
    font-family: "DM Sans", sans-serif;
    font-size: 13px;
    color: var(--rsvp-ink-soft);
    pointer-events: none;
    transition: all .22s cubic-bezier(.4,0,.2,1);
}

.rsvp-field input:focus,
.rsvp-field input:not(:placeholder-shown) {
    border-color: var(--accent);
    background: #fff;
    box-shadow: 0 0 0 3px var(--accent-light);
}

.rsvp-field input:focus + label,
.rsvp-field input:not(:placeholder-shown) + label {
    top: 10px;
    transform: none;
    font-size: 8.5px;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--accent);
}

/* --- Segmented status selector --- */
.rsvp-segmented {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    padding: 6px;
    background: rgba(45,27,18,.05);
    border: 1px solid rgba(45,27,18,.08);
    border-radius: 14px;
}

.rsvp-seg {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    padding: 10px 6px 9px;
    border: none;
    border-radius: 10px;
    background: transparent;
    color: var(--rsvp-ink-soft);
    font-family: "DM Sans", sans-serif;
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all .3s cubic-bezier(.19,1,.22,1);
    line-height: 1.3;
}

.rsvp-seg-ico {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    font-size: 11px;
    font-style: normal;
    font-weight: 600;
    border: 1.5px solid rgba(45,27,18,.18);
    transition: all .3s cubic-bezier(.19,1,.22,1);
}

.rsvp-seg:hover { color: var(--rsvp-ink); transform: translateY(-1px); }

.rsvp-seg.active {
    background: var(--white);
    color: var(--rsvp-ink);
    box-shadow: 0 8px 22px -8px rgba(45,27,18,.25);
    transform: translateY(-1px);
}

.rsvp-seg.active .rsvp-seg-ico {
    background: linear-gradient(135deg, var(--accent), var(--gold));
    border-color: transparent;
    color: #fff;
    box-shadow: 0 4px 12px -3px var(--accent);
}

/* Native select kept for JS compatibility — visually hidden */
.rsvp-native-status {
    position: absolute;
    width: 1px;
    height: 1px;
    opacity: 0;
    pointer-events: none;
}

/* --- Guest stepper + message row --- */
.rsvp-row {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 10px;
    align-items: stretch;
}

.rsvp-stepper {
    display: flex;
    align-items: center;
    border: 1.5px solid var(--rsvp-line);
    border-radius: 12px;
    background: rgba(255,255,255,.65);
    overflow: hidden;
    transition: border-color .25s ease, box-shadow .25s ease;
}

.rsvp-stepper:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-light);
}

.rsvp-step-btn {
    width: 40px;
    height: 47px;
    border: none;
    background: transparent;
    color: var(--rsvp-ink);
    font-family: "DM Sans", sans-serif;
    font-size: 18px;
    font-weight: 500;
    cursor: pointer;
    transition: background .2s ease, color .2s ease;
    display: grid;
    place-items: center;
    padding: 0;
}

.rsvp-step-btn:hover { background: var(--accent-light); color: var(--rsvp-ink); }
.rsvp-step-btn:active { background: var(--accent); color: #fff; }

#rsvpGuests {
    width: 44px;
    border: none;
    background: transparent;
    text-align: center;
    font-family: "DM Sans", sans-serif;
    font-size: 14px;
    font-weight: 600;
    color: var(--rsvp-ink);
    -moz-appearance: textfield;
    appearance: textfield;
    padding: 0;
}

#rsvpGuests::-webkit-outer-spin-button,
#rsvpGuests::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
#rsvpGuests:focus { outline: none; }

.rsvp-submit { margin-top: 4px; width: 100%; }

.rsvp-form[hidden],
#rsvpThanks[hidden],
.music-button[hidden] { display: none !important; }

#rsvpThanks {
    margin: 26px auto 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    max-width: 460px;
    padding: 16px 22px;
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: 0 20px 48px -24px rgba(45,27,18,.2);
    font-family: "Cormorant Garamond", serif;
    font-size: 18px;
    font-style: italic;
    color: var(--rsvp-ink);
    animation: rsvpCardIn .55s cubic-bezier(.19,1,.22,1) both;
}

#rsvpThanks::before {
    content: "✓";
    flex-shrink: 0;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: linear-gradient(135deg, var(--accent), var(--gold));
    color: #fff;
    font-family: "DM Sans", sans-serif;
    font-style: normal;
    font-size: 13px;
    font-weight: 600;
    animation: rsvpCheckPop .6s cubic-bezier(.19,1,.22,1) .18s both;
}

@keyframes rsvpCheckPop {
    from { transform: scale(0) rotate(-40deg); }
    to { transform: scale(1) rotate(0); }
}

.music-button {
    position: fixed;
    right: 24px;
    bottom: 24px;
    z-index: 40;
    border: 1px solid var(--border-strong);
    border-radius: 0;
    padding: 12px 18px;
    background: var(--white);
    color: var(--fg);
    font-family: "DM Sans", sans-serif;
    font-size: 9px;
    font-weight: 500;
    letter-spacing: 2px;
    text-transform: uppercase;
    transition: .35s ease;
}

.music-button:hover {
    background: var(--fg);
    color: var(--white);
    border-color: var(--fg);
}

.rsvp-counts {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 26px;
}

.rsvp-counts[hidden] { display: none !important; }

.rsvp-counts span {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    padding: 10px 18px;
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 100px;
    font-family: "DM Sans", sans-serif;
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--rsvp-ink-soft);
    box-shadow: 0 8px 20px -10px rgba(45,27,18,.15);
}

.rsvp-counts span::before {
    content: "";
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-light);
}

.rsvp-counts span:first-child::before { background: #5B8C6F; box-shadow: 0 0 0 3px rgba(91,140,111,.18); }
.rsvp-counts span:nth-child(2)::before { background: #D4915A; box-shadow: 0 0 0 3px rgba(212,145,90,.18); }
.rsvp-counts span:last-child::before { background: #B76E79; box-shadow: 0 0 0 3px rgba(183,110,121,.18); }

.rsvp-counts strong {
    font-family: "Cormorant Garamond", serif;
    font-size: 19px;
    font-weight: 600;
    font-style: normal;
    color: var(--rsvp-ink);
    line-height: 1;
}


/* =====================================================
   FOOTER
===================================================== */

footer {
    padding: 80px 24px;
    text-align: center;
    background: var(--fg-heading);
    color: var(--bg);
    position: relative;
    overflow: hidden;
}

footer::before {
    content: "";
    position: absolute;
    width: min(400px,60vw);
    height: min(400px,60vw);
    border-radius: 50%;
    border: 1px solid rgba(255,252,247,.04);
    left: 50%;
    top: 50%;
    transform: translate(-50%,-50%);
    pointer-events: none;
}

footer strong {
    position: relative;
    font-family: "Cormorant Garamond", serif;
    font-size: clamp(48px,8vw,72px);
    font-weight: 300;
    font-style: italic;
    display: block;
}

footer p {
    position: relative;
    font-family: "DM Sans", sans-serif;
    font-size: 8px;
    font-weight: 500;
    letter-spacing: 5px;
    text-transform: uppercase;
    margin-top: 18px;
    color: var(--accent);
    opacity: .6;
}


/* =====================================================
   404 PAGE
===================================================== */

.not-found {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px;
    background: var(--bg);
    position: relative;
    overflow: hidden;
}

.not-found::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
        radial-gradient(ellipse at 30% 30%, var(--accent-light), transparent 50%),
        radial-gradient(ellipse at 70% 70%, var(--accent-light), transparent 50%);
}

.not-found-content {
    position: relative;
    z-index: 1;
}

.not-found-icon {
    font-size: 48px;
    margin-bottom: 32px;
    opacity: .25;
}

.not-found h1 {
    font-family: "Cormorant Garamond", serif;
    font-size: clamp(42px,8vw,72px);
    font-weight: 300;
    font-style: italic;
    color: var(--fg-heading);
    margin-bottom: 16px;
    line-height: 1.1;
}

.not-found p {
    font-family: "DM Sans", sans-serif;
    font-size: 13px;
    color: var(--fg-muted);
    margin-bottom: 40px;
    letter-spacing: 1px;
}

.not-found-brand {
    font-family: "DM Sans", sans-serif;
    font-size: 8px;
    font-weight: 500;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: var(--accent);
    opacity: .5;
    margin-top: 60px;
}


/* =====================================================
   HIDDEN UTILITY
===================================================== */

[hidden] { display: none !important; }

.opening-editorial .envelope-body { border: 1px solid rgba(196,168,130,.3); }

.opening-floral .letter { background: #fff; border: 1px solid rgba(196,168,130,.15); }

/* =====================================================
   TEMPLATE-SPECIFIC HERO COMPOSITIONS
===================================================== */

.hero-style-editorial .hero-content { text-align: left; padding-left: 8%; }
.hero-style-editorial .hero-eyebrow { letter-spacing: 10px; font-size: 10px; }

.hero-style-luxury .hero::before { background: linear-gradient(to bottom, rgba(0,0,0,.4), rgba(0,0,0,.7)); }
.hero-style-luxury .hero-names .name { color: var(--gold); text-shadow: 0 0 60px rgba(196,168,130,.3); font-style: normal; }
.hero-style-luxury .hero-amp { color: var(--gold); font-size: clamp(40px,6vw,72px); opacity: .5; }

.hero-style-minimal .hero::before { background: rgba(255,252,247,.7); }
.hero-style-minimal .hero-names .name { color: var(--fg-heading); text-shadow: none; font-style: normal; font-weight: 200; letter-spacing: -2px; }

.hero-style-vintage .hero-names .name { text-shadow: 0 2px 30px rgba(107,82,64,.2); }

.hero-style-dark .hero::before { background: radial-gradient(ellipse at 50% 40%, rgba(20,16,12,.40) 0%, transparent 60%), linear-gradient(to bottom, rgba(0,0,0,.30), rgba(0,0,0,.60)); }
.hero-style-dark .hero-names .name { color: var(--gold); text-shadow: 0 0 80px rgba(212,184,150,.2); }
.hero-style-dark .hero-amp { color: var(--gold); }

/* =====================================================
   TEMPLATE-SPECIFIC SECTION STYLES
===================================================== */

.section-style-editorial .section-divider::before,
.section-style-editorial .section-divider::after { width: 60px; height: 2px; background: var(--fg-heading); }
.section-style-editorial .section-eyebrow { letter-spacing: 8px; }
.section-style-editorial .section h2 { font-style: normal; font-weight: 200; letter-spacing: -1px; }

.section-style-luxury .section { position: relative; }
.section-style-luxury .section::before { content: ""; position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 1px; height: 60px; background: linear-gradient(to bottom, transparent, var(--gold)); }
.section-style-luxury .section-divider::before,
.section-style-luxury .section-divider::after { width: 30px; background: var(--gold); }
.section-style-luxury .section h2 { color: var(--gold); }
.section-style-luxury .section-eyebrow { color: var(--gold); }

.section-style-minimal .section-divider { display: none; }
.section-style-minimal .section h2 { font-style: normal; font-weight: 200; font-size: clamp(28px,4vw,42px); letter-spacing: -1px; }
.section-style-minimal .section-text { font-size: 15px; line-height: 1.8; }

.section-style-botanical .section-divider::before { background: linear-gradient(to right, transparent, #7A9A60); }
.section-style-botanical .section-divider::after { background: linear-gradient(to left, transparent, #7A9A60); }
.section-style-botanical .section-divider span { color: #7A9A60; }

/* =====================================================
   TEMPLATE-SPECIFIC DETAILS GRID
===================================================== */

.details-style-editorial .details-grid { grid-template-columns: 1fr; gap: 0; }
.details-style-editorial .detail { border-right: none; border-bottom: 1px solid var(--border-strong); padding: 32px 24px; display: flex; align-items: center; gap: 24px; }
.details-style-editorial .detail:last-child { border-bottom: none; }
.details-style-editorial .detail small { margin-bottom: 0; }
.details-style-editorial .detail strong { margin: 0 0 0 0; font-style: normal; font-weight: 200; }

.details-style-luxury .details-section { background: var(--fg-heading); color: var(--bg); border-color: rgba(196,168,130,.15); }
.details-style-luxury .details-grid { border-color: rgba(196,168,130,.2); }
.details-style-luxury .detail { border-color: rgba(196,168,130,.15); }
.details-style-luxury .detail small { color: var(--gold); }
.details-style-luxury .detail strong { color: var(--bg); }
.details-style-luxury .detail p { color: rgba(245,237,227,.5); }
.details-style-luxury .map-button { border-color: rgba(196,168,130,.3); color: var(--gold); }
.details-style-luxury .map-button::before { background: var(--gold); }

.details-style-minimal .details-grid { border: none; }
.details-style-minimal .detail { border: none; padding: 48px 20px; }
.details-style-minimal .detail:hover { background: none; }
.details-style-minimal .detail strong { font-style: normal; font-weight: 200; }

.details-style-botanical .detail:hover { background: rgba(122,154,96,.05); }
.details-style-botanical .detail small { color: #7A9A60; }

/* =====================================================
   TEMPLATE-SPECIFIC COUNTDOWN
===================================================== */

.countdown-style-editorial .timer div strong { font-style: normal; font-weight: 200; }
.countdown-style-editorial .timer div::after { background: var(--fg-heading); height: 2px; }

.countdown-style-luxury .timer { background: var(--fg-heading); border-radius: 2px; padding: 32px; }
.countdown-style-luxury .timer div strong { color: var(--gold); }
.countdown-style-luxury .timer div::after { background: rgba(196,168,130,.2); }
.countdown-style-luxury .countdown-section { background: var(--fg-heading); }

.countdown-style-minimal .timer div::after { display: none; }
.countdown-style-minimal .timer div strong { font-style: normal; font-weight: 200; font-size: 42px; }

/* =====================================================
   TEMPLATE-SPECIFIC FOOTER
===================================================== */

.footer-style-editorial footer strong { font-style: normal; font-weight: 200; letter-spacing: -2px; }

.footer-style-luxury footer { background: #0A0A0A; }
.footer-style-luxury footer strong { color: var(--gold); }

.footer-style-minimal footer strong { font-style: normal; font-weight: 200; font-size: clamp(36px,6vw,56px); }
.footer-style-minimal footer p { color: var(--fg-muted); }

.footer-style-botanical footer { background: #2A3522; }
.footer-style-botanical footer strong { color: #C8E0B0; }

.footer-style-dark footer { background: #0A0A0A; }
.footer-style-dark footer strong { color: var(--gold); }

/* =====================================================
   TEMPLATE-SPECIFIC STORY
===================================================== */

.story-style-editorial .story-quote { font-style: normal; font-weight: 300; line-height: 2.2; }
.story-style-editorial .story-quote::before { font-size: 120px; color: var(--fg-heading); opacity: .1; }

.story-style-luxury .story-quote { color: var(--gold); }
.story-style-luxury .story-quote::before { color: var(--gold); opacity: .2; }

/* =====================================================
   TEMPLATE-SPECIFIC RSVP
===================================================== */

.rsvp-style-editorial .rsvp-button { border-radius: 0; font-weight: 500; letter-spacing: 4px; }
.rsvp-style-editorial .rsvp-form input,
.rsvp-style-editorial .rsvp-form select { border-radius: 0; border-width: 2px; }

.rsvp-style-luxury .rsvp-button { background: var(--gold); color: #0A0A0A; border: none; }
.rsvp-style-luxury .rsvp-form input,
.rsvp-style-luxury .rsvp-form select { border-color: rgba(196,168,130,.2); background: rgba(196,168,130,.05); color: var(--bg); }

.rsvp-style-minimal .rsvp-button { border-radius: 100px; border: 1px solid var(--border-strong); background: transparent; }
.rsvp-style-minimal .rsvp-button:hover { background: var(--fg); color: var(--white); border-color: var(--fg); }

/* =====================================================
   CATEGORY-SPECIFIC TYPOGRAPHY & PALETTES
   Each category gets a distinct premium personality
===================================================== */

/* Wedding — romantic serif with cursive accents */
[data-category="wedding"],
[data-category="engagement"],
[data-category="anniversary"] {
    --name-font: "Playfair Display", serif;
    --amp-font: "Great Vibes", cursive;
    --label-font: "Montserrat", sans-serif;
}
[data-category="wedding"] .hero-names .name,
[data-category="engagement"] .hero-names .name,
[data-category="anniversary"] .hero-names .name { font-family: var(--name-font); font-style: normal; }
[data-category="wedding"] .hero-amp,
[data-category="engagement"] .hero-amp,
[data-category="anniversary"] .hero-amp { font-family: var(--amp-font); }

/* Birthday — playful, celebratory and bold */

/* =====================================================
   PREMIUM OPENING — cinematic entrance
===================================================== */

.opening::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
        var(--cover) center/cover no-repeat,
        radial-gradient(ellipse at 50% 30%, var(--accent-light), transparent 60%),
        radial-gradient(ellipse at 20% 80%, var(--accent-light), transparent 50%);
    opacity: 0.18;
    pointer-events: none;
}

.opening::after {
    content: "";
    position: absolute;
    width: min(460px, 70vw);
    height: min(460px, 70vw);
    border-radius: 50%;
    border: 1px solid var(--border);
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
    animation: openingRing 6s ease-in-out infinite;

@keyframes openingRing {

}

.opening .envelope-scene {

    opacity: .035;
}

<script>

/* =====================================================
   GET INVITATION ID
===================================================== */

var params =
    new URLSearchParams(
        window.location.search
    );

/* =====================================================
   TEMPLATE DEMO PREVIEW — ?template=<id>
   Renders the ACTUAL design (cover, opening animation,
   layout, gallery style, illustrations) with sample data.
   Nothing is written to stored invitations.
===================================================== */

(function lunaTemplatePreviewShim() {
    var tplId = (params.get("template") || "").trim();
    var pkgOverride = (params.get("package") || "").trim().toLowerCase();
    if (!tplId || params.get("id")) return;
    var tpl = null;
    if (typeof lunaGetAllTemplates === "function") {
        tpl = lunaGetAllTemplates().find(function(t) { return t.id === tplId; });
    } else if (typeof LUNA_TEMPLATES !== "undefined") {
        tpl = LUNA_TEMPLATES.find(function(t) { return t.id === tplId; });
    }
    if (!tpl) return;
    var pv = tpl.preview || {};
    var cat = (tpl.category || "wedding").toLowerCase();
    var brideName = (pv.names && pv.names[0]) || "Aysel";
    var groomName = (pv.names && pv.names[1]) || "Murad";
    var dateISO = "2026-09-12";
    var dateDisplay = pv.date || "12 · 09 · 2026";
    var venue = pv.venue || "Crystal Hall";
    var location = pv.location || "Bakı, Azərbaycan";
    var coverUrl = tpl.cover || "";
    var isCouple = (cat === "wedding" || cat === "engagement" || cat === "anniversary" || cat === "henna");
    var catPrefix = cat.charAt(0).toUpperCase() + cat.slice(1);
    var gallerySets = {
        wedding: [
            "https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&w=800&q=85",
            "https://images.unsplash.com/photo-1511285560929-80b456fea0bc?auto=format&fit=crop&w=800&q=85",
            "https://images.unsplash.com/photo-1606800052052-a08af7148866?auto=format&fit=crop&w=800&q=85",

            "https://images.unsplash.com/photo-1583939003579-730e3918a45a?auto=format&fit=crop&w=800&q=85",
            "https://images.unsplash.com/photo-1522673607200-164d1b6ce486?auto=format&fit=crop&w=800&q=85",
            "https://images.unsplash.com/photo-1519225421980-715cb0215aed?auto=format&fit=crop&w=800&q=85",
            "https://images.unsplash.com/photo-1520854221256-17451cc331bf?auto=format&fit=crop&w=800&q=85"
        ],
        engagement: [
            "https://images.unsplash.com/photo-1515934751635-c81c6bc9a2d8?auto=format&fit=crop&w=800&q=85",
            "https://images.unsplash.com/photo-1529634597503-139d3726fed5?auto=format&fit=crop&w=800&q=85",
            "https://images.unsplash.com/photo-1544078751-58fee2d8a03b?auto=format&fit=crop&w=800&q=85",
            "https://images.unsplash.com/photo-1460978812857-470ed1c77af0?auto=format&fit=crop&w=800&q=85",
            "https://images.unsplash.com/photo-1522673607200-164d1b6ce486?auto=format&fit=crop&w=800&q=85"
        ],
        birthday: [
            "https://images.unsplash.com/photo-1530103862676-de8c9debad1d?auto=format&fit=crop&w=800&q=85",
            "https://images.unsplash.com/photo-1558618666-fcd25c85f82e?auto=format&fit=crop&w=800&q=85",
            "https://images.unsplash.com/photo-1464349095431-e9a21285b5f3?auto=format&fit=crop&w=800&q=85",
            "https://images.unsplash.com/photo-1513151233558-d860c5398176?auto=format&fit=crop&w=800&q=85",
            "https://images.unsplash.com/photo-1496843916299-590492c751f4?auto=format&fit=crop&w=800&q=85"
        ],
        graduation: [
            "https://images.unsplash.com/photo-1523580846011-d3a5bc25702b?auto=format&fit=crop&w=800&q=85",
            "https://images.unsplash.com/photo-1627556704290-2b1f5853ff78?auto=format&fit=crop&w=800&q=85",
            "https://images.unsplash.com/photo-1562774053-701939374585?auto=format&fit=crop&w=800&q=85",
            "https://images.unsplash.com/photo-1416339442236-8ceb164046f8?auto=format&fit=crop&w=800&q=85"
        ],
        henna: [
            "https://images.unsplash.com/photo-1583939003579-730e3918a45a?auto=format&fit=crop&w=800&q=85",
            "https://images.unsplash.com/photo-1522673607200-164d1b6ce486?auto=format&fit=crop&w=800&q=85",
            "https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&w=800&q=85",
            "https://images.unsplash.com/photo-1511285560929-80b456fea0bc?auto=format&fit=crop&w=800&q=85"
        ],
        business: [
            "https://images.unsplash.com/photo-1540575467063-178a50c2df87?auto=format&fit=crop&w=800&q=85",
            "https://images.unsplash.com/photo-1505373877841-8d25f7d46678?auto=format&fit=crop&w=800&q=85",
            "https://images.unsplash.com/photo-1475721027785-f74eccf877e2?auto=format&fit=crop&w=800&q=85",
            "https://images.unsplash.com/photo-1559223607-a43c990c692c?auto=format&fit=crop&w=800&q=85"
        ],
        other: [
            "https://images.unsplash.com/photo-1492684223066-81342ee5ff30?auto=format&fit=crop&w=800&q=85",
            "https://images.unsplash.com/photo-1533174072545-7a4b6ad7a6c3?auto=format&fit=crop&w=800&q=85",
            "https://images.unsplash.com/photo-1496024840928-4c417adf211d?auto=format&fit=crop&w=800&q=85"
        ]
    };
    var baseGallery = gallerySets[cat] || gallerySets.wedding;
    var galleryImages = baseGallery.slice(0, 6);
    if (coverUrl && galleryImages.indexOf(coverUrl) === -1) {
        galleryImages.unshift(coverUrl);
        if (galleryImages.length > 6) galleryImages.pop();
    }
    var stories = {
        wedding: brideName + " və " + groomName + " sevgi ilə dolu bir yolculuğa çıxmağa qərar verdilər. İlk görüşlərindən bu yana keçən hər an, onların hekayəsini daha da gözəl etdi. Dostlarının və ailələrinin sevgisi ilə əhatə olunmuş bu gözəl gündə, " + venue + " məkanında birlikdə addımlayacaqlar. Siz də bu unudulmaz anda şahidlik etməyi arzulayırsınızsa, bizimlə birlikdə olun.",
        engagement: brideName + " və " + groomName + " nişan mərasimləri ilə yeni bir başlanğıca imza atırlar. Bu gözəl addımı, ən yaxın dostları və ailələri ilə birlikdə qeyd etmək istəyirlər. " + venue + " məkanında baş tutacaq bu xüsusi gecədə, sevginin və vədlərin şahidi olacaqsınız.",
        birthday: brideName + " sağ olmağın sevincini, sevdikləri ilə birlikdə qeyd etməyə dəvət edir. " + venue + " məkanında baş tutacaq bu şən gecədə, birlikdə əylənəcək, güləcək və xatirələr yaradacağıq. Gəlin bu gözəl günü birlikdə qeyd edək!",
        graduation: brideName + " uzun bir təhsil yolculuğunun sonuna çatmanın sevincini yaşayır. " + venue + " məkanında baş tutacaq bu mərasimdə, ən yaxın dostları və ailələri ilə birlikdə bu nailiyyəti qeyd etmək istəyir. Gəlin birlikdə bu uğuru qeyd edək!",
        henna: brideName + " " + (isCouple ? "və " + groomName + " ilə birlikdə " : "") + "xına gecəsində son subay gecəsini qeyd etməyə dəvət edir. " + venue + " məkanında baş tutacaq bu ənənəvi mərasimdə, rəqs, musiqi və əyləncə ilə dolu bir gecə sizi gözləyir.",
        business: brideName + " tərəfindən təşkil olunan bu " + catPrefix.toLowerCase() + " tədbirində iştirak etməyə dəvət edirik. " + venue + " məkanında baş tutacaq bu tədbirdə, sahənin ekspertləri ilə tanış olacaq və yeni imkanlar kəşf edəcəksiniz.",
        other: brideName + " sizi xüsusi bir tədbirə dəvət edir. " + venue + ", " + location + " məkanında baş tutacaq bu hadisə, unudulmaz anlar və gözəl xatirələr vəd edir."
    };
    var storyText = stories[cat] || stories.wedding;
    var chosenPkg = "luxury";
    window.__lunaTemplatePreview = true;
    window.lunaGetInvitationOverride = {
        id: "__preview__",
        package: chosenPkg,
        category: cat,
        design: tpl.id,
        templateId: tpl.id,
        style: tpl.style || "",
        bride: brideName,
        groom: groomName,
        date: dateISO,
        dateShort: dateDisplay,
        time: "19:00",
        venue: venue,
        location: location,
        message: pv.message || "",
        story: storyText,
        images: galleryImages,
        approved: true,
        createdAt: Date.now()
    };
})();

var invitationId = "";
var invitation = null;

/* Template demo mode takes priority — a stale luna_last_invitation
   saved from an earlier order must never shadow the ?template= preview */
if (window.lunaGetInvitationOverride) {

    invitation = window.lunaGetInvitationOverride;
    invitationId = invitation.id;

} else {

    invitationId =
        (
            params.get("id") ||
            localStorage.getItem("luna_last_invitation") ||
            ""
        ).toLowerCase().trim();

    invitation = invitationId
        ? lunaGetInvitation(invitationId)
        : null;

}


if (!invitation) {

    document.title = lunaT("invErrorTitle") + " | Luna";

    document.body.innerHTML =

        '<div class="not-found">' +

            '<div class="not-found-content">' +

                '<div class="not-found-icon">&#9825;</div>' +

                '<h1>' + lunaT("invErrorTitle") + '</h1>' +

                '<p>' + lunaT("invErrorText") + '</p>' +

                '<div class="not-found-brand">LUNA</div>' +

            '</div>' +

        '</div>';

    throw new Error(
        "Invitation not found: " +
        invitationId
    );
}


/* =====================================================
   APPROVAL GATE — ADMIN MUST APPROVE BEFORE CLIENT
   GAINS ACCESS (payment confirmation flow)
===================================================== */

var _isLunaOwner = false;
try { _isLunaOwner = !!localStorage.getItem("luna_form_config"); } catch (e) {}

if (invitation.approved === false && !_isLunaOwner) {

    document.title = "Luna";

    document.body.innerHTML =

        '<div class="not-found">' +

            '<div class="not-found-content">' +

                '<div class="not-found-icon">&#8987;</div>' +

                '<h1>Sifarişiniz qəbul olundu</h1>' +

                '<p>Dəvətnaməniz hazırlanır. Ödəniş təsdiqləndikdən sonra<br>link aktivləşəcək və sizinlə paylaşılacaq.</p>' +

                '<div class="not-found-brand">LUNA</div>' +

            '</div>' +

        '</div>';

    throw new Error(
        "Invitation pending approval: " +
        invitationId
    );
}


/* =====================================================
   INIT i18n LANGUAGE
===================================================== */

lunaInitLanguage();


/* =====================================================
   PAGE TITLE
===================================================== */

document.title = lunaDisplayNames(invitation) + " | Luna Invitation";


/* =====================================================
   DESIGN THEME + TEMPLATE-SPECIFIC STYLES
===================================================== */

// Check for client-specific design first
var clientDesignId = null;
try {
    var clientInvs = JSON.parse(localStorage.getItem('luna_client_invitations') || '[]');
    var clientInv = clientInvs.find(function(c) { return c.clientId === invitationId; });
    if (clientInv && clientInv.designId) clientDesignId = clientInv.designId;
} catch(e) {}

var finalDesign = clientDesignId || invitation.design || "";
if (finalDesign) {
    document.documentElement.setAttribute(
        "data-design",
        finalDesign.toLowerCase()
    );
}

/* Category-aware typography target */
(function() {
    var catVal = (invitation.category || "wedding").toLowerCase();
    document.documentElement.setAttribute("data-category", catVal);
})();

/* Apply template-specific visual identity based on style property */
(function() {
    var style = (invitation.style || "").toLowerCase();
    var design = (invitation.design || "").toLowerCase();
    var heroClass = "";
    var sectionClass = "";
    var detailsClass = "";
    var countdownClass = "";
    var footerClass = "";
    var storyClass = "";
    var rsvpClass = "";

    if (style.indexOf("editorial") !== -1 || design === "editorial-love") {
        heroClass = "hero-style-editorial";
        sectionClass = "section-style-editorial";
        detailsClass = "details-style-editorial";
        countdownClass = "countdown-style-editorial";
        footerClass = "footer-style-editorial";
        storyClass = "story-style-editorial";
        rsvpClass = "rsvp-style-editorial";
    } else if (style.indexOf("luxe") !== -1 || style.indexOf("luxury") !== -1 || style.indexOf("dark") !== -1 || design === "noir" || design === "black-gold" || design === "luxe-gold") {
        heroClass = "hero-style-luxury";
        sectionClass = "section-style-luxury";
        detailsClass = "details-style-luxury";
        countdownClass = "countdown-style-luxury";
        footerClass = "footer-style-luxury";
        storyClass = "story-style-luxury";
        rsvpClass = "rsvp-style-luxury";
    } else if (style.indexOf("minimal") !== -1 || style.indexOf("modern") !== -1 || design === "minimal-white" || design === "modern-classic") {
        heroClass = "hero-style-minimal";
        sectionClass = "section-style-minimal";
        detailsClass = "details-style-minimal";
        countdownClass = "countdown-style-minimal";
        footerClass = "footer-style-minimal";
    } else if (style.indexOf("botanical") !== -1 || style.indexOf("garden") !== -1 || style.indexOf("green") !== -1 || design === "botanical") {
        heroClass = "hero-style-botanical";
        sectionClass = "section-style-botanical";
        detailsClass = "details-style-botanical";
        footerClass = "footer-style-botanical";
    } else if (style.indexOf("vintage") !== -1 || design === "vintage-romance") {
        heroClass = "hero-style-vintage";
    } else if (style.indexOf("classic") !== -1 || style.indexOf("timeless") !== -1 || design === "classic") {
        /* classic gets elegant defaults — no extra classes needed */
    }

    /* Dark themes always get dark hero */
    if (heroClass === "" && (design === "noir" || design === "black-gold" || design === "luxe-gold" || design === "enchanted" || design === "luxury-birthday" || design === "oriental" || design === "luxury-grad")) {
        heroClass = "hero-style-dark";
        footerClass = "footer-style-dark";
    }

    var main = document.getElementById("invitation");

function updateCountdown() {

    var daysEl = document.getElementById("days");
    var hoursEl = document.getElementById("hours");
    var minutesEl = document.getElementById("minutes");
    var secondsEl = document.getElementById("seconds");

    /* Build target date explicitly — avoid parsing issues */
    var target = null;

    /* First try lunaCountdownTarget (handles countdown ISO field + date fallback) */
    var countdownStr = typeof lunaCountdownTarget === "function" ? lunaCountdownTarget(invitation) : null;
    if (countdownStr) {
        target = new Date(countdownStr);
    }

    /* Fallback: YYYY-MM-DD date format */
    if ((!target || isNaN(target.getTime())) && invitation.date && /^\d{4}-\d{2}-\d{2}$/.test(invitation.date)) {
        var parts = invitation.date.split("-");
        var timeParts = (invitation.time || "19:00").split(":");
        target = new Date(
            parseInt(parts[0], 10),
            parseInt(parts[1], 10) - 1,
            parseInt(parts[2], 10),
            parseInt(timeParts[0], 10) || 19,
            parseInt(timeParts[1], 10) || 0,
            0, 0
        );
    }

    if (!target || isNaN(target.getTime())) {
        daysEl.textContent = "00";
        hoursEl.textContent = "00";
        minutesEl.textContent = "00";
        secondsEl.textContent = "00";
        return;
    }

    var now = new Date();
    var difference = target.getTime() - now.getTime();

    if (difference <= 0) {
        daysEl.textContent = "00";
        hoursEl.textContent = "00";
        minutesEl.textContent = "00";
        secondsEl.textContent = "00";
        document.getElementById("countdownHeading").textContent = lunaT("invToday");
        return;
    }

    var days = Math.floor(difference / (1000 * 60 * 60 * 24));
    var hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    var minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
    var seconds = Math.floor((difference % (1000 * 60)) / 1000);

    daysEl.textContent = String(days).padStart(2, "0");
    hoursEl.textContent = String(hours).padStart(2, "0");
    minutesEl.textContent = String(minutes).padStart(2, "0");
    secondsEl.textContent = String(seconds).padStart(2, "0");
}

/* =====================================================
   MODERN RSVP — segmented status + guest stepper
   (native select stays synced for submit logic)
===================================================== */

(function rsvpModern() {

    var statusSel = document.getElementById("rsvpStatus");
    var segmented = document.getElementById("rsvpSegmented");

    /* Segmented control ↔ hidden select sync */
    if (statusSel && segmented) {

        var segBtns = segmented.querySelectorAll(".rsvp-seg");

        var syncSeg = function() {
            segBtns.forEach(function(b) {
                b.classList.toggle(
                    "active",
                    b.getAttribute("data-val") === statusSel.value
                );
                b.setAttribute(
                    "aria-checked",
                    b.getAttribute("data-val") === statusSel.value ? "true" : "false"
                );
            });
        };

        segBtns.forEach(function(btn) {
            /* Labels come from the already-translated <option> texts */
            var opt = document.getElementById(
                "rsvpOpt" + btn.getAttribute("data-val").charAt(0).toUpperCase() +
                btn.getAttribute("data-val").slice(1)
            );
            var label = btn.querySelector("span");
            if (opt && label) label.textContent = opt.textContent;

            btn.addEventListener("click", function() {
                statusSel.value = this.getAttribute("data-val");
                syncSeg();
            });
        });

        syncSeg();
    }

    /* Guest stepper */
    var guests = document.getElementById("rsvpGuests");
    var minus = document.getElementById("rsvpGuestMinus");
    var plus = document.getElementById("rsvpGuestPlus");

    if (guests && minus && plus) {

        var clampGuests = function() {
            var v = parseInt(guests.value, 10);
            if (isNaN(v) || v < 1) v = 1;
            if (v > 20) v = 20;
            guests.value = v;
        };

        minus.addEventListener("click", function() {
            guests.value = (parseInt(guests.value, 10) || 1) - 1;
            clampGuests();
        });

        plus.addEventListener("click", function() {
            guests.value = (parseInt(guests.value, 10) || 1) + 1;
            clampGuests();
        });

        guests.addEventListener("change", clampGuests);
    }

    /* Re-sync segmented labels if language changes at runtime */
    var _origRsvpSetLang = window.lunaSetLanguage;
    if (typeof _origRsvpSetLang === "function") {
        window.lunaSetLanguage = function(lang) {
            _origRsvpSetLang(lang);
            if (!segmented) return;
            segmented.querySelectorAll(".rsvp-seg").forEach(function(btn) {
                var opt = document.getElementById(
                    "rsvpOpt" + btn.getAttribute("data-val").charAt(0).toUpperCase() +
                    btn.getAttribute("data-val").slice(1)
                );
                var label = btn.querySelector("span");
                if (opt && label) label.textContent = opt.textContent;
            });
        };
    }

})();

/* =====================================================
   SCROLL REVEAL
===================================================== */

(function() {
    var reveals = document.querySelectorAll(
        ".reveal-up, .reveal-scale, .reveal-left, .reveal-right, .stagger-reveal"
    );

    if (!reveals.length) return;

    var observer = new IntersectionObserver(function(entries) {
        entries.forEach(function(entry) {
            if (entry.isIntersecting) {
                entry.target.classList.add("visible");
                observer.unobserve(entry.target);
            }
        });
    }, {
        threshold: 0.12,
        rootMargin: "0px 0px -30px 0px"
    });

    reveals.forEach(function(el) {
        observer.observe(el);
    });
})();


/* =====================================================
   PARALLAX HERO EFFECT
===================================================== */

(function() {
    var hero = document.getElementById("hero");
    var heroContent = document.getElementById("heroContent");
    if (!hero || !heroContent) return;

    var ticking = false;
    window.addEventListener("scroll", function() {
        if (!ticking) {
            requestAnimationFrame(function() {
                var scrollY = window.scrollY;
                var heroH = hero.offsetHeight;
                if (scrollY < heroH) {
                    var progress = scrollY / heroH;
                    heroContent.style.transform = "translateY(" + (scrollY * 0.3) + "px)";
                    heroContent.style.opacity = 1 - (progress * 1.2);
                }
                ticking = false;
            });
            ticking = true;
        }
    }, { passive: true });
})();


/* =====================================================
   SMOOTH SECTION TRANSITIONS
===================================================== */

(function() {
    var sections = document.querySelectorAll(".section");
    sections.forEach(function(section) {
        section.style.opacity = "0";
        section.style.transition = "opacity 1s ease";
    });

    var sectionObserver = new IntersectionObserver(function(entries) {
        entries.forEach(function(entry) {
            if (entry.isIntersecting) {
                entry.target.style.opacity = "1";
                sectionObserver.unobserve(entry.target);
            }
        });
    }, { threshold: 0.08 });

    sections.forEach(function(s) { sectionObserver.observe(s); });
})();

    if (_openInvitation._done) return;
    _openTriggers();

    openButton.textContent = lunaT("invOpening");
    openButton.disabled = true;

    var delay = window.__lunaOpenDelay || 1600;

    setTimeout(
        function() {
            opening.classList.add("hidden");
            invitationPage.classList.add("visible");
            window.scrollTo(0, 0);
            _openInvitation._done = true;

            /* Auto-play music if available */
            if (pkg === "luxury" && invitation.music) {
                musicPlayer.play().catch(function() {});
                musicButton.textContent = lunaT("invMusicMute");
            }
        },
        delay
    );
}

/* Trigger type-specific pre-reveal animations */
function _openTriggers() {
    document.documentElement.classList.add("scene-opened");
    try { envelope.classList.add("open"); } catch(e) {}
}

openButton.addEventListener("click", _openInvitation);

/* For non-envelope styles, allow tap anywhere on the opening screen */
if (_openingStyle !== "envelope") {
    opening.addEventListener("click", function(e) {
        if (e.target === openButton || openButton.contains(e.target)) return;
        if (e.target.closest && e.target.closest(".scene-open-btn")) return;
        _openInvitation();
    });
}


</script>
