/* =====================================================
   RESET
===================================================== */

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }

body {
    font-family: "Cormorant Garamond", Georgia, serif;
    font-weight: 300;
    color: var(--fg);
    background: var(--bg);
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
}

img { display: block; max-width: 100%; }
button { font-family: "DM Sans", sans-serif; cursor: pointer; }
a { text-decoration: none; color: inherit; }


/* =====================================================
   PAGE BACKGROUND
===================================================== */

.page-background {
    position: fixed;
    inset: 0;
    z-index: -10;
    background: var(--bg);
}

.page-background::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
        radial-gradient(ellipse at 20% 20%, var(--accent-light), transparent 50%),
        radial-gradient(ellipse at 80% 80%, var(--accent-light), transparent 50%);
}


/* =====================================================
   FLOATING LIGHTS
===================================================== */

.light {
    position: fixed;
    width: 500px;
    height: 500px;
    border-radius: 50%;
    filter: blur(150px);
    opacity: .08;
    pointer-events: none;
    z-index: -5;
    animation: floatingLight 25s ease-in-out infinite;
}

.light-one {
    top: -150px;
    left: -150px;
    background: var(--accent);
}

.light-two {
    right: -150px;
    bottom: 10%;
    background: var(--gold);
    animation-delay: -12s;
}

@keyframes floatingLight {
    0%,100% { transform: translate(0,0) scale(1); }
    33% { transform: translate(50px,-30px) scale(1.05); }
    66% { transform: translate(-30px,40px) scale(.95); }
}


/* =====================================================
   OPENING SCREEN TYPES
===================================================== */

.opening {
    position: fixed;
    inset: 0;
    z-index: 999;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: var(--bg);
    transition: opacity .8s cubic-bezier(.22,.9,.36,1), visibility .8s, filter .5s;
}

.opening.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    filter: blur(3px) brightness(1.2);
}

/* ==== Ambient Pinterest-style layers (apply to every opening scene) ==== */
.opening-light {
    position: absolute;
    inset: -12%;
    z-index: 0;
    pointer-events: none;
    background:
        radial-gradient(60% 45% at 30% 22%, rgba(255,214,182,.38), transparent 60%),
        radial-gradient(50% 40% at 72% 78%, rgba(214,196,236,.30), transparent 62%),
        radial-gradient(40% 50% at 50% 50%, rgba(255,240,225,.22), transparent 70%);
    mix-blend-mode: screen;
    animation: openingBreath 11s ease-in-out infinite;
    filter: blur(6px);
}
@keyframes openingBreath {
    0%, 100% { transform: scale(1) translateY(0); opacity: .7; }
    50%      { transform: scale(1.06) translateY(-8px); opacity: 1; }
}
.opening-petals {
    position: absolute;
    inset: 0;
    z-index: 1;
    overflow: hidden;
    pointer-events: none;
    mask-image: linear-gradient(to bottom, rgba(0,0,0,.9), rgba(0,0,0,0) 82%);
    -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,.9), rgba(0,0,0,0) 82%);
}
.opening-petals i {
    position: absolute;
    top: -8%;
    width: 13px;
    height: 9px;
    border-radius: 50% 0 50% 0;
    opacity: 0;
    animation: petalDrift 14s linear infinite;
}
.opening-petals i:nth-child(1) { left: 8%;  width: 11px; height: 8px; animation-duration: 16s; animation-delay: 0s;   transform: rotate(24deg);  background: linear-gradient(135deg, rgba(255,190,170,.75), rgba(235,150,150,.55)); }
.opening-petals i:nth-child(2) { left: 22%; width: 9px;  height: 7px; animation-duration: 13s; animation-delay: 2s;   transform: rotate(-18deg); background: linear-gradient(135deg, rgba(255,214,190,.8), rgba(245,170,165,.5)); }
.opening-petals i:nth-child(3) { left: 36%; width: 14px; height: 10px;animation-duration: 18s; animation-delay: 4s;   transform: rotate(32deg);  background: linear-gradient(135deg, rgba(225,200,245,.7), rgba(195,170,225,.5)); }

.opening-petals i:nth-child(5) { left: 64%; width: 13px; height: 9px; animation-duration: 17s; animation-delay: 5s;   transform: rotate(20deg);  background: linear-gradient(135deg, rgba(255,220,200,.78), rgba(250,180,160,.5)); }

.opening-petals i:nth-child(8) { left: 15%; width: 8px;  height: 6px; animation-duration: 12s; animation-delay: 7s;   transform: rotate(-30deg); background: linear-gradient(135deg, rgba(250,205,225,.7), rgba(230,170,200,.5)); }
.opening-petals i:nth-child(9) { left: 44%; width: 11px; height: 8px; animation-duration: 16s; animation-delay: 8s;   transform: rotate(16deg);  background: linear-gradient(135deg, rgba(214,235,250,.65), rgba(180,200,235,.5)); }
.opening-petals i:nth-child(10){ left: 68%; width: 9px;  height: 7px; animation-duration: 13s; animation-delay: 9s;   transform: rotate(-14deg); background: linear-gradient(135deg, rgba(255,200,180,.7), rgba(245,160,150,.5)); }
.opening-petals i:nth-child(11){ left: 30%; width: 12px; height: 8px; animation-duration: 18s; animation-delay: 10s;  transform: rotate(36deg);  background: linear-gradient(135deg, rgba(230,205,250,.7), rgba(200,175,235,.5)); }
.opening-petals i:nth-child(12){ left: 55%; width: 10px; height: 7px; animation-duration: 15s; animation-delay: 11s;  transform: rotate(-20deg); background: linear-gradient(135deg, rgba(255,185,170,.72), rgba(240,150,150,.5)); }
@keyframes petalDrift {
    0%   { top: -8%;  opacity: 0; transform: translateX(0) rotate(0deg); }
    8%   { opacity: .9; }
    50%  { opacity: .8; transform: translateX(26px) rotate(110deg); }
    92%  { opacity: .6; }
    100% { top: 108%; opacity: 0; transform: translateX(-18px) rotate(240deg); }
}
.opening.scene-opened .opening-petals,
.opening.scene-opened .opening-light { opacity: 0; transition: opacity 1.2s ease; }

/* Type: Fullscreen Photo opening */
[data-opening="fullscreen-photo"] .opening {
    background: var(--cover) center/cover no-repeat;
    justify-content: flex-end;
    padding-bottom: 100px;
}
[data-opening="fullscreen-photo"] .opening::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom, rgba(0,0,0,.15), rgba(0,0,0,.55));
    z-index: 0;
}
[data-opening="fullscreen-photo"] .envelope-scene { display: none; }
[data-opening="fullscreen-photo"] #openButton {
    position: relative;
    z-index: 2;
    margin-top: 0;
    border-color: rgba(255,255,255,.4);
    color: #fff;
}
[data-opening="fullscreen-photo"] #openButton::before { background: rgba(255,255,255,.15); }

/* Type: Editorial Card opening */
[data-opening="editorial-card"] .opening {
    background: linear-gradient(135deg, #1a1410, #2a1f16);
}
[data-opening="editorial-card"] .envelope-scene { background: none; }
[data-opening="editorial-card"] .envelope-body { background: transparent; border: 2px solid rgba(196,168,130,.2); }
[data-opening="editorial-card"] .letter { background: rgba(26,20,16,.9); color: #f5ede3; }
[data-opening="editorial-card"] .seal { background: linear-gradient(135deg, #c4a882, #d4b892); }

/* Type: Minimal Typographic opening */
[data-opening="minimal"] .opening {
    background: var(--bg, #FDFCFA);
}
[data-opening="minimal"] .envelope { border: none; box-shadow: none; }
[data-opening="minimal"] .envelope-body { background: transparent; border: none; }
[data-opening="minimal"] .envelope-body::before { display: none; }
[data-opening="minimal"] .envelope-body::after { border: none; }
[data-opening="minimal"] .envelope-scene { background: none; }
[data-opening="minimal"] .letter { border: 1px solid var(--border); background: var(--white); }
[data-opening="minimal"] .seal { background: var(--fg-heading); width: 36px; height: 36px; }
[data-opening="minimal"] .flap { background: var(--bg-alt); }

/* Type: Door Opening */
[data-opening="door"] .opening {
    background: var(--bg);
    overflow: hidden;
}
[data-opening="door"] .envelope-scene { display: none; }

/* Light beam from behind door */
[data-opening="door"] .door-scene::before {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 50% 50%, rgba(255,248,230,.3), transparent 50%);
    z-index: 0;
    pointer-events: none;
    opacity: 0;
    transition: opacity 1.2s ease .3s;
}
.scene-opened[data-opening="door"]:not(.revealed) .door-scene::before { opacity: 1; }

[data-opening="door"] .door-scene {
    position: relative;
    width: min(520px, 85vw);
    height: min(680px, 80vh);
    perspective: 1600px;
    display: flex;
    align-items: center;
    justify-content: center;
}
[data-opening="door"] .door-left,
[data-opening="door"] .door-right {
    position: absolute;
    top: 0;
    width: 50%;
    height: 100%;
    /* Real castle door: wood grain + plank seams */
    background:
        repeating-linear-gradient(90deg, rgba(0,0,0,0), rgba(0,0,0,0) calc(100% - 2px), rgba(30,16,10,.35) calc(100% - 2px), rgba(30,16,10,.35) 100%),
        radial-gradient(ellipse at 30% 20%, rgba(255,255,255,.14), transparent 45%),
        var(--bg-alt);
    background-size: 9% 100%, 130% 130%, auto;
    border: none;
    transition: transform 2.4s cubic-bezier(.16,.8,.28,1), filter .9s, box-shadow .9s;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: visible;
    box-shadow: 0 0 60px rgba(0,0,0,.3);
    transform-style: preserve-3d;
    -webkit-mask-image: none;
}
[data-opening="door"] .door-left { left: 0; transform-origin: left center; border-right: none; }
[data-opening="door"] .door-right { right: 0; transform-origin: right center; border-left: none; }
[data-opening="door"] .door-left::before,
[data-opening="door"] .door-right::before {
    content: "";
    position: absolute;
    inset: 14px;
    border: 2px solid rgba(70,38,20,.55);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.08), 0 0 24px rgba(0,0,0,.25);
    /* panel bevel */
    border-radius: 6px;
    background: linear-gradient(135deg, rgba(255,255,255,.06), transparent 40%);
}
/* Visible door thickness while swinging */
[data-opening="door"] .door-left::after,
[data-opening="door"] .door-right::after {
    content: "";
    position: absolute;
    width: 14px;
    top: 0;
    bottom: 0;
    background: linear-gradient(90deg, rgba(0,0,0,.55), rgba(0,0,0,.15));
    box-shadow: inset 0 0 12px rgba(0,0,0,.5);
}
[data-opening="door"] .door-left::after { right: 0; border-radius: 0 4px 4px 0; }
[data-opening="door"] .door-right::after { left: 0; border-radius: 4px 0 0 4px; }
/* Metal hinges per door */
[data-opening="door"] .door-left .door-hinge,
[data-opening="door"] .door-right .door-hinge { display: block; }
[data-opening="door"] .door-left .door-hinge {
    position: absolute; left: -8px; width: 20px; height: 46px;
    background: linear-gradient(180deg, #7a6a55, #4a3c2e);
    border-radius: 4px; box-shadow: 0 2px 6px rgba(0,0,0,.5);
}
[data-opening="door"] .door-left .door-hinge.th { top: 12%; }
[data-opening="door"] .door-left .door-hinge.bh { bottom: 12%; }
[data-opening="door"] .door-right .door-hinge {
    position: absolute; right: -8px; width: 20px; height: 46px;
    background: linear-gradient(180deg, #7a6a55, #4a3c2e);
    border-radius: 4px; box-shadow: 0 2px 6px rgba(0,0,0,.5);
}
[data-opening="door"] .door-right .door-hinge.th { top: 12%; }
[data-opening="door"] .door-right .door-hinge.bh { bottom: 12%; }
/* Metal ring handles */
[data-opening="door"] .door-handle {
    position: absolute; top: 52%; width: 12px; height: 12px;
    border: 3px solid var(--accent); border-radius: 50%;
    box-shadow: 0 3px 8px rgba(0,0,0,.5), inset 0 0 4px rgba(255,255,255,.3);
    background: radial-gradient(circle at 35% 30%, #d9c9a8, #8a6a3f);
}
[data-opening="door"] .door-left .door-handle { right: 18%; }
[data-opening="door"] .door-right .door-handle { left: 18%; }
[data-opening="door"] .door-knock {
    position: absolute;
    right: 22%;
    top: 52%;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 3px solid var(--accent);
    z-index: 3;
    animation: knockSwing 1.2s ease-in-out 0s 2 both;
}
@keyframes knockSwing {
    0%,100% { transform: rotate(0); }
    25% { transform: rotate(20deg); }
    50% { transform: rotate(-15deg); }
    75% { transform: rotate(10deg); }
}
.scene-opened[data-opening="door"] .door-left { transform: perspective(1300px) rotateY(-118deg) translateZ(-8px); filter: brightness(.45); box-shadow: inset 30px 0 80px rgba(0,0,0,.5), -30px 0 60px rgba(0,0,0,.35); transition: transform 2.4s cubic-bezier(.16,.8,.28,1), filter 1s, box-shadow 1s; }
.scene-opened[data-opening="door"] .door-right { transform: perspective(1300px) rotateY(118deg) translateZ(-8px); filter: brightness(.45); box-shadow: inset -30px 0 80px rgba(0,0,0,.5), 30px 0 60px rgba(0,0,0,.35); transition: transform 2.4s cubic-bezier(.16,.8,.28,1), filter 1s, box-shadow 1s; }
[data-opening="door"] .door-invitation {
    position: absolute;
    inset: 8%;
    z-index: 1;
    background: var(--white);
    border: 1px solid var(--border-strong);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    opacity: 0;
    transform: scale(.9);
    transition: opacity .8s .6s ease, transform .8s .6s cubic-bezier(.19,1,.22,1);
}
.scene-opened[data-opening="door"] .door-invitation { opacity: 1; transform: scale(1); transition: opacity .9s 1.4s ease, transform .9s 1.4s cubic-bezier(.19,1,.22,1); }
[data-opening="door"] .door-invitation::before {
    content: "";
    position: absolute;
    inset: 10px;
    border: 1px solid var(--border);
}
[data-opening="door"] .door-invitation-content {
    position: relative;
    z-index: 2;
    padding: 30px;
}
[data-opening="door"] .door-invitation-content small {
    font-family: "DM Sans", sans-serif;
    font-size: 8px;
    font-weight: 500;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: var(--accent);
}
[data-opening="door"] .door-invitation-content h1 {
    font-family: "Cormorant Garamond", serif;
    font-size: clamp(42px,7vw,68px);
    font-weight: 300;
    font-style: italic;
    line-height: 1.1;
    color: var(--fg-heading);
    margin: 18px 0 14px;
}
[data-opening="door"] .door-invitation-content p {
    font-family: "DM Sans", sans-serif;
    font-size: 10px;
    font-weight: 400;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--fg-muted);
}
[data-opening="door"] #openButton {
    position: relative;
    z-index: 3;
    margin-top: 0;
}

/* Type: Stairs Climbing */
[data-opening="stairs"] .opening {
    perspective: 1400px;

    background: var(--bg);
    overflow: hidden;
}
[data-opening="stairs"] .envelope-scene { display: none; }
[data-opening="stairs"] .stairs-scene {
    position: relative;
    width: min(520px, 85vw);
    height: min(600px, 75vh);
    perspective: 1200px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    overflow: hidden;
}

/* =====================================================
   TYPE: TYPEWRITER (vintage editorial)
===================================================== */

[data-opening="typewriter"] .envelope-scene { display: none; }
[data-opening="typewriter"] .opening {
    background:
        radial-gradient(ellipse at 50% 50%, rgba(212,184,150,.08), transparent 60%),
        linear-gradient(170deg, #F8F4EE, #EFE8DC);
    overflow: hidden;
    font-family: "Cormorant Garamond", serif;
}

.typewriter-scene {
    position: relative;
    width: min(680px, 90vw);
    max-height: 80vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px;
}

.typewriter-paper {
    position: relative;
    width: 100%;
    max-width: 600px;
    background:
        repeating-linear-gradient(
            transparent,
            transparent 28px,
            rgba(196,168,130,.08) 28px,
            rgba(196,168,130,.08) 29px
        ),
        #FFFDF6;
    border: 1px solid rgba(196,168,130,.2);
    box-shadow:
        0 20px 60px rgba(62,37,24,.12),
        inset 0 0 60px rgba(196,168,130,.03);
    padding: 60px 50px;
    border-radius: 4px;
}

.typewriter-paper::before {
    content: "";
    position: absolute;
    top: 30px;
    left: 50px;
    right: 50px;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(196,168,130,.3), transparent);
}

.typewriter-paper::after {
    content: "";
    position: absolute;
    bottom: 30px;
    left: 50px;
    right: 50px;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(196,168,130,.3), transparent);
}

.typewriter-content {
    position: relative;
    z-index: 2;
    text-align: center;
    color: var(--fg-heading);
}

.typewriter-content small {
    font-family: "DM Sans", sans-serif;
    font-size: 8px;
    font-weight: 500;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: var(--accent);
    display: block;
    margin-bottom: 24px;
}

.typewriter-text {
    font-family: "Cormorant Garamond", serif;
    font-size: clamp(28px, 4.5vw, 42px);
    font-weight: 300;
    font-style: italic;
    line-height: 1.5;
    color: var(--fg-heading);
    white-space: pre-wrap;
    word-break: keep-all;
    overflow: hidden;
    border-right: 2px solid var(--accent);
    animation:
        typing 3.5s steps(60, end) forwards,
        blink-caret .75s step-end infinite;
}

@keyframes typing {
    from { width: 0; }
    to { width: 100%; }
}

@keyframes blink-caret {
    from, to { border-color: transparent; }
    50% { border-color: var(--accent); }
}

.typewriter-carriage {
    position: absolute;
    top: -12px;
    right: -12px;
    width: 48px;
    height: 48px;
    background: linear-gradient(135deg, #3E2518, #5C3D2E);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 20px rgba(62,37,24,.4);
    z-index: 10;
}

.typewriter-carriage::before {
    content: "";
    width: 18px;
    height: 3px;
    background: linear-gradient(90deg, #C4A882, #D4B892);
    border-radius: 2px;
    animation: carriageMove 1.2s ease-in-out infinite;
}

@keyframes carriageMove {
    0%, 100% { transform: translateX(-4px); }
    50% { transform: translateX(4px); }
}

.typewriter-keys {
    position: absolute;
    bottom: -50px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 4px;
    padding: 12px 20px;
    background: rgba(62,37,24,.9);
    border-radius: 8px;
    box-shadow: 0 8px 30px rgba(62,37,24,.3);
}

.typewriter-key {
    width: 28px;
    height: 28px;
    background: linear-gradient(135deg, #FFFDF6, #F0E8DC);
    border: 1px solid rgba(196,168,130,.3);
    border-radius: 4px;
    font-family: "DM Sans", sans-serif;
    font-size: 7px;
    font-weight: 500;
    color: var(--fg-heading);
    display: flex;
    align-items: center;
    justify-content: center;
    animation: keyPress 2s ease-in-out infinite;
}

.typewriter-key:nth-child(odd) { animation-delay: 0.1s; }
.typewriter-key:nth-child(even) { animation-delay: 0.2s; }

@keyframes keyPress {
    0%, 100% { transform: translateY(0); box-shadow: inset 0 2px 4px rgba(0,0,0,.1); }
    50% { transform: translateY(-3px); box-shadow: inset 0 4px 8px rgba(0,0,0,.2); }
}

.scene-opened[data-opening="typewriter"] .typewriter-text {
    animation: typing 4s steps(80, end) .5s forwards, blink-caret .75s step-end infinite;
}

.scene-opened[data-opening="typewriter"] .typewriter-key {
    animation: keyPress 1.5s ease-in-out infinite;
}

/* =====================================================
   TYPE: CANDLELIGHT (dark intimate)
===================================================== */

[data-opening="candlelight"] .envelope-scene { display: none; }
[data-opening="candlelight"] .opening {
    background:
        radial-gradient(ellipse at 50% 70%, rgba(212,175,55,.12), transparent 55%),
        radial-gradient(ellipse at 50% 30%, rgba(255,120,60,.08), transparent 45%),
        linear-gradient(180deg, #0D0806 0%, #1A1008 50%, #0D0806 100%);
    overflow: hidden;
}

.candlelight-scene {
    position: relative;
    width: min(520px, 88vw);
    height: min(700px, 80vh);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    perspective: 800px;
}

.candle-holder {
    position: relative;
    width: 80px;
    height: 120px;
    margin-bottom: 30px;
    z-index: 5;
}

.candle-body {
    width: 56px;
    height: 100px;
    margin: 0 auto;
    background: linear-gradient(180deg, #FFF8F0 0%, #F5E8D8 50%, #E8D4B8 100%);
    border-radius: 2px;
    border: 1px solid rgba(212,175,55,.3);
    box-shadow:
        inset 0 2px 8px rgba(255,255,255,.3),
        inset 0 -2px 8px rgba(0,0,0,.1),
        0 0 60px rgba(212,175,55,.15);
    position: relative;
    overflow: hidden;
    animation: candleMelt 8s ease-in-out infinite;
}

@keyframes candleMelt {
    0%, 100% { border-radius: 2px 2px 50% 50% / 2px 2px 20px 20px; }
    50% { border-radius: 2px 2px 40% 40% / 2px 2px 25px 25px; }
}

.candle-wick {
    position: absolute;
    top: -8px;
    left: 50%;
    transform: translateX(-50%);
    width: 4px;
    height: 14px;
    background: linear-gradient(180deg, #3E2518, #1A1008);
    border-radius: 2px;
    z-index: 10;
}

.candle-flame {
    position: absolute;
    top: -28px;
    left: 50%;
    transform: translateX(-50%);
    width: 18px;
    height: 36px;
    border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
    background:
        radial-gradient(ellipse at 50% 20%, #FFF8E0 0%, #FFD060 40%, #FF8C00 70%, #D43000 100%);
    filter: blur(1px);
    z-index: 9;
    animation:
        flameFlicker .08s ease-in-out infinite,
        flameFloat 3s ease-in-out infinite;
    transform-origin: bottom center;
}

@keyframes flameFlicker {
    0% { transform: translateX(-50%) scale(1, 1) rotate(-1deg); opacity: .95; }
    25% { transform: translateX(-50%) scale(1.05, .95) rotate(1deg); opacity: 1; }
    50% { transform: translateX(-50%) scale(.95, 1.08) rotate(-.5deg); opacity: .9; }
    75% { transform: translateX(-50%) scale(1.02, 1.02) rotate(.5deg); opacity: 1; }
    100% { transform: translateX(-50%) scale(1, 1) rotate(-1deg); opacity: .95; }
}

@keyframes flameFloat {
    0%, 100% { transform: translateX(-50%) translateY(0) scale(1); }
    50% { transform: translateX(-50%) translateY(-4px) scale(1.05); }
}

.candle-glow {
    position: absolute;
    top: -10px;
    left: 50%;
    transform: translateX(-50%);
    width: 120px;
    height: 120px;
    border-radius: 50%;
    background: radial-gradient(circle at center, rgba(212,175,55,.35), transparent 70%);
    filter: blur(20px);
    z-index: 1;
    animation: glowPulse 3s ease-in-out infinite;
}

@keyframes glowPulse {
    0%, 100% { opacity: .6; transform: translateX(-50%) scale(1); }
    50% { opacity: 1; transform: translateX(-50%) scale(1.2); }
}

.candle-wax-drip {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    width: 8px;
    height: 16px;
    background: linear-gradient(180deg, #FFF8F0, #F5E8D8);
    border-radius: 0 0 8px 8px;
    opacity: 0;
    animation: waxDrip 4s ease-in-out infinite;
}

.candle-wax-drip:nth-child(1) { top: 30px; animation-delay: 0s; }
.candle-wax-drip:nth-child(2) { top: 50px; animation-delay: 1.5s; }
.candle-wax-drip:nth-child(3) { top: 70px; animation-delay: 3s; }

@keyframes waxDrip {
    0% { opacity: 0; transform: translateX(-50%) translateY(-10px) scaleY(.5); }
    20% { opacity: 1; transform: translateX(-50%) translateY(0) scaleY(1); }
    80% { opacity: 1; transform: translateX(-50%) translateY(0) scaleY(1); }
    100% { opacity: 0; transform: translateX(-50%) translateY(20px) scaleY(.3); }
}

.candlelight-scene .sig-card {
    position: relative;
    z-index: 3;
    background: rgba(20,15,10,.85);
    border: 1px solid rgba(212,175,55,.25);
    backdrop-filter: blur(4px);
    box-shadow:
        0 0 80px rgba(212,175,55,.08),
        0 30px 80px rgba(0,0,0,.5);
}

.candlelight-scene .sig-card h1 { color: #FFF8E0; text-shadow: 0 0 30px rgba(212,175,55,.3); }
.candlelight-scene .sig-card small { color: rgba(212,175,55,.6); }
.candlelight-scene .open-button { border-color: rgba(212,175,55,.5); color: #D4AF37; }

.floating-ember {
    position: absolute;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #FFF8E0, #FF8C00 60%, transparent);
    pointer-events: none;
    opacity: 0;
    animation: emberRise 6s ease-in-out infinite;
}

@keyframes emberRise {
    0% { opacity: 0; transform: translateY(0) scale(0); }
    10% { opacity: .8; transform: translateY(-20vh) scale(1); }
    90% { opacity: .4; transform: translateY(-100vh) scale(.5); }
    100% { opacity: 0; transform: translateY(-120vh) scale(0); }
}

/* =====================================================
   TYPE: WINTER DRIFT (elegant winter)
===================================================== */

[data-opening="winter-drift"] .envelope-scene { display: none; }
[data-opening="winter-drift"] .opening {
    background:
        radial-gradient(ellipse at 20% 20%, rgba(180,200,220,.12), transparent 50%),
        radial-gradient(ellipse at 80% 80%, rgba(200,210,230,.08), transparent 50%),
        linear-gradient(160deg, #F0F4F8 0%, #E8EFF5 50%, #DCE8F0 100%);
    overflow: hidden;
}

.winter-scene {
    position: relative;
    width: min(520px, 88vw);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

.frost-pattern {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 1;
    background-image:
        radial-gradient(2px 2px at 20% 30%, rgba(255,255,255,.6), transparent),
        radial-gradient(1px 1px at 40% 70%, rgba(255,255,255,.4), transparent),
        radial-gradient(1.5px 1.5px at 60% 40%, rgba(255,255,255,.5), transparent),
        radial-gradient(1px 1px at 80% 20%, rgba(255,255,255,.3), transparent);
    background-size: 200px 200px;
    animation: frostShimmer 8s ease-in-out infinite;
    opacity: .6;
}

@keyframes frostShimmer {
    0%, 100% { opacity: .4; filter: brightness(1); }
    50% { opacity: .8; filter: brightness(1.3); }
}

.snowflake {
    position: fixed;
    top: -10vh;
    pointer-events: none;
    z-index: 2;
    color: rgba(255,255,255,.9);
    font-size: 12px;
    animation: snowFall linear infinite;
    text-shadow: 0 0 8px rgba(180,200,220,.8);
}

@keyframes snowFall {
    0% { transform: translateY(-10vh) rotate(0deg) scale(1); opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: .7; }
    100% { transform: translateY(110vh) rotate(720deg) scale(.5); opacity: 0; }
}

.ice-card {
    position: relative;
    z-index: 5;
    background:
        linear-gradient(135deg,
            rgba(255,255,255,.25) 0%,
            rgba(255,255,255,.1) 50%,
            rgba(255,255,255,.05) 100%),
        rgba(240,244,248,.9);
    border: 1px solid rgba(180,200,220,.5);
    border-radius: 8px;
    backdrop-filter: blur(10px);
    box-shadow:
        0 0 60px rgba(180,200,220,.15),
        0 20px 60px rgba(180,200,220,.08),
        inset 0 1px 0 rgba(255,255,255,.4);
}

.ice-card::before {
    content: "";
    position: absolute;
    inset: 2px;
    border: 1px solid rgba(255,255,255,.15);
    border-radius: 6px;
    pointer-events: none;
}

.winter-scene .sig-card {
    background: inherit;
    border: inherit;
    box-shadow: inherit;
    backdrop-filter: inherit;
}

.winter-scene .sig-card h1 { color: #1A2A3A; }
.winter-scene .sig-card small { color: #7A9AA8; }
.winter-scene .open-button {
    border-color: rgba(180,200,220,.5);
    color: #5A8AA8;
    background: rgba(255,255,255,.1);
}
.winter-scene .open-button::before { background: #5A8AA8; }
.winter-scene .open-button:hover { color: #fff; }

.ice-crystal {
    position: absolute;
    pointer-events: none;
    z-index: 3;
    opacity: .7;
    animation: crystalFloat 10s ease-in-out infinite;
}

.ice-crystal:nth-child(1) { top: 10%; left: 5%; width: 40px; height: 40px; animation-delay: 0s; }
.ice-crystal:nth-child(2) { top: 15%; right: 5%; width: 30px; height: 30px; animation-delay: -2s; }
.ice-crystal:nth-child(3) { bottom: 10%; left: 8%; width: 35px; height: 35px; animation-delay: -4s; }
.ice-crystal:nth-child(4) { bottom: 15%; right: 8%; width: 25px; height: 25px; animation-delay: -6s; }

@keyframes crystalFloat {
    0%, 100% { transform: translateY(0) rotate(0deg); opacity: .5; }
    50% { transform: translateY(-15px) rotate(180deg); opacity: .9; }
}

/* =====================================================
   TYPE: ROYAL SCROLL (regal parchment)
===================================================== */

[data-opening="royal-scroll"] .envelope-scene { display: none; }
[data-opening="royal-scroll"] .opening {
    perspective: 1100px;

    background:
        radial-gradient(ellipse at 50% 50%, rgba(212,184,150,.15), transparent 60%),
        linear-gradient(150deg, #2D2014 0%, #1A1208 50%, #2D2014 100%);
    overflow: hidden;
    perspective: 1000px;
}

.royal-scroll-scene {
    position: relative;
    width: min(580px, 88vw);
    height: min(650px, 75vh);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

.scroll-roll {
    position: relative;
    width: 100%;
    max-width: 480px;
    aspect-ratio: 3/4;
    transform-style: preserve-3d;
    transition: transform 1.8s cubic-bezier(.19,1,.22,1);
}

.scroll-paper {
    position: absolute;
    inset: 0;
    background:
        repeating-linear-gradient(
            180deg,
            rgba(196,168,130,.04) 0,
            rgba(196,168,130,.04) 20px,
            transparent 20px,
            transparent 40px
        ),
        linear-gradient(180deg, #F5E8D0 0%, #E8D8B8 40%, #D4C4A0 70%, #C8B898 100%);
    border: 2px solid rgba(196,168,130,.4);
    border-radius: 4px;
    box-shadow:
        0 30px 80px rgba(0,0,0,.4),
        inset 0 0 60px rgba(196,168,130,.1),
        inset 0 2px 0 rgba(255,255,255,.15);
    transform-origin: center center;
    transform: rotateX(-15deg) scale(.85);
    opacity: 0;
    transition: transform 1.5s cubic-bezier(.19,1,.22,1), opacity 1.2s ease;
}

.scene-opened[data-opening="royal-scroll"] .scroll-paper {
    transform: rotateX(0deg) scale(1);
    opacity: 1;
}

.scroll-rod {
    position: absolute;
    top: -12px;
    left: 50%;
    transform: translateX(-50%);
    width: calc(100% + 40px);
    height: 24px;
    background:
        linear-gradient(180deg, #B88A5A 0%, #D4A86A 30%, #E8C47A 50%, #D4A86A 70%, #B88A5A 100%);
    border-radius: 12px;
    box-shadow:
        0 4px 20px rgba(184,138,90,.5),
        inset 0 -2px 8px rgba(0,0,0,.3);
    z-index: 5;
}

.scroll-rod::before,
.scroll-rod::after {
    content: "";
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 20px;
    height: 20px;
    background:
        radial-gradient(circle at 30% 30%, #E8C47A, #B88A5A 70%);
    border-radius: 50%;
    box-shadow:
        inset -2px -2px 6px rgba(0,0,0,.4),
        inset 2px 2px 4px rgba(255,255,255,.3);
}

.scroll-rod::before { left: 12px; }
.scroll-rod::after { right: 12px; }

.scroll-rod-bottom {
    top: auto;
    bottom: -12px;
    z-index: 5;
}

.scroll-ribbon {
    position: absolute;
    top: 50%;
    left: -20px;
    transform: translateY(-50%) rotate(-90deg);
    width: 32px;
    height: 140px;
    background: linear-gradient(180deg, #8B2D2D, #B04A3A, #8B2D2D);
    border-radius: 4px;
    z-index: 3;
    box-shadow:
        0 4px 20px rgba(139,45,45,.5),
        inset 0 2px 8px rgba(255,255,255,.15);
}

.scroll-ribbon::before {
    content: "";
    position: absolute;
    bottom: -16px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 16px solid transparent;
    border-right: 16px solid transparent;
    border-top: 16px solid #8B2D2D;
}

.scroll-ribbon::after {
    content: "";
    position: absolute;
    top: -16px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 16px solid transparent;
    border-right: 16px solid transparent;
    border-bottom: 16px solid #8B2D2D;
}

.scroll-seal {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) rotate(-5deg);
    width: 72px;
    height: 72px;
    border-radius: 50%;
    background:
        radial-gradient(circle at 35% 35%, rgba(255,255,255,.3), transparent 45%),
        radial-gradient(circle at 65% 65%, rgba(0,0,0,.25), transparent 50%),
        radial-gradient(circle at 50% 50%, #8B2D2D, #5A1A1A 75%);
    box-shadow:
        inset 0 -4px 12px rgba(90,26,26,.6),
        inset 0 4px 8px rgba(255,200,150,.2),
        0 8px 24px rgba(139,45,45,.5);
    z-index: 6;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Cormorant Garamond", serif;
    font-size: 28px;
    font-weight: 400;
    font-style: italic;
    color: #F5E8D0;
    cursor: pointer;
    transition: transform .4s ease;
}

.scroll-seal:hover { transform: translate(-50%, -50%) rotate(-5deg) scale(1.1); }

.scene-opened[data-opening="royal-scroll"] .scroll-seal {
    animation: sealBreak .8s cubic-bezier(.5,0,.75,.4) forwards;
    pointer-events: none;
}

@keyframes sealBreak {
    0% { transform: translate(-50%, -50%) rotate(-5deg) scale(1); opacity: 1; }
    20% { transform: translate(-50%, -50%) rotate(-5deg) scale(1.15); }
    40% { transform: translate(-50%, -50%) rotate(-5deg) scale(.85); }
    100% { transform: translate(-50%, -50%) rotate(-25deg) scale(1.8); opacity: 0; filter: blur(3px); }
}

.royal-scroll-scene .sig-card {
    position: relative;
    z-index: 10;
    background:
        linear-gradient(170deg, #FFFDF8 0%, #F6EDDD 100%);
    border: 2px solid rgba(196,168,130,.5);
    box-shadow:
        0 0 60px rgba(212,175,55,.12),
        0 30px 80px rgba(0,0,0,.3);
}

.royal-scroll-scene .sig-card h1 { color: #2D2014; }
.royal-scroll-scene .sig-card small { color: #8A755A; }
.royal-scroll-scene .open-button { border-color: rgba(212,175,55,.6); color: #D4AF37; }
.royal-scroll-scene .open-button::before { background: #D4AF37; }

.gold-ornament {
    position: absolute;
    z-index: 2;
    color: rgba(212,175,55,.4);
    font-size: 32px;
    pointer-events: none;
    animation: ornamentSway 8s ease-in-out infinite;
}

.gold-ornament.top-left { top: 8%; left: 5%; transform: rotate(-15deg); animation-delay: 0s; }
.gold-ornament.top-right { top: 8%; right: 5%; transform: rotate(15deg); animation-delay: -2s; }
.gold-ornament.bottom-left { bottom: 8%; left: 5%; transform: rotate(15deg); animation-delay: -4s; }
.gold-ornament.bottom-right { bottom: 8%; right: 5%; transform: rotate(-15deg); animation-delay: -6s; }

@keyframes ornamentSway {
    0%, 100% { transform: rotate(var(--r, -15deg)) scale(1); opacity: .3; }
    50% { transform: rotate(calc(var(--r, -15deg) + 8deg)) scale(1.1); opacity: .6; }
}
[data-opening="stairs"] .stairs-steps {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 80%;
    display: flex;
    flex-direction: column-reverse;
    gap: 0;
}
[data-opening="stairs"] .stairs-step {
    height: 64px;
    background: linear-gradient(180deg, var(--bg-alt), rgba(0,0,0,.06));
    border: 1px solid var(--border);
    border-bottom: 2px solid var(--border-strong);
    opacity: 0;
    transform: translateY(50px) rotateX(8deg);
    animation: stairRise .6s cubic-bezier(.22,.9,.36,1) forwards;
    position: relative;
    box-shadow: 0 4px 16px rgba(0,0,0,.08), inset 0 1px 0 rgba(255,255,255,.5);
}
[data-opening="stairs"] .stairs-step:nth-child(1) { width: 100%; animation-delay: .1s; }
[data-opening="stairs"] .stairs-step:nth-child(2) { width: 85%; animation-delay: .25s; }
[data-opening="stairs"] .stairs-step:nth-child(3) { width: 70%; animation-delay: .4s; }
[data-opening="stairs"] .stairs-step:nth-child(4) { width: 55%; animation-delay: .55s; }
[data-opening="stairs"] .stairs-step:nth-child(5) { width: 40%; animation-delay: .7s; }
@keyframes stairRise {
    from { opacity: 0; transform: translateY(50px) rotateX(8deg); }
    to { opacity: 1; transform: translateY(0) rotateX(0); }
}
[data-opening="stairs"] .stairs-glow {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 200px;
    height: 200px;
    background: radial-gradient(circle, rgba(212,175,55,.15), transparent 60%);
    pointer-events: none;
    z-index: 5;
    animation: stairGlow 4s ease-in-out infinite;
}
@keyframes stairGlow { 0%,100% { opacity: .4; } 50% { opacity: .8; } }
[data-opening="stairs"] .stairs-card {
    position: absolute;
    top: 5%;
    left: 50%;
    transform: translateX(-50%) translateY(30px);
    width: 70%;
    aspect-ratio: 3/4;
    background: var(--white);
    border: 1px solid var(--border-strong);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    opacity: 0;
    animation: cardReveal .8s 1s cubic-bezier(.19,1,.22,1) forwards;
    box-shadow: 0 20px 60px rgba(62,37,24,.15);
}
@keyframes cardReveal {
    from { opacity: 0; transform: translateX(-50%) translateY(30px); }
    to { opacity: 1; transform: translateX(-50%) translateY(0); }
}
[data-opening="stairs"] .stairs-card::before {
    content: "";
    position: absolute;
    inset: 10px;
    border: 1px solid var(--border);
}
[data-opening="stairs"] .stairs-card-content {
    position: relative;
    z-index: 2;
    padding: 30px;
}
[data-opening="stairs"] .stairs-card-content small {
    font-family: "DM Sans", sans-serif;
    font-size: 8px;
    font-weight: 500;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: var(--accent);
}
[data-opening="stairs"] .stairs-card-content h1 {
    font-family: "Cormorant Garamond", serif;
    font-size: clamp(36px,6vw,56px);
    font-weight: 300;
    font-style: italic;
    line-height: 1.1;
    color: var(--fg-heading);
    margin: 14px 0 10px;
}
[data-opening="stairs"] .stairs-card-content p {
    font-family: "DM Sans", sans-serif;
    font-size: 10px;
    font-weight: 400;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--fg-muted);
}
[data-opening="stairs"] #openButton {
    position: relative;
    z-index: 3;
    margin-top: 20px;
}

/* =====================================================
   TYPE: MAGIC WAND (magic-wand)
===================================================== */

[data-opening="magic-wand"] .envelope-scene { display: none; }
[data-opening="magic-wand"] .opening {
    background: radial-gradient(ellipse at 50% 55%, #16102E, #0A0614);
    overflow: hidden;
    perspective: 1000px;
}

.mw-star {
    position: absolute;
    width: var(--s,3px); height: var(--s,3px);
    border-radius: 50%;
    background: rgba(255,220,130,.7);
    animation: mwStarTwinkle var(--d,3s) ease-in-out infinite alternate;
}
@keyframes mwStarTwinkle { 0% { opacity: .15; transform: scale(.6); } 100% { opacity: 1; transform: scale(1.3); } }

.mw-wand {
    position: absolute;
    bottom: 28%;
    left: 50%;
    transform: translateX(-50%) rotate(-35deg);
    transform-origin: bottom center;
    z-index: 3;
    animation: mwWave 2.8s ease-in-out infinite;
}
@keyframes mwWave {
    0%,100% { transform: translateX(-50%) rotate(-35deg); }
    30% { transform: translateX(-50%) rotate(-42deg); }
    60% { transform: translateX(-50%) rotate(-28deg); }
}

.mw-shaft {
    width: 8px;
    height: 140px;
    background: linear-gradient(180deg, #F5E6C8, #C9A86C 30%, #5C3A1E 100%);
    border-radius: 4px 4px 3px 3px;
    margin: 0 auto;
    box-shadow: 2px 4px 12px rgba(0,0,0,.5);
}
.mw-tip {
    width: 14px; height: 14px;
    background: radial-gradient(circle at 35% 35%, #FFF8E8, #FFD700, #E8A000);
    border-radius: 50%;
    margin: -2px auto 0;
    box-shadow: 0 0 20px rgba(255,215,0,.6), 0 0 50px rgba(255,215,0,.3);
    animation: mwTipPulse 1.5s ease-in-out infinite;
}
@keyframes mwTipPulse {
    0%,100% { box-shadow: 0 0 20px rgba(255,215,0,.6), 0 0 50px rgba(255,215,0,.3); }
    50% { box-shadow: 0 0 35px rgba(255,215,0,.9), 0 0 80px rgba(255,215,0,.5); }
}

.mw-spark {
    position: absolute;
    width: var(--sp,4px); height: var(--sp,4px);
    border-radius: 50%;
    background: radial-gradient(circle, #FFD700, #FFF8E0);
    box-shadow: 0 0 8px rgba(255,215,0,.7);
    animation: mwSparkBurst 2s ease-out infinite;
    animation-delay: var(--sd, 0s);
}
@keyframes mwSparkBurst {
    0% { opacity: 0; transform: translate(0,0) scale(0); }
    10% { opacity: 1; transform: translate(0,0) scale(1.5); }
    100% { opacity: 0; transform: translate(var(--tx,40px), var(--ty,-80px)) scale(0); }
}

.scene-opened[data-opening="magic-wand"] .mw-wand {
    opacity: 0;
    transform: translateX(-50%) rotate(-35deg) translateY(-60px) scale(.5);
    filter: blur(8px);
    transition: transform 1.2s cubic-bezier(.4,0,.2,1), opacity 1s ease, filter 1s ease;
}
.scene-opened[data-opening="magic-wand"] .mw-spark {
    animation-play-state: running;
}

[data-opening="magic-wand"] .sig-scene { z-index: 2; }
[data-opening="magic-wand"] .sig-card {
    background: linear-gradient(165deg, #1E1535, #120E22);
    border-color: rgba(180,140,255,.3);
    box-shadow: 0 0 100px rgba(120,80,220,.15), 0 30px 80px rgba(0,0,0,.6);
}
[data-opening="magic-wand"] .sig-card h1 { color: #E8E0FF; }
[data-opening="magic-wand"] .open-button { border-color: rgba(180,140,255,.5); color: #C8A8FF; }

[data-opening="magic-wand"] .opening::after {
    content: "";
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at 50% 50%, rgba(180,140,255,.08), transparent 65%);
    pointer-events: none;
    z-index: 1;
    animation: mwGlow 4s ease-in-out infinite;
}
@keyframes mwGlow {
    0%,100% { opacity: .3; }
    50% { opacity: .7; }
}
.scene-opened[data-opening="magic-wand"] .opening::after {
    opacity: 1;
    background: radial-gradient(ellipse at 50% 50%, rgba(180,140,255,.18), transparent 55%);
    transition: all 2s ease .5s;
}

/* =====================================================
   TYPE: GLOWING DOOR (glowing-door)
===================================================== */

[data-opening="glowing-door"] .envelope-scene { display: none; }
[data-opening="glowing-door"] .opening {
    background: #040208;
    overflow: hidden;
    perspective: 1400px;
}

/* Corridor walls — perspective vanishing lines */
.gd-corridor {
    position: fixed; inset: 0; z-index: 1;
    background:
        linear-gradient(180deg, #06030E 0%, #0C0618 100%);
}
.gd-corridor::before,
.gd-corridor::after {
    content: ""; position: fixed; top: 0; bottom: 0; width: 35vw; z-index: 1; opacity: .7;
}
.gd-corridor::before {
    left: 0;
    background: linear-gradient(100deg, rgba(40,20,10,.6) 0%, transparent 70%);
    border-right: 1px solid rgba(180,140,80,.06);
}
.gd-corridor::after {
    right: 0;
    background: linear-gradient(-100deg, rgba(40,20,10,.6) 0%, transparent 70%);
    border-left: 1px solid rgba(180,140,80,.06);
}

/* Floor tiles perspective */
.gd-floor {
    position: fixed; bottom: 0; left: 0; right: 0; height: 40vh; z-index: 1;
    background:
        repeating-linear-gradient(90deg, rgba(180,140,80,.03) 0 1px, transparent 1px 60px),
        linear-gradient(0deg, rgba(15,8,4,.9) 0%, transparent 100%);
    transform: perspective(600px) rotateX(55deg);
    transform-origin: bottom center;
    opacity: .6;
}

/* Archway frame — ornate stone with gold trim */
.gd-frame {
    position: fixed;
    top: 8%; bottom: 10%;
    left: 50%; transform: translateX(-50%);
    width: min(320px, 50vw);
    z-index: 4;
    border: 6px solid #6B5228;
    border-radius: 180px 180px 0 0;
    background: transparent;
    box-shadow:
        0 0 60px rgba(0,0,0,.8),
        inset 0 0 40px rgba(0,0,0,.5),
        0 0 120px rgba(255,180,60,.08);
}
.gd-frame::before {
    content: ""; position: absolute;
    top: 14px; bottom: 14px; left: 14px; right: 14px;
    border: 3px solid #4A3A1A;
    border-radius: 164px 164px 0 0;
    box-shadow: inset 0 0 20px rgba(0,0,0,.4);
}
.gd-frame::after {
    content: ""; position: absolute;
    top: 28px; bottom: 28px; left: 28px; right: 28px;
    border: 1px solid rgba(212,175,55,.15);
    border-radius: 148px 148px 0 0;
}

/* Light seeping through crack before opening */
.gd-crack {
    position: fixed;
    top: 10%; bottom: 10%;
    left: 50%; transform: translateX(-50%);
    width: 3px; z-index: 5;
    background: linear-gradient(180deg, transparent, rgba(255,200,80,.15) 20%, rgba(255,210,100,.35) 50%, rgba(255,200,80,.15) 80%, transparent);
    filter: blur(2px);
    opacity: 0;
    animation: gdCrackPulse 3s ease-in-out 1.5s infinite;
}
@keyframes gdCrackPulse {
    0%,100% { opacity: .2; filter: blur(3px); }
    50% { opacity: .8; filter: blur(1px); }
}
.scene-opened[data-opening="glowing-door"] .gd-crack { opacity: 0; transition: opacity .3s; }

/* Double doors */
.gd-door-l,
.gd-door-r {
    position: fixed;
    top: 8%; bottom: 10%;
    width: min(162px, 25.2vw);
    z-index: 5;
    transition: transform 2.4s cubic-bezier(.22,.9,.36,1), filter 1.4s ease, opacity 1.8s ease 1.4s;
}
.gd-door-l {
    left: 50%; margin-left: -min(160px, 25vw);
    transform-origin: left center;
    background:
        linear-gradient(180deg, rgba(0,0,0,.5) 0%, transparent 8%, transparent 92%, rgba(0,0,0,.6) 100%),
        repeating-linear-gradient(90deg, rgba(0,0,0,.35) 0 4px, rgba(0,0,0,0) 10px 20px, rgba(255,255,255,.04) 28px 32px, rgba(0,0,0,0) 40px 52px),
        linear-gradient(90deg, #2E1C10, #4A3018, #3C2614, #2E1C10);
    border-radius: 170px 0 0 0;
    box-shadow: inset -8px 0 30px rgba(0,0,0,.6), 4px 0 20px rgba(0,0,0,.4);
}
.gd-door-r {
    left: 50%;
    transform-origin: right center;
    background:
        linear-gradient(180deg, rgba(0,0,0,.5) 0%, transparent 8%, transparent 92%, rgba(0,0,0,.6) 100%),
        repeating-linear-gradient(90deg, rgba(0,0,0,.35) 0 4px, rgba(0,0,0,0) 10px 20px, rgba(255,255,255,.04) 28px 32px, rgba(0,0,0,0) 40px 52px),
        linear-gradient(90deg, #2E1C10, #4A3018, #3C2614, #2E1C10);
    border-radius: 0 170px 0 0;
    box-shadow: inset 8px 0 30px rgba(0,0,0,.6), -4px 0 20px rgba(0,0,0,.4);
}

/* Door panels — raised rectangles */
.gd-door-l::before, .gd-door-r::before {
    content: ""; position: absolute;
    top: 12%; left: 12%; right: 12%; height: 36%;
    border: 2px solid rgba(180,140,80,.12);
    border-radius: 60px 60px 3px 3px;
    box-shadow: inset 0 2px 4px rgba(0,0,0,.3), 0 1px 2px rgba(255,200,80,.05);
}
.gd-door-l::after, .gd-door-r::after {
    content: ""; position: absolute;
    top: 54%; left: 12%; right: 12%; height: 32%;
    border: 2px solid rgba(180,140,80,.1);
    border-radius: 3px;
    box-shadow: inset 0 2px 4px rgba(0,0,0,.3);
}

/* Door handles — ornate gold */
.gd-handle {
    position: absolute; top: 48%; width: 18px; height: 32px; z-index: 6;
    background: linear-gradient(180deg, #C8A040, #8A6A28, #C8A040);
    border-radius: 3px 3px 8px 8px;
    box-shadow: 0 3px 10px rgba(0,0,0,.6), 0 0 12px rgba(200,160,64,.2);
    transition: transform .5s ease;
}
.gd-door-l .gd-handle { right: 14px; }
.gd-door-r .gd-handle { left: 14px; }
.scene-opened[data-opening="glowing-door"] .gd-handle { transform: rotateX(30deg); }

/* Glow behind doors — builds up */
.gd-glow {
    position: fixed;
    top: 8%; bottom: 10%;
    left: 50%; transform: translateX(-50%);
    width: min(310px, 49vw);
    z-index: 3;
    background: radial-gradient(ellipse at 50% 50%, rgba(255,200,80,.3), rgba(255,160,40,.1) 45%, transparent 75%);
    filter: blur(25px);
    opacity: .5;
    animation: gdPulse 4s ease-in-out infinite;
}
@keyframes gdPulse {
    0%,100% { opacity: .35; }
    50% { opacity: .75; }
}

/* Light rays — conic beams */
.gd-ray {
    position: fixed;
    top: 8%; bottom: 10%;
    width: min(310px, 49vw);
    left: 50%; transform: translateX(-50%);
    z-index: 3;
    background:
        conic-gradient(from 165deg at 50% 50%,
            transparent 0deg, rgba(255,200,80,.07) 8deg, transparent 16deg,
            transparent 35deg, rgba(255,200,80,.05) 43deg, transparent 51deg,
            transparent 80deg, rgba(255,200,80,.04) 88deg, transparent 96deg,
            transparent 120deg, rgba(255,200,80,.06) 128deg, transparent 136deg,
            transparent 180deg, rgba(255,200,80,.05) 188deg, transparent 196deg,
            transparent 240deg, rgba(255,200,80,.04) 248deg, transparent 256deg,
            transparent 310deg, rgba(255,200,80,.06) 318deg, transparent 326deg);
    opacity: .4;
    filter: blur(8px);
    transition: opacity 1.8s ease .8s, filter 2.5s ease 1s;
}

/* Floating dust/light particles */
.gd-particles { position: fixed; inset: 0; z-index: 3; pointer-events: none; overflow: hidden; }
.gd-particle {
    position: absolute; width: 3px; height: 3px; border-radius: 50%;
    background: rgba(255,200,80,.6);
    box-shadow: 0 0 6px rgba(255,200,80,.4);
    animation: gdFloat linear infinite;
}
.gd-particle:nth-child(1) { left: 15%; animation-duration: 7s; animation-delay: 0s; width: 2px; height: 2px; }
.gd-particle:nth-child(2) { left: 28%; animation-duration: 9s; animation-delay: 1.5s; }
.gd-particle:nth-child(3) { left: 42%; animation-duration: 6s; animation-delay: .8s; width: 4px; height: 4px; }
.gd-particle:nth-child(4) { left: 58%; animation-duration: 8s; animation-delay: 2.2s; }
.gd-particle:nth-child(5) { left: 72%; animation-duration: 7.5s; animation-delay: .5s; width: 2px; height: 2px; }
.gd-particle:nth-child(6) { left: 85%; animation-duration: 10s; animation-delay: 3s; }
.gd-particle:nth-child(7) { left: 35%; animation-duration: 8.5s; animation-delay: 1.8s; width: 2px; height: 2px; }
.gd-particle:nth-child(8) { left: 65%; animation-duration: 6.5s; animation-delay: 2.8s; }
@keyframes gdFloat {
    0% { bottom: -5%; opacity: 0; }
    10% { opacity: .8; }
    90% { opacity: .6; }
    100% { bottom: 105%; opacity: 0; }
}
.scene-opened[data-opening="glowing-door"] .gd-particles { opacity: 0; transition: opacity 1.5s; }

/* Floor glow — spills out when doors open */
.gd-floor-glow {
    position: fixed;
    bottom: 0; left: 20%; right: 20%;
    height: 35vh; z-index: 2;
    background: radial-gradient(ellipse at 50% 0%, rgba(255,200,80,.15), transparent 70%);
    opacity: 0;
    transition: opacity 2.5s ease 1s;
}

/* Light burst on open */
.gd-burst {
    position: fixed; inset: 0; z-index: 6;
    background: radial-gradient(ellipse at 50% 45%, rgba(255,220,120,.4), rgba(255,180,60,.1) 40%, transparent 70%);
    opacity: 0;
    pointer-events: none;
}
.scene-opened[data-opening="glowing-door"] .gd-burst {
    animation: gdBurst 2.5s ease-out .4s forwards;
}
@keyframes gdBurst {
    0% { opacity: 0; filter: blur(30px); }
    15% { opacity: 1; filter: blur(5px); }
    100% { opacity: 0; filter: blur(60px); }
}

/* --- OPENED STATE --- */
/* doors swing open in 3D revealing a thick stone edge before dissolving into light */
.scene-opened[data-opening="glowing-door"] .gd-door-l {
    transform: perspective(1400px) translateX(-118%) rotateY(55deg) scaleX(.86);
    filter: brightness(.28) blur(3px);
    opacity: 0;
    transition: transform 1.6s cubic-bezier(.22,.9,.3,1), filter 1.2s ease .4s, opacity .7s ease 1s;
}
.scene-opened[data-opening="glowing-door"] .gd-door-r {
    transform: perspective(1400px) translateX(118%) rotateY(-55deg) scaleX(.86);
    filter: brightness(.28) blur(3px);
    opacity: 0;
    transition: transform 1.6s cubic-bezier(.22,.9,.3,1), filter 1.2s ease .4s, opacity .7s ease 1s;
}
/* thick side edge of each swinging door (gives a real 3D slab look) */
.scene-opened[data-opening="glowing-door"] .gd-door-l::before,
.scene-opened[data-opening="glowing-door"] .gd-door-r::before {
    content: ""; position: absolute; top: 0; bottom: 0;
    background: linear-gradient(180deg, #4A2F14, #241305);
    box-shadow: 0 0 24px rgba(0,0,0,.6);
}
.scene-opened[data-opening="glowing-door"] .gd-door-l::before { right: -18px; width: 18px; }
.scene-opened[data-opening="glowing-door"] .gd-door-r::before { left: -18px; width: 18px; }
.scene-opened[data-opening="glowing-door"] .gd-glow {
    opacity: 1;
    background: radial-gradient(ellipse at 50% 50%, rgba(255,224,130,.55), rgba(255,180,60,.18) 40%, transparent 70%);
    filter: blur(8px);
    transform: scale(1.35);
    transition: all 2.2s ease .4s;
}
.scene-opened[data-opening="glowing-door"] .gd-ray {
    opacity: 1; filter: blur(2px);
    transition: all 2.8s ease .6s;
}
.scene-opened[data-opening="glowing-door"] .gd-floor-glow { opacity: 1; }

/* Scene card */
[data-opening="glowing-door"] .sig-scene { z-index: 2; }
[data-opening="glowing-door"] .sig-card {
    background: linear-gradient(165deg, #1E150C, #120E08);
    border-color: rgba(255,200,80,.4);
    box-shadow: 0 0 120px rgba(255,180,60,.15), 0 30px 80px rgba(0,0,0,.6);
}
[data-opening="glowing-door"] .sig-card h1 { color: #FFF0D0; }
[data-opening="glowing-door"] .open-button { border-color: rgba(255,200,80,.5); color: #FFD070; }

/* =====================================================
   TYPE: ANCIENT FOREST (ancient-forest)
===================================================== */

[data-opening="ancient-forest"] .envelope-scene { display: none; }
[data-opening="ancient-forest"] .opening {
    background: linear-gradient(180deg, #0C1A0C, #061008);
    overflow: hidden;
}

.af-layer {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    pointer-events: none;
}
.af-treel {
    height: 100vh; z-index: 3;
    background:
        linear-gradient(90deg, #040A04 0%, transparent 55%),
        radial-gradient(ellipse at 18% 25%, rgba(20,50,20,.8), transparent 50%);
    transition: transform 2.5s cubic-bezier(.22,.9,.36,1), opacity 2s ease 1s;
}
.af-treer {
    height: 100vh; z-index: 3;
    background:
        linear-gradient(270deg, #040A04 0%, transparent 55%),
        radial-gradient(ellipse at 82% 25%, rgba(20,50,20,.8), transparent 50%);
    transition: transform 2.5s cubic-bezier(.22,.9,.36,1), opacity 2s ease 1s;
}

.af-mid {
    height: 100vh; z-index: 2;
    background:
        radial-gradient(ellipse at 20% 30%, rgba(30,60,20,.3), transparent 40%),
        radial-gradient(ellipse at 80% 35%, rgba(25,55,18,.3), transparent 40%);
    transition: transform 2.5s cubic-bezier(.22,.9,.36,1) .15s, opacity 2s ease 1.2s;
}

.af-path {
    position: fixed;
    bottom: 0; left: 35%; right: 35%;
    height: 55vh;
    z-index: 1;
    background: linear-gradient(180deg, transparent 0%, rgba(30,20,10,.4) 40%, rgba(40,28,14,.6) 100%);
    clip-path: polygon(35% 0%, 65% 0%, 80% 100%, 20% 100%);
    transition: opacity 2s ease .5s;
}

.af-leaf {
    position: fixed;
    z-index: 4;
    font-size: var(--ls,16px);
    opacity: .6;
    animation: afLeafDrift var(--ld,10s) linear infinite;
    animation-delay: var(--lde,0s);
    pointer-events: none;
}
@keyframes afLeafDrift {
    0% { opacity: 0; transform: translate(0,0) rotate(0deg); }
    5% { opacity: .7; }
    90% { opacity: .5; }
    100% { opacity: 0; transform: translate(var(--lx,40px), 110vh) rotate(var(--lr,360deg)); }
}

.af-mist {
    position: fixed;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    background:
        radial-gradient(ellipse at 30% 70%, rgba(100,140,100,.06), transparent 50%),
        radial-gradient(ellipse at 70% 60%, rgba(80,120,80,.05), transparent 50%);
    animation: afMistDrift 12s ease-in-out infinite alternate;
}
@keyframes afMistDrift {
    0% { transform: translateX(-20px); }
    100% { transform: translateX(20px); }
}

.scene-opened[data-opening="ancient-forest"] .af-treel { transform: translateX(-50vw); opacity: 0; }
.scene-opened[data-opening="ancient-forest"] .af-treer { transform: translateX(50vw); opacity: 0; }
.scene-opened[data-opening="ancient-forest"] .af-mid { transform: translateX(-30vw) scale(.8); opacity: 0; }
.scene-opened[data-opening="ancient-forest"] .af-path { opacity: 0; transition: opacity 1.5s ease .3s; }
.scene-opened[data-opening="ancient-forest"] .af-mist { opacity: 0; transition: opacity 2s ease 1s; }

[data-opening="ancient-forest"] .sig-scene { z-index: 5; }
[data-opening="ancient-forest"] .sig-card {
    background: linear-gradient(165deg, #1A2418, #0E160C);
    border-color: rgba(120,160,90,.3);
    box-shadow: 0 0 100px rgba(80,140,60,.12), 0 30px 80px rgba(0,0,0,.6);
}
[data-opening="ancient-forest"] .sig-card h1 { color: #E0F0D0; }
[data-opening="ancient-forest"] .open-button { border-color: rgba(120,160,90,.5); color: #A0D080; }

[data-opening="ancient-forest"] .opening::after {
    content: "";
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at 50% 30%, rgba(120,180,80,.06), transparent 55%);
    pointer-events: none;
    z-index: 1;
    animation: afCanopy 6s ease-in-out infinite;
}
@keyframes afCanopy {
    0%,100% { opacity: .3; }
    50% { opacity: .65; }
}

/* =====================================================
   TYPE: OLD BOOK (old-book)
===================================================== */

[data-opening="old-book"] .opening {
    background: radial-gradient(ellipse at 50% 40%, #241709, #0A0603 75%);
    overflow: hidden;
    perspective: 1300px;
}
[data-opening="old-book"] .envelope-scene,
[data-opening="old-book"] .opening-petals,
[data-opening="old-book"] .opening-light { display: none; }

.ob-desk {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: 34vh;
    z-index: 1;
    background:
        radial-gradient(ellipse at 50% 0%, rgba(212,175,80,.08), transparent 45%),
        repeating-linear-gradient(90deg, rgba(255,255,255,.015) 0 1px, transparent 1px 90px),
        linear-gradient(180deg, #2A1C10, #160D06);
    box-shadow: inset 0 12px 50px rgba(0,0,0,.55);
}
.ob-desk::after {
    content: "";
    position: absolute;
    left: 0; right: 0; top: 0; height: 2px;
    background: linear-gradient(90deg, transparent, rgba(212,175,80,.5), transparent);
}

/* ---- book body ---- */
.ob-book {
    position: fixed;
    top: 46%; left: 50%;
    transform: translate(-50%, -50%);
    width: min(430px, 74vw);
    height: min(288px, 50vw);
    z-index: 3;
    transform-style: preserve-3d;
    animation: obBreathe 6s ease-in-out infinite;
}
@keyframes obBreathe { 0%,100% { transform: translate(-50%,-50%) translateY(0); } 50% { transform: translate(-50%,-50%) translateY(-6px); } }

.ob-spine {
    position: absolute;
    top: -6px; bottom: -6px; left: -7px;
    width: 12px;
    background: linear-gradient(180deg, #3E1E0C, #2A1408);
    transform: translateZ(-2px);
    box-shadow: -4px 0 18px rgba(0,0,0,.6);
}

/* ---- cover with embossed gold + monogram ---- */
.ob-cover {
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, #5C2E14, #3A1D0B 45%, #241006);
    border-radius: 4px 16px 16px 4px;
    box-shadow: 10px 14px 40px rgba(0,0,0,.7), -2px 0 10px rgba(0,0,0,.4), inset 0 0 30px rgba(0,0,0,.28);
    z-index: 2;
    transform-origin: left center;
    transform-style: preserve-3d;
    transition: transform 2s cubic-bezier(.16,.9,.24,1);
}
.ob-cover::before {
    content: "";
    position: absolute;
    inset: 8px;
    border: 1px solid rgba(212,175,80,.28);
    border-radius: 2px 12px 12px 2px;
}
.ob-gold {
    position: absolute;
    top: 14px; left: 0; right: 0;
    height: 1px; margin: 0 26px;
    background: linear-gradient(90deg, transparent, rgba(212,175,80,.5), transparent);
}
.ob-title {
    position: absolute;
    top: 26px; left: 0; right: 0;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    font-family: "Cormorant Garamond", serif;
    font-size: 13px; letter-spacing: 4px; text-transform: uppercase;
    color: rgba(232,200,122,.85);
}
.ob-title i { font-size: 9px; color: rgba(212,175,80,.6); }
.ob-monogram {
    position: absolute;
    top: 50%; left: 0; right: 0;
    transform: translateY(-50%);
    text-align: center;
    font-family: "Cormorant Garamond", serif;
    font-size: 64px; line-height: 1;
    color: #E9CB8B;
    text-shadow: 0 2px 12px rgba(0,0,0,.5);
}
.ob-monogram span { font-size: 36px; color: #C9A848; padding: 0 6px; }

/* ---- base page (revealed under cover) ---- */
.ob-page-0 {
    position: absolute;
    top: 6px; bottom: 6px; left: 6px; right: 6px;
    background: linear-gradient(135deg, #FFF8EE, #F0E4D0);
    border-radius: 2px 12px 12px 2px;
    box-shadow: 2px 2px 12px rgba(0,0,0,.18);
    z-index: 1;
    opacity: 0;
}
.ob-page-0::before {
    content: "";
    position: absolute;
    top: 0; bottom: 0; left: 0; width: 34px;
    background: linear-gradient(90deg, rgba(0,0,0,.09), transparent);
}
.ob-page-0::after {
    content: "";
    position: absolute;
    top: 50%; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(120,80,40,.2), transparent);
}

/* ---- turning page layers (ruled, right-half) ---- */
.ob-pl {
    position: absolute;
    top: 4px; bottom: 4px; left: 4px; right: 50%;
    background: linear-gradient(90deg, #F4E8D2, #FFF6E8 65%);
    border-radius: 3px 0 0 3px;
    transform-origin: right center;
    z-index: 4;
    opacity: 0;
    box-shadow: -4px 0 14px rgba(0,0,0,.18), 0 1px 0 rgba(255,255,255,.7);
}
.ob-pl-line {
    position: absolute;
    left: 16px; right: 12px; height: 1px;
    background: linear-gradient(90deg, rgba(150,110,60,.35), transparent);
}
.ob-pl-line.l1 { top: 26%; }
.ob-pl-line.l2 { top: 40%; }
.ob-pl-line.l3 { top: 54%; }
.ob-pl-line.l4 { top: 68%; }
.ob-pl2 { top: 3.5px; bottom: 3.5px; left: 5px; background: linear-gradient(90deg, #EFE1C8, #FFF4E2); }
.ob-pl3 { top: 3px; bottom: 3px; left: 6px; background: linear-gradient(90deg, #EBDBBC, #FDF0D8); }

/* ---- embers ---- */
.ob-ember { position: absolute; inset: 0; z-index: 2; pointer-events: none; overflow: hidden; }
.ob-ember i {
    position: absolute; bottom: -10px; width: 4px; height: 4px; border-radius: 50%;
    background: radial-gradient(circle, #FFD98A, rgba(255,140,40,.9));
    animation: obEmber linear infinite; opacity: 0;
}
.ob-ember i:nth-child(1){ left: 22%; animation-duration: 5s; animation-delay: .2s; }
.ob-ember i:nth-child(2){ left: 38%; animation-duration: 6.5s; animation-delay: 1.4s; width: 3px; }
.ob-ember i:nth-child(3){ left: 55%; animation-duration: 5.5s; animation-delay: .8s; width: 5px; }
.ob-ember i:nth-child(4){ left: 68%; animation-duration: 7s; animation-delay: 2.1s; width: 3px; }
.ob-ember i:nth-child(5){ left: 80%; animation-duration: 6s; animation-delay: .4s; }
.ob-ember i:nth-child(6){ left: 30%; animation-duration: 8s; animation-delay: 2.8s; width: 3px; }
.ob-ember i:nth-child(7){ left: 60%; animation-duration: 7.5s; animation-delay: 1s; width: 2px; }
@keyframes obEmber {
    0% { transform: translateY(0) translateX(0); opacity: 0; }
    12% { opacity: .9; }
    50% { transform: translateY(-42vh) translateX(14px); opacity: .7; }
    100% { transform: translateY(-88vh) translateX(-12px); opacity: 0; }
}

/* ===== MULTI-STAGE OPENING SEQUENCE (~6s) ===== */
/* Stage 2 — cover creaks open like a real book (3D swing w/ visible edge) */
.scene-opened[data-opening="old-book"] .ob-cover {
    transform: perspective(1500px) rotateY(-168deg) translateZ(-2px);
}
.scene-opened[data-opening="old-book"] .ob-cover::before {
    border-color: rgba(212,175,80,.22);
    box-shadow: inset -4px 0 14px rgba(0,0,0,.35);
}
/* thick cover edge becoming visible while swinging */
.scene-opened[data-opening="old-book"] .ob-cover::after {
    content: "";
    position: absolute; top: 0; bottom: 0; left: 0; right: 0;
    border-radius: 4px 16px 16px 4px;
    background: linear-gradient(90deg, rgba(0,0,0,0) 24%, rgba(90,44,15,.55) 60%, rgba(30,12,4,.9) 100%);
    box-shadow: -10px 0 40px rgba(0,0,0,.55);
}
/* base page peeks + page stack thickness */
.scene-opened[data-opening="old-book"] .ob-page-0 {
    opacity: 1;
    transition: opacity 1s ease .7s;
    box-shadow: 0 10px 30px rgba(0,0,0,.35), inset -1px 0 0 rgba(120,90,50,.35);
}
/* a few stacked page edges under the turning leaves for depth */
.scene-opened[data-opening="old-book"] .ob-page-0 {
    background:
        repeating-linear-gradient(180deg,
            rgba(0,0,0,0) 0 5px,
            rgba(150,110,60,.16) 5px 6px),
        linear-gradient(135deg, #FFF8EE, #F0E4D0);
}

/* Stage 3 — pages flip one by one with perspective + curl */
.scene-opened[data-opening="old-book"] .ob-pl  { opacity: 1; animation: obTurn .95s cubic-bezier(.3,.9,.3,1) 1.5s both; }
.scene-opened[data-opening="old-book"] .ob-pl2 { opacity: 1; animation: obTurn .95s cubic-bezier(.3,.9,.3,1) 2.7s both; }
.scene-opened[data-opening="old-book"] .ob-pl3 { opacity: 1; animation: obTurn .9s cubic-bezier(.3,.9,.3,1) 3.8s both; }
@keyframes obTurn {
    0% { transform: perspective(1200px) rotateY(0deg); opacity: 1; }
    40% { transform: perspective(1200px) rotateY(-60deg) translateX(-6px); opacity: 1; }
    100% { transform: perspective(1200px) rotateY(-176deg) translateX(-10px); opacity: 0; }
}

/* Stage 4 — invitation rises from the opened book */
[data-opening="old-book"].scene-opened .sig-scene.active .sig-card {
    animation: obCardIn 1.4s cubic-bezier(.2,.9,.3,1) 4.6s both;
    transform-style: preserve-3d;
}
@keyframes obCardIn {
    0% { transform: translateY(26px) scale(.95); opacity: 0; filter: blur(5px); }
    100% { transform: translateY(0) scale(1); opacity: 1; filter: blur(0); }
}

[data-opening="old-book"] .sig-scene { z-index: 5; }
[data-opening="old-book"] .sig-card {
    position: relative;
    z-index: 3;
    background: linear-gradient(165deg, #FFF8EE, #F5EBD8);
    border-color: rgba(140,100,50,.3);
    box-shadow: 0 0 90px rgba(212,180,90,.12), 0 30px 80px rgba(0,0,0,.45);
}
[data-opening="old-book"] .sig-card h1 { color: #3A2410; }
[data-opening="old-book"] .sig-card small { color: #8A7040; }
[data-opening="old-book"] .open-button { border-color: rgba(140,100,50,.5); color: #8A6830; }

[data-opening="old-book"] .opening::after {
    content: "";
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at 50% 45%, rgba(200,160,80,.07), transparent 58%);
    pointer-events: none;
    z-index: 1;
}

/* =====================================================
   OPENING SCENE SHARED LAYOUT
   All signature scenes share .sig-scene scaffolding
===================================================== */

.sig-scene {
    position: relative;
    width: min(520px, 88vw);
    display: none;
    flex-direction: column;
    align-items: center;
}

[data-opening] .sig-scene.active { display: flex; }

.sig-card {
    position: relative;
    width: min(420px, 82vw);
    min-height: 240px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 44px 30px;
    background: var(--white);
    border: 1px solid var(--border-strong);
    box-shadow: 0 30px 80px rgba(0,0,0,.18), 0 0 0 1px rgba(255,255,255,.08) inset;
    transform-style: preserve-3d;
    animation: sigCardFloat 6s ease-in-out infinite;
}
@keyframes sigCardFloat { 0%,100% { transform: perspective(800px) rotateX(0) translateY(0); } 50% { transform: perspective(800px) rotateX(.5deg) translateY(-4px); } }

.sig-card small {
    font-family: "DM Sans", sans-serif;
    font-size: 9px;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: var(--fg-muted);
    display: block;
    margin-bottom: 12px;
}

.sig-card h1 {
    font-family: "Italiana", serif;
    font-weight: 400;
    font-size: clamp(26px, 6vw, 40px);
    color: var(--fg-heading);
    line-height: 1.2;
    margin-bottom: 10px;
}

.sig-card p {
    font-family: "DM Sans", sans-serif;
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--fg-muted);
}

/* Reveal state — card animates in when scene opens */
[data-opening].scene-opened .sig-scene.active .sig-card {
    animation: sigCardIn .9s cubic-bezier(.22,.9,.32,1.1) both;
}
@keyframes sigCardIn {
    0% { opacity: 0; transform: perspective(800px) translateY(60px) rotateX(12deg) scale(.88); filter: blur(6px); }
    60% { opacity: 1; filter: blur(0); }
    100% { opacity: 1; transform: perspective(800px) translateY(0) rotateX(0deg) scale(1); filter: blur(0); }
}


/* =====================================================
   TYPE: ENVELOPE WITH WAX SEAL (envelope-seal)
===================================================== */

[data-opening="envelope-seal"] .envelope-scene { display: none; }
[data-opening="envelope-seal"] .opening {
    background:
        radial-gradient(circle at 50% 30%, rgba(255,255,255,.5), transparent 55%),
        linear-gradient(160deg, #F6EFE2, #E7D9BC);
    overflow: hidden;
    perspective: 1000px;
}

/* Light burst when seal breaks */
[data-opening="envelope-seal"] .es-wrap::before {
    content: "";
    position: absolute;
    top: 50%;
    left: 50%;
    width: 200%;
    height: 200%;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(255,240,200,.4), transparent 50%);
    z-index: 0;
    opacity: 0;
    transition: opacity .8s ease;
    pointer-events: none;
}
.scene-opened[data-opening="envelope-seal"] .es-wrap::before {
    opacity: 1;
}
.es-wrap {
    transform-style: preserve-3d;
    animation: esFloat 5s ease-in-out infinite;
}
@keyframes esFloat { 0%,100% { transform: perspective(600px) rotateX(0) translateY(0); } 50% { transform: perspective(600px) rotateX(1.5deg) translateY(-6px); } }

.es-wrap {
    position: relative;
    width: min(370px, 82vw);
    aspect-ratio: 8/5;
    margin-bottom: -46px;
    z-index: 3;
}

.es-letter {
    position: absolute; left: 4%; right: 4%; top: 12%; bottom: 10%;
    background: #FFFDF6;
    border: 1px solid #E2D4B4; border-radius: 4px; z-index: 1;
    box-shadow: 0 -8px 22px rgba(120,90,50,.14);
    transition: transform 1.05s cubic-bezier(.22,.9,.32,1) .6s;
}
.es-letter::before {
    content: ""; position: absolute; left: 12%; right: 12%; top: 16%; height: 3px;
    background: #C9A86A; opacity:.7; border-radius:2px;
    box-shadow: 0 10px 0 -1px rgba(201,168,106,.55), 0 20px 0 -2px rgba(201,168,106,.35);
}

.es-pocket {
    position: absolute; inset: 0; z-index: 2; border-radius: 6px;
    background:
        linear-gradient(115deg, rgba(255,255,255,.4), transparent 44%),
        linear-gradient(245deg, rgba(120,80,40,.28), transparent 44%),
        linear-gradient(170deg, #EBDCC0, #D8C096);
    box-shadow: inset 0 -16px 34px rgba(120,80,40,.2), 0 24px 60px rgba(90,60,25,.25);
}
/* paper edge on the letter for a real, lifted sheet */
.es-letter::after {
    content: ""; position: absolute; inset: 0; border-radius: 4px;
    background: linear-gradient(115deg, rgba(60,40,15,.12) 0%, rgba(60,40,15,0) 26%);
}

.es-flap {
    position: absolute; left: 0; right: 0; top: 0; height: 58%;
    background: linear-gradient(180deg, #E3CDA5, #CFAE79);
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    transform-origin: top center; z-index: 4;
    filter: drop-shadow(0 8px 12px rgba(90,60,20,.28));
    transition: transform .95s cubic-bezier(.6,0,.3,1) .5s;
}
.es-flap::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(255,255,255,.2) 0%, transparent 50%);
    clip-path: inherit;
}

.es-wax {
    position: absolute; left: 50%; top: 56%;
    transform: translate(-50%, -58%);
    width: 66px; height: 66px; border-radius: 50%;
    background: radial-gradient(circle at 34% 30%, #B23B3B, #7C1A1A 62%, #520F0F);
    color: #F3D9A4; display: flex; align-items: center; justify-content: center;
    font-family: "Italiana", serif; font-size: 27px; z-index: 5;
    box-shadow: 0 4px 12px rgba(60,10,10,.45), inset 0 -4px 8px rgba(0,0,0,.35), inset 0 3px 6px rgba(255,255,255,.18), 0 0 16px rgba(220,90,60,.6), 0 0 34px rgba(220,90,60,.35);
    transition: transform .5s ease, opacity .45s ease .15s;
    animation: waxGlow 2.4s ease-in-out infinite;
}
@keyframes waxGlow {
    0%, 100% {
        box-shadow:
            0 4px 12px rgba(60,10,10,.45),
            inset 0 -4px 8px rgba(0,0,0,.35),
            inset 0 3px 6px rgba(255,255,255,.18),
            0 0 16px rgba(220,90,60,.6),
            0 0 34px rgba(220,90,60,.32);
    }
    50% {
        box-shadow:
            0 4px 16px rgba(60,10,10,.55),
            inset 0 -4px 8px rgba(0,0,0,.35),
            inset 0 4px 8px rgba(255,255,255,.24),
            0 0 30px rgba(255,130,90,.85),
            0 0 70px rgba(255,160,100,.45),
            0 0 110px rgba(255,200,130,.18);
    }
}
.wax-seal-big::before {
    content: "";
    position: absolute;
    inset: -14px;
    border-radius: 50%;
    border: 1px solid rgba(212,175,55,.25);
    animation: waxRing 3s ease-in-out infinite;
}
@keyframes waxRing { 0%,100% { transform: scale(1); opacity: .3; } 50% { transform: scale(1.12); opacity: .6; } }

.scene-opened[data-opening="envelope-seal"] .es-wax { transform: translate(-50%,-58%) scale(3.4) rotate(30deg); opacity: 0; filter: blur(5px); transition: transform .6s cubic-bezier(.22,.9,.36,1), opacity .5s ease .05s, filter .5s; }
.scene-opened[data-opening="envelope-seal"] .es-flap { transform: perspective(900px) rotateX(-198deg) translateZ(-4px); filter: brightness(1.18) drop-shadow(0 10px 26px rgba(0,0,0,.35)); }
.scene-opened[data-opening="envelope-seal"] .es-letter { transform: perspective(900px) rotateX(-4deg) rotateZ(.6deg) translateY(-58%) scale(1.08); box-shadow: 0 26px 70px rgba(0,0,0,.28), 0 -2px 6px rgba(60,40,15,.18); }
.scene-opened[data-opening="envelope-seal"] .es-wrap { animation: esAway 1s cubic-bezier(.22,.9,.36,1) .85s forwards; }
@keyframes esAway { to { opacity: 0; transform: translateY(-70px) scale(.9); } }

/* =====================================================
   TYPE: RIBBON UNWRAP (ribbon)
===================================================== */

[data-opening="ribbon"] .envelope-scene { display: none; }
[data-opening="ribbon"] .opening {
    background: linear-gradient(160deg, #FDF4EC, #F6E2EA);
    overflow: hidden;
}

.rb-half-l, .rb-half-r {
    position: fixed; top: 0; bottom: 0; width: 52%; z-index: 4;
    background:
        linear-gradient(160deg, rgba(255,255,255,.14), transparent 40%),
        repeating-linear-gradient(90deg, rgba(255,255,255,.03) 0 8px, transparent 8px 20px),
        linear-gradient(135deg, #A83A63, #7E2549 70%, #6B1D3D);
    transition: transform 1.2s cubic-bezier(.22,.9,.36,1) .7s, filter .8s ease .7s;
}
.rb-half-l { left: 0; border-right: 3px solid #ECD28F; box-shadow: inset -30px 0 70px rgba(60,10,30,.35), inset -4px 0 20px rgba(0,0,0,.2); }
.rb-half-r { right: 0; border-left: 3px solid #ECD28F; box-shadow: inset 30px 0 70px rgba(60,10,30,.35), inset 4px 0 20px rgba(0,0,0,.2); }

.rb-band-v {
    position: fixed; top: -6%; bottom: -6%; left: calc(50% - 26px); width: 52px; z-index: 6;
    background: linear-gradient(90deg, #B8893A, #EED9A0 45%, #CAA04C);
    box-shadow: 0 0 24px rgba(140,100,40,.35);
    transition: transform .85s cubic-bezier(.55,0,.45,1) .35s, opacity .5s ease .95s;
}
.rb-band-v::after, .rb-band-h::after {
    content: "";
    position: absolute;
    background: linear-gradient(180deg, transparent, rgba(255,255,255,.3), transparent);
    animation: ribbonShimmer 2s ease-in-out infinite;
}
.rb-band-v::after { top: 0; bottom: 0; left: 0; right: 0; }
.rb-band-h::after { left: 0; right: 0; top: 0; bottom: 0; }
@keyframes ribbonShimmer { 0%,100% { opacity: .3; } 50% { opacity: .8; } }
.rb-band-h {
    position: fixed; left: -6%; right: -6%; top: calc(50% - 26px); height: 52px; z-index: 6;
    background: linear-gradient(180deg, #B8893A, #EED9A0 45%, #CAA04C);
    box-shadow: 0 0 24px rgba(140,100,40,.35);
    transition: transform .85s cubic-bezier(.55,0,.45,1) .35s, opacity .5s ease .95s;
}

.rb-glow {
    position: fixed; left: 50%; top: 50%; width: 360px; height: 360px; z-index: 5;
    transform: translate(-50%,-50%);
    background: radial-gradient(circle, rgba(255,225,160,.35), transparent 65%);
    animation: rbGlowPulse 3.2s ease-in-out infinite; pointer-events: none;
}
@keyframes rbGlowPulse { 0%,100% { opacity: .45; transform: translate(-50%,-50%) scale(.9); } 50% { opacity: .9; transform: translate(-50%,-50%) scale(1.08); } }

.rb-bow {
    position: fixed; left: 50%; top: 50%;
    transform: translate(-50%,-50%);
    width: 118px; height: 74px; z-index: 7;
    transition: transform .5s cubic-bezier(.3,1.6,.5,1), opacity .35s ease .35s;
    animation: rbBowFloat 3.4s ease-in-out infinite;
}
@keyframes rbBowFloat { 0%,100% { transform: translate(-50%,-51%) rotate(-1.5deg); } 50% { transform: translate(-50%,-49%) rotate(1.5deg); } }
.rb-bow i {
    position: absolute; top: 15px; width: 46px; height: 46px;
    background: radial-gradient(circle at 35% 30%, #F6E6BE, #D8B45E 45%, #A3762E 85%);
    box-shadow: 0 4px 10px rgba(120,80,20,.4), inset 0 0 14px rgba(255,240,200,.25);
}
.rb-bow i.bl { left: 0; border-radius: 60% 65% 65% 14% / 60% 60% 18% 60%; transform-style: preserve-3d; }
.rb-bow i.br { right: 0; border-radius: 65% 60% 14% 65% / 60% 60% 60% 18%; transform-style: preserve-3d; }
/* fabric fold highlight on each loop for a touched, 3D look */
.rb-bow i.bl::after, .rb-bow i.br::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(115deg, rgba(255,255,255,.35) 0%, rgba(255,255,255,0) 40%);
    mix-blend-mode: screen;
}
.rb-bow i.bl::before, .rb-bow i.br::before {
    content: ""; position: absolute; inset: -6px -10px -6px -10px;
    border: 2px solid rgba(255,245,210,.18);
    border-radius: 70% 70% 12% 70% / 70% 70% 16% 70%;
    transform: translateZ(-1px);
    box-shadow: 0 -4px 14px rgba(190,140,60,.35);
}
.rb-bow span {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
    width: 30px; height: 30px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #F6E6BE, #B8893A 60%, #8A5E22);
    box-shadow: 0 2px 6px rgba(90,60,10,.5), 0 0 12px rgba(232,200,122,.35), inset 0 0 8px rgba(255,240,200,.3);
    animation: bowPulse 2s ease-in-out infinite;
}
@keyframes bowPulse { 0%,100% { box-shadow: 0 2px 6px rgba(90,60,10,.5), 0 0 12px rgba(232,200,122,.3); } 50% { box-shadow: 0 2px 8px rgba(90,60,10,.6), 0 0 22px rgba(232,200,122,.5); } }

/* Ribbon tails — flutter for liveliness */
.rb-bow i.rt {
    top: 40px; width: 8px; height: 46px; background: linear-gradient(180deg,#EED9A0,#CAA04C 60%,#9c6f2c);
    border-radius: 0 0 6px 6px; box-shadow: 0 3px 8px rgba(120,80,20,.35);
}
.rb-bow i.rt.tl { left: 46px; transform-origin: top center; animation: rbTailL 2.6s ease-in-out infinite; }
.rb-bow i.rt.tr { right: 46px; transform-origin: top center; animation: rbTailR 2.6s ease-in-out infinite; }
@keyframes rbTailL { 0%,100% { transform: rotate(8deg); } 50% { transform: rotate(-10deg); } }
@keyframes rbTailR { 0%,100% { transform: rotate(-8deg); } 50% { transform: rotate(10deg); } }

/* Sparkles */
.rb-spark { position: fixed; width: 7px; height: 7px; border-radius: 50%; z-index: 8; pointer-events: none;
    background: radial-gradient(circle, #fff, #FFD98A 50%, transparent 70%); box-shadow: 0 0 10px #FFD98A;
    opacity: 0; animation: rbSpark 2.4s ease-in-out infinite; }
.rb-spark.s1 { left: 38%; top: 38%; animation-delay: 0s; }
.rb-spark.s2 { left: 60%; top: 34%; animation-delay: .4s; width: 5px; height: 5px; }
.rb-spark.s3 { left: 44%; top: 60%; animation-delay: .8s; }
.rb-spark.s4 { left: 56%; top: 62%; animation-delay: 1.2s; width: 5px; height: 5px; }
.rb-spark.s5 { left: 50%; top: 44%; animation-delay: 1.6s; }
.rb-spark.s6 { left: 33%; top: 52%; animation-delay: 2s; width: 5px; height: 5px; }
@keyframes rbSpark { 0%,100% { opacity: 0; transform: scale(.4); } 50% { opacity: 1; transform: scale(1); } }

.scene-opened[data-opening="ribbon"] .rb-glow { opacity: 0; }
