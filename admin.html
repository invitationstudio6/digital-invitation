<!DOCTYPE html>
<html lang="az">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Luna — Design Manager</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Italiana&family=DM+Sans:wght@300;400;500&display=swap"
rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    min-height:100vh;

    background:
        radial-gradient(
            circle at 15% 15%,
            rgba(155,105,80,.22),
            transparent 28%
        ),
        radial-gradient(
            circle at 85% 80%,
            rgba(117,77,58,.25),
            transparent 30%
        ),
        #17120f;

    color:#f5eee8;

    font-family:"DM Sans",sans-serif;

    padding:40px;

}

.container{

    max-width:1200px;

    margin:auto;

}

.header{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:45px;

}

.logo{

    font-family:"Italiana",serif;

    font-size:38px;

}

.back{

    color:#c8a391;

    text-decoration:none;

    font-size:10px;

    letter-spacing:2px;

    text-transform:uppercase;

}

.title{

    margin-bottom:35px;

}

.title small{

    color:#b98d78;

    font-size:8px;

    letter-spacing:5px;

    text-transform:uppercase;

}

.title h1{

    font-family:"Cormorant Garamond",serif;

    font-size:64px;

    font-weight:300;

    margin-top:10px;

}

.panel{

    background:
        rgba(255,255,255,.035);

    border:
        1px solid
        rgba(255,255,255,.09);

    padding:35px;

    margin-bottom:35px;

    backdrop-filter:blur(15px);

}

.panel h2{

    font-family:"Cormorant Garamond",serif;

    font-size:32px;

    font-weight:400;

    margin-bottom:25px;

}

.form-grid{

    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:20px;

}

.field{

    display:flex;

    flex-direction:column;

    gap:8px;

}

.field.full{

    grid-column:1/-1;

}

label{

    font-size:8px;

    letter-spacing:2px;

    text-transform:uppercase;

    color:#b99583;

}

input,
select,
textarea{

    width:100%;

    padding:14px 15px;

    background:
        rgba(0,0,0,.25);

    border:
        1px solid
        rgba(255,255,255,.12);

    color:white;

    outline:none;

    font-family:inherit;

}

select option{

    background:#211914;

}

textarea{

    min-height:100px;

    resize:vertical;

}

input:focus,
select:focus,
textarea:focus{

    border-color:#b88c76;

}

.file-box{

    border:
        1px dashed
        rgba(255,255,255,.2);

    padding:25px;

    text-align:center;

}

.file-box input{

    border:none;

    padding:10px;

}

.preview-image{

    margin-top:15px;

    width:150px;

    height:190px;

    object-fit:cover;

    display:none;

    border:
        1px solid
        rgba(255,255,255,.2);

}

.button-row{

    display:flex;

    gap:12px;

    margin-top:30px;

}

button{

    border:none;

    padding:15px 25px;

    cursor:pointer;

    font-size:8px;

    letter-spacing:2px;

    text-transform:uppercase;

}

.save{

    background:#f0e3da;

    color:#211914;

}

.clear{

    background:transparent;

    color:#fff;

    border:
        1px solid
        rgba(255,255,255,.2);

}

.designs{

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:20px;

}

.design-card{

    background:
        rgba(255,255,255,.035);

    border:
        1px solid
        rgba(255,255,255,.08);

    padding:15px;

}

.design-card img{

    width:100%;

    height:280px;

    object-fit:cover;

    display:block;

    margin-bottom:15px;

}

.design-card h3{

    font-family:"Cormorant Garamond",serif;

    font-size:27px;

    font-weight:400;

}

.design-card p{

    color:#ad8c7d;

    font-size:8px;

    letter-spacing:1px;

    margin-top:7px;

}

.card-actions{

    display:flex;

    gap:8px;

    margin-top:15px;

}

.card-actions button{

    flex:1;

    padding:10px;

}

.delete{

    background:
        rgba(150,60,50,.2);

    color:#e5aaa0;

}

.empty{

    grid-column:1/-1;

    text-align:center;

    padding:60px;

    color:rgba(255,255,255,.4);

}

@media(max-width:800px){

    body{
        padding:20px;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .field.full{
        grid-column:auto;
    }

    .designs{
        grid-template-columns:1fr;
    }

    .header{
        align-items:flex-start;
    }

    .title h1{
        font-size:50px;
    }

}

</style>

</head>


<body>


<div class="container">


<header class="header">

<div class="logo">
Luna
</div>

<a
href="index.html"
class="back">

← Back to Luna

</a>

</header>



<div class="title">

<small>
Luna Studio
</small>

<h1>
Design Manager
</h1>

</div>



<section class="panel">

<h2>
Add New Design
</h2>


<form id="designForm">


<div class="form-grid">


<div class="field">

<label>
Design Name
</label>

<input
id="name"
type="text"
placeholder="Amelia"
required>

</div>



<div class="field">

<label>
Category
</label>

<select id="category">

<option value="wedding">
Wedding
</option>

<option value="engagement">
Engagement
</option>

<option value="henna">
Henna / Kına
</option>

<option value="birthday">
Birthday
</option>

<option value="baby-shower">
Baby Shower
</option>

<option value="graduation">
Graduation
</option>

<option value="anniversary">
Anniversary
</option>

<option value="events">
Events
</option>

</select>

</div>



<div class="field">

<label>
Package
</label>

<select id="package">

<option value="basic">
Basic
</option>

<option value="premium">
Premium
</option>

<option value="luxury">
Luxury
</option>

</select>

</div>



<div class="field">

<label>
Style
</label>

<input
id="style"
type="text"
placeholder="Romantic">

</div>



<div class="field full">

<label>
Short Description
</label>

<textarea
id="description"
placeholder="Elegant wedding invitation..."></textarea>

</div>



<div class="field full">

<label>
Preview / Cover Image</label>

<div class="file-box">

<input
id="cover"
type="file"
accept="image/*"
required>

<img
id="coverPreview"
class="preview-image">

</div>

</div>



<div class="field full">

<label>
Invitation URL</label>

<input
id="url"
type="text"
placeholder="templates/wedding/amelia.html">

</div>


</div>



<div class="button-row">

<button
type="submit"
class="save">

Save Design

</button>

<button
type="button"
class="clear"
id="clearBtn">

Clear

</button>

</div>


</form>

</section>



<section class="panel">

<h2>
Your Designs
</h2>

<div
id="designList"
class="designs">

</div>

</section>



<section class="panel">

<h2>
Müştəri Dəvətnamələri
</h2>

<div
id="invitationList"
class="designs">

</div>

</section>



<section class="panel">

<h2>
Canva Dəvətnamə Yüklə (Toplu)
</h2>

<p style="color:#ad8c7d;font-size:10px;margin-bottom:20px;">
Canvasdan hazırladığınız dəvətnamə şəkillərini buradan toplu olaraq yükləyin. Hər şəkil avtomatik olaraq Luna dizaynları arasına əlavə olunacaq.
</p>


<div class="form-grid">


<div class="field full">

<label>
Canva şəkillərini seçin (çoxlu seçim)
</label>

<div class="file-box">

<input
id="bulkCover"
type="file"
accept="image/*"
multiple>

</div>

</div>


<div class="field">

<label>
Kateqoriya (hamısı üçün)
</label>

<select id="bulkCategory">

<option value="wedding">Wedding</option>
<option value="engagement">Engagement</option>
<option value="henna">Henna / Kına</option>
<option value="birthday">Birthday</option>
<option value="baby-shower">Baby Shower</option>
<option value="graduation">Graduation</option>
<option value="anniversary">Anniversary</option>
<option value="events">Events</option>

</select>

</div>


<div class="field">

<label>
Paket (hamısı üçün)
</label>

<select id="bulkPackage">

<option value="basic">Basic</option>
<option value="premium">Premium</option>
<option value="luxury">Luxury</option>

</select>

</div>


</div>


<div id="bulkPreview" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-top:20px;"></div>


<div class="button-row">

<button
type="button"
class="save"
id="bulkUploadBtn">

Hamısını yüklə

</button>

<button
type="button"
class="clear"
id="bulkClearBtn">

Təmizlə

</button>

</div>


</section>


</div>



<script>

/* =====================================================
   STORAGE
===================================================== */

const STORAGE_KEY =
    "luna_designs";


let designs =
    JSON.parse(
        localStorage.getItem(STORAGE_KEY)
    ) || [];



/* =====================================================
   ELEMENTS
===================================================== */

const form =
    document.getElementById("designForm");

const cover =
    document.getElementById("cover");

const coverPreview =
    document.getElementById("coverPreview");

const designList =
    document.getElementById("designList");



/* =====================================================
   IMAGE PREVIEW
===================================================== */

cover.addEventListener(
    "change",
    function(){

        const file =
            this.files[0];

        if(!file) return;

        const reader =
            new FileReader();

        reader.onload =
            function(e){

                coverPreview.src =
                    e.target.result;

                coverPreview.style.display =
                    "block";

            };

        reader.readAsDataURL(file);

    }
);



/* =====================================================
   ADD DESIGN
===================================================== */

form.addEventListener(
    "submit",
    function(e){

        e.preventDefault();


        const file =
            cover.files[0];

        if(!file){

            alert(
                "Please choose a cover image."
            );

            return;

        }


        const reader =
            new FileReader();


        reader.onload =
            function(e){

                const design = {

                    id:
                        Date.now(),

                    name:
                        document
                        .getElementById("name")
                        .value
                        .trim(),

                    category:
                        document
                        .getElementById("category")
                        .value,

                    package:
                        document
                        .getElementById("package")
                        .value,

                    style:
                        document
                        .getElementById("style")
                        .value
                        .trim(),

                    description:
                        document
                        .getElementById("description")
                        .value
                        .trim(),

                    image:
                        e.target.result,

                    url:
                        document
                        .getElementById("url")
                        .value
                        .trim()

                };


                designs.push(design);


                save();


                form.reset();

                coverPreview.style.display =
                    "none";

                alert(
                    "Design successfully added to Luna."
                );

            };


        reader.readAsDataURL(file);

    }
);



/* =====================================================
   SAVE
===================================================== */

function save(){

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(designs)
    );

    render();

}



/* =====================================================
   DELETE
===================================================== */

function deleteDesign(id){

    if(
        !confirm(
            "Delete this design?"
        )
    ) return;


    designs =
        designs.filter(
            design =>
                design.id !== id
        );


    save();

}



/* =====================================================
   RENDER
===================================================== */

function render(){

    designList.innerHTML = "";


    if(!designs.length){

        designList.innerHTML = `

            <div class="empty">

                No designs yet.<br><br>

                Add your first Luna design above.

            </div>

        `;

        return;

    }


    designs.forEach(
        design => {

            const card =
                document.createElement(
                    "div"
                );

            card.className =
                "design-card";


            card.innerHTML = `

                <img
                    src="${design.image}"
                    alt="${escapeHTML(design.name)}"
                >

                <h3>
                    ${escapeHTML(design.name)}
                </h3>

                <p>
                    ${escapeHTML(
                        design.category
                    )}
                    ·
                    ${escapeHTML(
                        design.package
                    )}
                </p>

                <p>
                    ${escapeHTML(
                        design.style || ""
                    )}
                </p>

                <div class="card-actions">

                    <button
                        class="delete"
                        onclick="
                            deleteDesign(${design.id})
                        ">

                        Delete

                    </button>

                </div>

            `;


            designList.appendChild(card);

        }
    );

}



/* =====================================================
   SECURITY
===================================================== */

function escapeHTML(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =====================================================
   LUNA RSVP (admin üçün)
===================================================== */

function lunaGetRsvps(invitationId){

    try{

        const raw =
            localStorage.getItem(
                "luna_rsvp_" + invitationId
            );

        return raw
            ? JSON.parse(raw)
            : [];

    }catch(error){

        return [];

    }

}



/* =====================================================
   CLEAR
===================================================== */

document
.getElementById("clearBtn")
.addEventListener(
    "click",
    function(){

        form.reset();

        coverPreview.style.display =
            "none";

    }
);



/* =====================================================
   INITIAL
===================================================== */

render();
renderInvitations();


/* =====================================================
   INVITATIONS
===================================================== */

function renderInvitations(){

    const list =
        document.getElementById(
            "invitationList"
        );

    list.innerHTML = "";


    const invitations = [];


    for(
        let i = 0;
        i < localStorage.length;
        i++
    ){

        const key =
            localStorage.key(i);


        if(
            !key.startsWith("luna_") ||
            key === "luna_last_invitation" ||
            key === "lunaLanguage" ||
            key.startsWith("luna_rsvp_") ||
            key === "luna_designs"
        ){
            continue;
        }


        try{

            const data =
                JSON.parse(
                    localStorage.getItem(key)
                );

            if(data && data.id){

                invitations.push(data);

            }

        }catch(e){}

    }


    if(!invitations.length){

        list.innerHTML = `

            <div class="empty">

                Hələ dəvətnamə yoxdur.<br><br>

                Müştəri formu vasitəsilə
                ilk dəvətnaməni yaradın.

            </div>

        `;

        return;

    }


    invitations.forEach(function(inv){

        const card =
            document.createElement("div");

        card.className =
            "design-card";


        const rsvps =
            lunaGetRsvps(inv.id);

        const rsvpYes =
            rsvps.filter(
                function(r){
                    return r.status === "yes";
                }
            ).length;

        const rsvpMaybe =
            rsvps.filter(
                function(r){
                    return r.status === "maybe";
                }
            ).length;

        const rsvpNo =
            rsvps.filter(
                function(r){
                    return r.status === "no";
                }
            ).length;


        const link =
            window.location.origin +
            window.location.pathname
                .replace(
                    /admin\.html$/,
                    ""
                ) +
            "data/invitation.html?id=" +
            inv.id;


        card.innerHTML = `

            <div style="
                padding:25px;
                background:
                    linear-gradient(
                        135deg,
                        rgba(255,255,255,.08),
                        rgba(255,255,255,.03)
                    );
                min-height:280px;
                display:flex;
                flex-direction:column;
                justify-content:center;
            ">

                <div style="
                    font-size:8px;
                    letter-spacing:3px;
                    color:#b98d78;
                    text-transform:uppercase;
                    margin-bottom:15px;
                ">
                    ${escapeHTML(
                        inv.category || "wedding"
                    )}
                    ·
                    ${escapeHTML(
                        inv.package || "basic"
                    )}
                    ·
                    ${escapeHTML(
                        inv.design || ""
                    )}
                </div>

                <h3 style="
                    font-family:'Cormorant Garamond',serif;
                    font-size:36px;
                    font-weight:400;
                    margin-bottom:15px;
                ">
                    ${escapeHTML(
                        inv.bride || ""
                    )}
                    ${inv.groom
                        ? " & " + escapeHTML(inv.groom)
                        : ""
                    }
                </h3>

                <p style="
                    color:#ad8c7d;
                    font-size:10px;
                    margin-bottom:8px;
                ">
                    ${escapeHTML(
                        inv.dateShort ||
                        inv.date ||
                        ""
                    )}
                    ·
                    ${escapeHTML(
                        inv.time || ""
                    )}
                </p>

                <p style="
                    color:#ad8c7d;
                    font-size:10px;
                    margin-bottom:20px;
                ">
                    ${escapeHTML(
                        inv.venue || ""
                    )}
                    ·
                    ${escapeHTML(
                        inv.location || ""
                    )}
                </p>

                <div style="
                    display:flex;
                    gap:15px;
                    font-size:9px;
                    color:#8a7568;
                    margin-bottom:20px;
                ">
                    <span>
                        ✓ ${rsvpYes} gəlir
                    </span>
                    <span>
                        ? ${rsvpMaybe} bəlkə
                    </span>
                    <span>
                        ✗ ${rsvpNo} gəlmir
                    </span>
                </div>

                <div class="card-actions">

                    <a
                        href="${link}"
                        target="_blank"
                        style="
                            flex:1;
                            display:block;
                            text-align:center;
                            padding:10px;
                            background:#f0e3da;
                            color:#211914;
                            text-decoration:none;
                            font-size:8px;
                            letter-spacing:2px;
                            text-transform:uppercase;
                        "
                    >
                        Dəvətnaməni aç
                    </a>

                    <button
                        class="delete"
                        onclick="
                            deleteInvitation('${escapeHTML(inv.id)}')
                        "
                    >
                        Sil
                    </button>

                </div>

            </div>

        `;


        list.appendChild(card);

    });

}



/* =====================================================
   DELETE INVITATION
===================================================== */

function deleteInvitation(id){

    if(
        !confirm(
            "Bu dəvətnaməni silmək istədiyinizə əminsiniz?"
        )
    ){
        return;
    }


    localStorage.removeItem(
        "luna_" + id
    );

    localStorage.removeItem(
        "luna_rsvp_" + id
    );


renderInvitations();



/* =====================================================
   CANVA BULK UPLOAD
===================================================== */

const bulkCover =
    document.getElementById("bulkCover");

const bulkPreview =
    document.getElementById("bulkPreview");

const bulkUploadBtn =
    document.getElementById("bulkUploadBtn");

const bulkClearBtn =
    document.getElementById("bulkClearBtn");

let bulkFiles = [];


bulkCover.addEventListener(
    "change",
    function(){

        bulkFiles =
            Array.from(this.files);

        bulkPreview.innerHTML = "";


        bulkFiles.forEach(function(file){

            const reader =
                new FileReader();

            reader.onload =
                function(e){

                    const div =
                        document.createElement("div");

                    div.style.cssText =

                        "position:relative;" +
                        "border:1px solid rgba(255,255,255,.12);" +
                        "overflow:hidden;";

                    div.innerHTML =

                        '<img src="' + e.target.result + '" ' +
                        'style="width:100%;height:180px;object-fit:cover;display:block;">' +

                        '<input ' +
                            'type="text" ' +
                            'value="' + file.name.replace(/\.[^.]+$/, "") + '" ' +
                            'data-original="' + e.target.result + '" ' +
                            'style="' +
                                'width:100%;padding:8px;background:rgba(0,0,0,.3);' +
                                'border:none;border-top:1px solid rgba(255,255,255,.1);' +
                                'color:white;font-size:9px;font-family:inherit;' +
                            '" ' +
                        '>';


                    bulkPreview.appendChild(div);

                };

            reader.readAsDataURL(file);

        });

    }
);


bulkUploadBtn.addEventListener(
    "click",
    function(){

        const inputs =
            bulkPreview.querySelectorAll("input");

        if(!inputs.length){

            alert(
                "Please select Canva images first."
            );

            return;

        }


        const category =
            document.getElementById("bulkCategory").value;

        const pkg =
            document.getElementById("bulkPackage").value;


        let count = 0;


        inputs.forEach(function(input){

            const name =
                input.value.trim();

            const image =
                input.dataset.original;


            if(!name || !image) return;


            const design = {

                id:
                    Date.now() + count,

                name:
                    name,

                category:
                    category,

                package:
                    pkg,

                style:
                    "Canva",

                description:
                    "",

                image:
                    image,

                url:
                    ""

            };


            designs.push(design);

            count++;

        });


        save();

        bulkPreview.innerHTML = "";

        bulkCover.value = "";

        bulkFiles = [];


        alert(
            count + " Canva designs uploaded to Luna."
        );

    }
);


bulkClearBtn.addEventListener(
    "click",
    function(){

        bulkCover.value = "";

        bulkPreview.innerHTML = "";

        bulkFiles = [];

    }
);

}

</script>


</body>

</html>
