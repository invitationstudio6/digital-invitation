<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luna — Events</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Italiana&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
    background:
        radial-gradient(circle at 15% 10%,rgba(157,105,79,.28),transparent 30%),
        radial-gradient(circle at 85% 75%,rgba(106,69,52,.25),transparent 35%),
        #17120f;
    color:#f5eee9;
    font-family:"DM Sans",sans-serif;
    min-height:100vh;
}
a{color:inherit;text-decoration:none}
.nav{height:78px;padding:0 5%;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(255,255,255,.08);background:rgba(23,18,15,.8);backdrop-filter:blur(20px)}
.logo{font-family:"Italiana",serif;font-size:35px}
.back{font-size:8px;letter-spacing:2px;text-transform:uppercase;color:#b89b8e}
.hero{text-align:center;padding:110px 20px 70px}
.eyebrow{font-size:8px;letter-spacing:6px;text-transform:uppercase;color:#c09a86}
h1{font-family:"Cormorant Garamond",serif;font-size:clamp(64px,12vw,120px);font-weight:300;line-height:.8;margin:30px 0}
.hero p{max-width:500px;margin:auto;color:#a9958b;font-size:13px;line-height:2}
.grid{max-width:1200px;margin:auto;padding:0 5% 120px;display:grid;grid-template-columns:repeat(3,1fr);gap:30px}
.design{transition:.4s}
.design:hover{transform:translateY(-10px)}
.preview{height:520px;padding:20px;border:1px solid rgba(255,255,255,.08);background:#211814}
.paper{height:100%;display:flex;justify-content:center;align-items:center;text-align:center;box-shadow:0 30px 60px rgba(0,0,0,.6)}
.paper-inner{width:80%;height:85%;border:1px solid rgba(255,255,255,.3);display:flex;flex-direction:column;justify-content:center;align-items:center}
.paper-inner small{font-size:7px;letter-spacing:4px;text-transform:uppercase}
.paper-inner h2{font-family:"Cormorant Garamond",serif;font-size:52px;font-weight:300;margin:30px 0}
.paper-inner p{font-size:8px;letter-spacing:2px;text-transform:uppercase}
.meta{display:flex;justify-content:space-between;padding:17px 3px}
.meta strong{font-family:"Cormorant Garamond",serif;font-size:30px;font-weight:400}
.meta span{color:#b89482;font-size:7px;letter-spacing:2px;text-transform:uppercase}
@media(max-width:850px){.grid{grid-template-columns:1fr 1fr}}
@media(max-width:550px){.grid{grid-template-columns:1fr}h1{font-size:72px}}

.paper.amelia{background:linear-gradient(145deg,#754b3b,#241a16)}
.paper.amour{background:linear-gradient(145deg,#eee1d8,#c8a99a);color:#49362e}
.paper.noir{background:linear-gradient(145deg,#111,#58443a)}
.paper.olive{background:linear-gradient(145deg,#586251,#202a23)}
.paper.blush{background:linear-gradient(145deg,#e8c4c8,#7a4450)}
.paper.gold{background:linear-gradient(145deg,#d8b36a,#3d2a12)}
.paper.sky{background:linear-gradient(145deg,#cfe4ef,#2d4450)}
.paper.mint{background:linear-gradient(145deg,#d7eadc,#2f4638)}
</style>
</head>
<body>
<nav class="nav"><a href="../index.html" class="logo">Luna</a><a href="../index.html#categories" class="back">← Collections</a></nav>
<header class="hero"><div class="eyebrow">Luna Collection</div><h1>Events</h1><p>Şam yeməyi, açılış və xüsusi axşamlar üçün.</p></header>
<main class="grid">
<a class="design" href="../client-form.html?design=noir&package=luxury&category=events">
<div class="preview"><div class="paper gold"><div class="paper-inner">
<small>Private Event</small><h2>Gala</h2><p>Black Tie</p>
</div></div></div>
<div class="meta"><strong>Gala</strong><span>luxury</span></div>
</a>
<a class="design" href="../client-form.html?design=amelia&package=premium&category=events">
<div class="preview"><div class="paper amelia"><div class="paper-inner">
<small>Private Event</small><h2>Salon</h2><p>Evening Note</p>
</div></div></div>
<div class="meta"><strong>Salon</strong><span>premium</span></div>
</a>
<a class="design" href="../client-form.html?design=olive&package=basic&category=events">
<div class="preview"><div class="paper olive"><div class="paper-inner">
<small>Private Event</small><h2>Atelier</h2><p>Intimate</p>
</div></div></div>
<div class="meta"><strong>Atelier</strong><span>basic</span></div>
</a></main>
</body></html>
