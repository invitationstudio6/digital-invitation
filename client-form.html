<script>

/* =====================================================
   GET FORM OPTIONS
===================================================== */

const params = new URLSearchParams(
    window.location.search
);

const design =
    params.get("design") || "amelia";

const packageName =
    params.get("package") || "basic";

const category =
    params.get("category") || "wedding";


/* =====================================================
   FORM
===================================================== */

document
.getElementById("invitationForm")
.addEventListener("submit", function(event) {

    event.preventDefault();


    /* -------------------------------------------------
       GET VALUES
    ------------------------------------------------- */

    const bride =
        document
        .getElementById("bride")
        .value
        .trim();

    const groom =
        document
        .getElementById("groom")
        .value
        .trim();

    const date =
        document
        .getElementById("date")
        .value;

    const time =
        document
        .getElementById("time")
        .value;

    const venue =
        document
        .getElementById("venue")
        .value
        .trim();

    const location =
        document
        .getElementById("location")
        .value
        .trim();

    const map =
        document
        .getElementById("map")
        .value
        .trim();

    const story =
        document
        .getElementById("story")
        .value
        .trim();


    /* =================================================
       CREATE ID FROM NAMES
    ================================================= */

    function createSlug(text) {

        return text
            .toLowerCase()
            .trim()

            .replace(/ə/g, "e")
            .replace(/ı/g, "i")
            .replace(/ö/g, "o")
            .replace(/ü/g, "u")
            .replace(/ş/g, "s")
            .replace(/ç/g, "c")
            .replace(/ğ/g, "g")

            .replace(/[^a-z0-9]+/g, "-")

            .replace(/^-+|-+$/g, "");
    }


    const brideSlug =
        createSlug(bride);

    const groomSlug =
        createSlug(groom);


    const invitationId =
        brideSlug +
        "-" +
        groomSlug;


    /* =================================================
       CREATE DATE SHORT
    ================================================= */

    let dateShort = "";

    if (date) {

        const parts =
            date.split("-");

        dateShort =
            parts[2] +
            " · " +
            parts[1] +
            " · " +
            parts[0];
    }


    /* =================================================
       CREATE COUNTDOWN
    ================================================= */

    const countdown =
        date +
        "T" +
        time +
        ":00";


    /* =================================================
       SAVE INVITATION DATA
    ================================================= */

    const invitationData = {

        id: invitationId,

        package: packageName,

        category: category,

        design: design,

        bride: bride,

        groom: groom,

        date: date,

        dateShort: dateShort,

        time: time,

        venue: venue,

        location: location,

        map: map,

        story: story,

        images: [],

        countdown: countdown
    };


    /* =================================================
       SAVE TO LOCAL STORAGE
    ================================================= */

    localStorage.setItem(

        "luna_" + invitationId,

        JSON.stringify(
            invitationData
        )

    );


    /* =================================================
       CREATE INVITATION LINK
    ================================================= */

    const url =
        new URL(
            "data/invitation.html",
            window.location.href
        );


    url.searchParams.set(
        "id",
        invitationId
    );


    /* =================================================
       SHOW RESULT
    ================================================= */

    const link =
        document.getElementById(
            "generatedLink"
        );


    link.href =
        url.href;


    link.textContent =
        url.href;


    document
        .getElementById("result")
        .style.display = "block";


    /* =================================================
       SAVE CURRENT CLIENT ID
    ================================================= */

    localStorage.setItem(
        "luna_last_invitation",
        invitationId
    );

});


/* =====================================================
   COPY LINK
===================================================== */

function copyLink() {

    const link =
        document.getElementById(
            "generatedLink"
        ).href;


    navigator.clipboard
        .writeText(link)
        .then(function() {

            alert(
                "Invitation link copied!"
            );

        })
        .catch(function() {

            alert(
                "Link: " + link
            );

        });

}

</script>
