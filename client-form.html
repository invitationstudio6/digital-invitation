<!DOCTYPE html>
<html lang="az">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Luna | Dəvətnamə sifarişi</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@400;500&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:"DM Sans",sans-serif;
    min-height:100vh;
    background:
        radial-gradient(circle at 15% 10%,#fff,#eee3d5,transparent 45%),
        radial-gradient(circle at 90% 90%,#e5d0ba,transparent 35%),
        #f7f2eb;
    color:#302920;
}

.container{
    width:min(800px,92%);
    margin:100px auto;
}

.logo{
    text-align:center;
    font-family:"Cormorant Garamond",serif;
    font-size:44px;
    letter-spacing:4px;
    margin-bottom:15px;
}

.subtitle{
    text-align:center;
    color:#7d7266;
    margin-bottom:45px;
}

.form-box{
    background:rgba(255,255,255,.75);
    backdrop-filter:blur(20px);
    padding:45px;
    border-radius:30px;
    border:1px solid rgba(80,60,40,.1);
    box-shadow:0 25px 70px rgba(70,50,30,.1);
}

h2{
    font-family:"Cormorant Garamond",serif;
    font-size:34px;
    margin-bottom:25px;
}

label{
    display:block;
    margin-top:20px;
    margin-bottom:7px;
    font-size:13px;
}

input,
select,
textarea{
    width:100%;
    padding:14px 16px;
    border:1px solid #d8ccbd;
    background:#fffdf9;
    border-radius:12px;
    font:inherit;
    outline:none;
}

textarea{
    min-height:130px;
    resize:vertical;
}

input:focus,
select:focus,
textarea:focus{
    border-color:#9c7b59;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

button{
    width:100%;
    margin-top:30px;
    padding:16px;
    border:0;
    border-radius:40px;
    background:#302920;
    color:white;
    font:inherit;
    cursor:pointer;
}

button:hover{
    opacity:.9;
}

.back{
    display:block;
    text-align:center;
    margin-top:25px;
    color:#7b6b5b;
    text-decoration:none;
}

@media(max-width:600px){

    .grid{
        grid-template-columns:1fr;
        gap:0;
    }

    .form-box{
        padding:25px;
    }

}

</style>

</head>

<body>

<div class="container">

<div class="logo">LUNA</div>

<p class="subtitle">
Dəvətnamənizi sizin üçün hazırlayaq ✨
</p>


<div class="form-box">

<h2>
Məlumatlarınızı daxil edin
</h2>

<form id="orderForm">

<label>
Dəvətnamə dizaynı
</label>

<select id="design" required>

<option value="">
Dizayn seçin
</option>

<option value="Amour">
Amour — Romantic
</option>

<option value="Élan">
Élan — Luxury
</option>

<option value="Noir">
Noir — Modern
</option>

<option value="Olive">
Olive — Botanical
</option>

<option value="Amelia">
Amelia — Dreamy
</option>

<option value="Henna">
Henna — Xına
</option>

</select>


<label>
Tədbir növü
</label>

<select id="eventType" required>

<option value="">Seçin</option>
<option>Toy</option>
<option>Nişan</option>
<option>Xına</option>
<option>Ad günü</option>
<option>Digər</option>

</select>


<div class="grid">

<div>

<label>
Gəlin / xanımın adı
</label>

<input id="bride" required>

</div>


<div>

<label>
Bəy / kişinin adı
</label>

<input id="groom" required>

</div>

</div>


<div class="grid">

<div>

<label>
Tarix
</label>

<input id="date" type="date" required>

</div>


<div>

<label>
Saat
</label>

<input id="time" type="time" required>

</div>

</div>


<label>
Məkan
</label>

<input id="venue" required>


<label>
Ünvan
</label>

<input id="location">


<label>
Google Maps linki
</label>

<input id="map">


<label>
Paket
</label>

<select id="package" required>

<option value="">Paket seçin</option>
<option value="basic">Basic</option>
<option value="premium">Premium</option>
<option value="luxury">Luxury</option>

</select>


<label>
Əlavə qeydlər
</label>

<textarea
id="notes"
placeholder="Musiqi, xüsusi mətn, şəkillər, rənglər və s.">
</textarea>


<button type="submit">
Məlumatları göndər →
</button>

</form>

</div>

<a class="back" href="index.html">
← Luna əsas səhifəsinə qayıt
</a>

</div>


<script>

document
.getElementById("orderForm")
.addEventListener("submit",function(e){

    e.preventDefault();

    const data={

        id:
        (
            document.getElementById("bride").value
            +
            "-"
            +
            document.getElementById("groom").value
        )
        .toLowerCase()
        .replace(/\s+/g,"-"),

        design:
        document.getElementById("design").value,

        eventType:
        document.getElementById("eventType").value,

        bride:
        document.getElementById("bride").value,

        groom:
        document.getElementById("groom").value,

        date:
        document.getElementById("date").value,

        time:
        document.getElementById("time").value,

        venue:
        document.getElementById("venue").value,

        location:
        document.getElementById("location").value,

        map:
        document.getElementById("map").value,

        package:
        document.getElementById("package").value,

        notes:
        document.getElementById("notes").value

    };


    localStorage.setItem(
        "luna_order",
        JSON.stringify(data)
    );


    alert(
        "Məlumatlarınız yadda saxlanıldı. Luna sizin üçün dəvətnaməni hazırlayacaq ✨"
    );

});

</script>

</body>
</html>
